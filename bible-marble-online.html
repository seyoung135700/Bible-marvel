<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📖 성경마블 Online</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #f0c040;
    --blue: #4fc3f7;
    --green: #2ecc71;
    --red: #e74c3c;
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2128;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --font: 'Noto Sans KR', sans-serif;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; }
  #app { height: 100vh; display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; position: relative; }

  /* ── SCREENS ── */
  .screen { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .screen.hidden { display: none; }

  /* ── LOBBY ── */
  #lobby { background: radial-gradient(ellipse at 50% 30%, #1a2a4a 0%, #0d1117 70%); justify-content: center; align-items: center; gap: 0; padding: 32px 24px; }
  .lobby-logo { font-size: 72px; margin-bottom: 8px; filter: drop-shadow(0 0 20px #f0c04080); animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .lobby-title { font-size: 38px; font-weight: 900; color: var(--gold); letter-spacing: -1px; text-shadow: 0 0 30px #f0c04060; }
  .lobby-sub { color: var(--muted); font-size: 13px; margin-top: 4px; margin-bottom: 40px; }
  .lobby-btns { width: 100%; display: flex; flex-direction: column; gap: 14px; }

  /* ── SETUP ── */
  #setup { padding: 24px; justify-content: center; gap: 16px; }
  .setup-back { position: absolute; top: 16px; left: 16px; background: none; border: none; color: var(--muted); font-size: 28px; cursor: pointer; z-index: 10; padding: 4px; }
  .setup-icon { font-size: 56px; text-align: center; }
  .setup-title { font-size: 26px; font-weight: 900; color: var(--gold); text-align: center; }

  /* ── GAME ── */
  #game { overflow: hidden; }
  .game-header { background: var(--surface); padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .game-title { font-weight: 900; color: var(--gold); font-size: 17px; }
  .room-badge { background: #0f3460; color: var(--blue); font-size: 12px; padding: 4px 12px; border-radius: 20px; font-weight: 700; letter-spacing: 1px; }
  .turn-bar { padding: 9px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); flex-shrink: 0; transition: background 0.4s; }
  .turn-bar.my-turn { background: linear-gradient(90deg, #1a3a1a, #162e16); }
  .turn-bar.other-turn { background: var(--surface2); }
  .my-turn-badge { background: var(--green); color: white; font-size: 11px; font-weight: 900; padding: 4px 12px; border-radius: 20px; }
  .tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .tab { flex: 1; padding: 10px 0; background: none; border: none; color: var(--muted); font-family: var(--font); font-size: 13px; font-weight: 700; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; }
  .tab.active { color: var(--gold); border-bottom-color: var(--gold); background: var(--surface); }
  .tab-content { flex: 1; overflow-y: auto; padding: 14px; }
  .tab-content.hidden { display: none; }
  .action-bar { padding: 14px; border-top: 1px solid var(--border); flex-shrink: 0; background: var(--bg); }

  /* ── BUTTONS ── */
  .btn { border: none; border-radius: 14px; padding: 15px 20px; font-size: 17px; font-weight: 700; cursor: pointer; font-family: var(--font); width: 100%; transition: transform 0.1s, opacity 0.1s; -webkit-tap-highlight-color: transparent; }
  .btn:active { transform: scale(0.97); opacity: 0.85; }
  .btn-gold { background: var(--gold); color: #1a1a2e; box-shadow: 0 4px 20px #f0c04040; }
  .btn-blue { background: var(--blue); color: #0d1117; box-shadow: 0 4px 20px #4fc3f740; }
  .btn-green { background: var(--green); color: white; box-shadow: 0 4px 20px #2ecc7140; }
  .btn-gray { background: #2d333b; color: var(--text); }
  .btn-red { background: var(--red); color: white; }
  .btn-sm { padding: 11px 16px; font-size: 15px; border-radius: 11px; }
  .btn-row { display: flex; gap: 10px; }
  .btn-row .btn { flex: 1; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* ── INPUTS ── */
  .inp { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; color: var(--text); font-size: 16px; font-family: var(--font); outline: none; width: 100%; transition: border-color 0.2s; }
  .inp:focus { border-color: var(--gold); }
  .inp::placeholder { color: var(--muted); }

  /* ── CARDS ── */
  .card { background: var(--surface); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; border: 1px solid var(--border); }
  .card.highlight { border-color: var(--gold); }
  .card.my-pos { border-color: var(--gold); background: #1a2010; }

  /* ── PLAYER CHIPS ── */
  .player-row { display: flex; align-items: center; gap: 10px; }
  .player-chip { display: inline-flex; align-items: center; gap: 5px; }

  /* ── BOARD SQUARES ── */
  .sq { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 9px; padding: 7px 10px; margin-bottom: 5px; border: 1px solid transparent; transition: border-color 0.2s; }
  .sq.mine { border-color: var(--gold); background: #1e2a10; }
  .sq.here { border-color: #fff; background: #1a2030; }
  .sq-idx { font-size: 10px; color: var(--muted); width: 18px; flex-shrink: 0; }
  .sq-icon { font-size: 15px; flex-shrink: 0; }
  .sq-name { flex: 1; font-size: 13px; font-weight: 700; }
  .sq-price { font-size: 11px; color: var(--blue); flex-shrink: 0; }
  .sq-owner { font-size: 13px; flex-shrink: 0; }
  .sq-players { display: flex; gap: 2px; flex-shrink: 0; }

  /* ── SCOREBOARD ── */
  .score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .score-card { background: var(--surface); border-radius: 11px; padding: 10px 12px; }
  .score-label { font-size: 11px; color: var(--muted); }
  .score-val { font-size: 17px; font-weight: 900; margin-top: 2px; }

  /* ── LOG ── */
  .log-entry { background: var(--surface); border-radius: 8px; padding: 8px 11px; margin-bottom: 5px; font-size: 13px; color: #c9d1d9; line-height: 1.5; }

  /* ── DICE ── */
  .dice-display { text-align: center; margin-bottom: 10px; }
  .dice-box { display: inline-block; font-size: 30px; background: var(--surface); padding: 8px 24px; border-radius: 20px; }
  .dice-box.double { color: var(--gold); border: 1px solid var(--gold); }

  /* ── WAITING ── */
  .waiting-list { padding: 16px; }
  .waiting-player { background: var(--surface); border-radius: 11px; padding: 11px 14px; margin-bottom: 9px; display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); }

  /* ── MODAL ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: flex; align-items: flex-end; justify-content: center; z-index: 100; max-width: 480px; margin: 0 auto; }
  .modal-overlay.hidden { display: none; }
  .modal { background: var(--surface); border-radius: 22px 22px 0 0; padding: 24px 20px 32px; width: 100%; border-top: 1px solid var(--border); }
  .modal-title { font-size: 18px; font-weight: 900; color: var(--gold); margin-bottom: 8px; }
  .modal-body { color: var(--text); font-size: 15px; line-height: 1.6; margin-bottom: 20px; }

  /* ── RANKINGS ── */
  .rank-row { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 10px; padding: 9px 12px; margin-bottom: 6px; }
  .rank-num { font-weight: 900; color: var(--muted); width: 22px; }
  .rank-num.first { color: var(--gold); }

  /* ── CONFETTI ── */
  .confetti-wrap { position: fixed; inset: 0; pointer-events: none; z-index: 200; }
  .confetti-wrap.hidden { display: none; }

  /* ── SPINNER ── */
  .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── WILDERNESS ODD/EVEN ── */
  .oddeven-btn { flex: 1; padding: 14px; font-size: 17px; font-weight: 900; border: none; border-radius: 12px; cursor: pointer; font-family: var(--font); transition: transform 0.1s; }
  .oddeven-btn:active { transform: scale(0.96); }

  /* scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* Firebase config notice */
  .config-notice { background: #1a2a1a; border: 1px solid #2ecc7160; border-radius: 14px; padding: 16px; margin-bottom: 16px; font-size: 13px; color: #8ab4d4; line-height: 1.7; }
  .config-notice code { background: #0d1117; padding: 2px 6px; border-radius: 5px; color: var(--gold); font-size: 12px; }
</style>
</head>

        </div>

    </div>

    <!-- Playing phase -->
    <div id="playing-phase" class="hidden" style="display:flex;flex-direction:column;flex:1;overflow:hidden">
      <div class="turn-bar" id="turn-bar">

      </div>

      </div>

      <div id="tc-board" class="tab-content">

      </div>
      <div id="tc-info" class="tab-content hidden">

      </div>
      <div id="tc-log" class="tab-content hidden">

      </div>

      <div class="action-bar" id="action-bar">
        <div class="dice-display hidden" id="dice-display">
          <div class="dice-box" id="dice-box"></div>
        </div>
        <div id="action-content"></div>

    </div>

  </div>

  <!-- ══════════════════ MODAL ══════════════════ -->

      <div class="modal-body" id="modal-body"></div>
      <div id="modal-actions"></div>
    </div>
  </div>

</div>

window.handleSetup = async function(){
  const name = document.getElementById("name-input").value.trim();
  if(!name){showError("닉네임을 입력해주세요");return;}
  document.getElementById("setup-loading").style.display="block";
  document.getElementById("setup-btn").disabled=true;
  if(setupMode==="create") await createRoom(name);
  else {
    const code = document.getElementById("room-input").value.trim().toUpperCase();
    if(!code||code.length!==5){showError("방 코드 5자리를 입력해주세요");document.getElementById("setup-loading").style.display="none";document.getElementById("setup-btn").disabled=false;return;}
    await joinRoom(name, code);
  }
};

  const el = document.getElementById("setup-error");
  el.textContent = msg; el.style.display = "block";
  document.getElementById("setup-loading").style.display="none";

}

// ROOM MANAGEMENT
// ══════════════════════════════════════
async function createRoom(name){
  myId = "p_"+Math.random().toString(36).slice(2,9);
  myName = name;
  roomId = Math.random().toString(36).slice(2,7).toUpperCase();
  const state = buildInitialState();
  roomRef = ref(db,"rooms/"+roomId);
  gameRef = ref(db,"rooms/"+roomId+"/state");
  logRef = ref(db,"rooms/"+roomId+"/log");
  await set(roomRef, {
    state,
    log:["🎉 방이 생성됐어요! 방 코드: "+roomId]
  });
  enterGame();
}

async function joinRoom(name, code){
  const snap = await get(ref(db,"rooms/"+code));
  if(!snap.exists()){showError("방을 찾을 수 없습니다");return;}
  const data = snap.val();
  if(data.state.phase!=="waiting"){showError("이미 시작된 게임입니다");return;}
  if(data.state.players.length>=6){showError("방이 꽉 찼습니다");return;}
  myId = "p_"+Math.random().toString(36).slice(2,9);
  myName = name;
  roomId = code;
  const idx = data.state.players.length;
  const newPlayer = makePlayer(idx);
  const updatedPlayers = [...data.state.players, newPlayer];
  const log = [...(data.log?Object.values(data.log):[]), myName+"님이 입장했습니다! 👋"];
  roomRef = ref(db,"rooms/"+roomId);
  gameRef = ref(db,"rooms/"+roomId+"/state");
  logRef = ref(db,"rooms/"+roomId+"/log");
  await update(ref(db,"rooms/"+roomId+"/state"),{players: updatedPlayers});
  await push(logRef, myName+"님이 입장했습니다! 👋");
  enterGame();
}

function buildInitialState(){
  return {
    phase:"waiting",
    players:[makePlayer(0)],
    currentTurn:0,
    landOwners:{},
    offeringPool:0,
    keyDeck:shuffle(KEY_CARDS.map(c=>c.id)),
    consecutiveDoubles:0,
    hostId:myId,
  };
}

function makePlayer(idx){
  return {
    id:myId, name:myName,
    money:calcInitMoney(), pos:0,
    lands:[], stars:0,
    inWilderness:false, wildernessCount:0,
    cards:[],
    color:COLORS[idx], emoji:EMOJIS[idx]
  };
}

function enterGame(){
  document.getElementById("room-badge").textContent = "방 코드: "+roomId;
  showScreen("game");
  subscribeGame();
}

function subscribeGame(){
  if(unsubGame) unsubGame();
  if(unsubLog) unsubLog();
  unsubGame = onValue(gameRef, snap=>{
    if(!snap.exists()) return;
    gameState = snap.val();
    renderGame();
  });
  unsubLog = onValue(logRef, snap=>{
    if(!snap.exists()) return;
    const entries = Object.values(snap.val()).reverse();
    const list = document.getElementById("log-list");
    list.innerHTML = entries.map(e=>`<div class="log-entry">${e}</div>`).join("");
  });
}

function renderGame(){
  if(!gameState) return;
  if(gameState.phase==="waiting") renderWaiting();
  else renderPlaying();
}

function renderWaiting(){
  document.getElementById("waiting-phase").classList.remove("hidden");
  document.getElementById("playing-phase").classList.add("hidden");
  const list = document.getElementById("waiting-players");
  list.innerHTML = gameState.players.map(p=>`
    <div class="waiting-player">
      <span style="font-size:26px">${p.emoji}</span>
      <span style="color:${p.color};font-weight:700">${p.name}</span>
      ${p.id===myId?'<span style="color:var(--blue);font-size:12px">(나)</span>':''}
    </div>
  `).join("");
  const isHost = gameState.players[0]?.id===myId;
  document.getElementById("start-btn-wrap").style.display = isHost?"block":"none";
  document.getElementById("waiting-hint").style.display = isHost?"none":"block";
}

function renderPlaying(){
  document.getElementById("waiting-phase").classList.add("hidden");
  document.getElementById("playing-phase").classList.remove("hidden");

  const cur = gameState.players[gameState.currentTurn];
  const isMyTurn = cur?.id===myId;
  const me = gameState.players.find(p=>p.id===myId);

  // Turn bar
  const tb = document.getElementById("turn-bar");
  tb.className = "turn-bar "+(isMyTurn?"my-turn":"other-turn");
  document.getElementById("turn-emoji").textContent = cur?.emoji||"";
  document.getElementById("turn-name").textContent = cur?.name||"";
  const badge = document.getElementById("my-turn-badge");
  badge.classList.toggle("hidden", !isMyTurn);

  // Board
  renderBoard(isMyTurn, me);
  // Info
  renderInfo(me);
  // Actions
  renderActions(isMyTurn, me, cur);
}

          <div style="color:${p.color};font-size:12px;margin-bottom:4px">${p.emoji} ${p.name}</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            ${p.lands.map(pos=>`<button class="btn btn-sm btn-gray" style="flex:none;width:auto;padding:6px 10px;font-size:12px" onclick="stealLand('${p.id}',${pos})">${SQUARES[pos].name}</button>`).join("")}
          </div>
        </div>
      `).join("")}
    `;
    return;
  }

  if(pendingAction?.type==="take_row2"){
    const row2lands = SQUARES.filter(s=>s.id>=15&&s.id<=32&&s.type==="land");
    const owners2 = gameState.landOwners||{};
    const free = row2lands.filter(s=>!owners2[s.id]||owners2[s.id]===myId);
    if(!free.length){addLog("2열에 가져올 수 있는 땅이 없습니다.");endTurn();return;}
    ac.innerHTML=`
      <div style="color:var(--muted);font-size:13px;margin-bottom:8px">🗺️ 2열에서 가져올 땅 선택</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${free.map(s=>`<button class="btn btn-sm btn-blue" style="flex:none;width:auto;padding:6px 10px;font-size:12px" onclick="takeRow2Land(${s.id})">${s.name}</button>`).join("")}
      </div>
    `;
    return;
  }

  // Normal roll / buy / pass
  let html = "";
  if(isUnowned){
    html += `
      <div style="background:var(--surface);border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid var(--gold)">
        <div style="font-weight:700;margin-bottom:4px">🏛️ ${sq.name}</div>
        <div style="color:var(--muted);font-size:12px;margin-bottom:8px">${sq.desc||""}</div>
        <div style="display:flex;justify-content:space-between;font-size:13px">
          <span>💰 구매가: <b style="color:var(--gold)">${sq.price}만원</b></span>
          <span>⭐ 별: <b style="color:#ffd700">${sq.stars}개</b></span>
          <span>🚶 통행료: <b style="color:var(--blue)">${sq.toll}만원</b></span>
        </div>
      </div>
      <div class="btn-row">
        ${canBuy?`<button class="btn btn-green btn-sm" onclick="buyLand()">🏡 구매 (${sq.price}만원)</button>`:""}
        <button class="btn btn-gray btn-sm" onclick="skipBuy()">⏭️ 패스</button>
      </div>
    `;
  } else {
    html += `<button class="btn btn-gold" onclick="rollDice()">🎲 주사위 굴리기</button>`;
    if((me.cards||[]).includes(5)){
      html += `<button class="btn btn-blue btn-sm" style="margin-top:8px" onclick="useExtraDice()">🎲 추가 주사위 사용 (보관 카드)</button>`;
    }
  }
  ac.innerHTML = html;
}

// ══════════════════════════════════════
// GAME ACTIONS
// ══════════════════════════════════════
window.startGame = async function(){
  if(!gameState||gameState.players.length<2){showModal("알림","최소 2명이 필요합니다!");return;}
  const st = {...gameState, phase:"playing", currentTurn:0};
  await set(gameRef, st);
  await addLog("🎮 게임이 시작되었습니다!");
};

window.rollDice = async function(){
  if(!gameState) return;
  const d1=Math.floor(Math.random()*6)+1;
  const d2=Math.floor(Math.random()*6)+1;
  showDice(d1,d2);
  await processTurn(d1,d2);
};

window.useExtraDice = async function(){
  if(!gameState) return;
  // Remove extra_dice card
  const st = JSON.parse(JSON.stringify(gameState));
  const me = st.players.find(p=>p.id===myId);
  me.cards = me.cards.filter(c=>c!==5);
  await set(gameRef,st);
  await addLog(`🎲 ${myName}: 추가 주사위 카드 사용!`);
  await rollDice();
};

function showDice(d1,d2){
  const dd = document.getElementById("dice-display");
  const db2 = document.getElementById("dice-box");
  dd.classList.remove("hidden");
  const isDouble = d1===d2;
  db2.className = "dice-box"+(isDouble?" double":"");
  db2.textContent = `${diceEmoji(d1)} ${diceEmoji(d2)}${isDouble?" 🎯 더블!":""}`;
}

async function processTurn(d1,d2){
  let st = JSON.parse(JSON.stringify(gameState));
  const cur = st.players[st.currentTurn];
  const isDouble = d1===d2;
  let logs = [];
  logs.push(`🎲 ${cur.name}: 주사위 ${d1}+${d2}=${d1+d2}${isDouble?" (더블!)":""}`);

  // Wilderness check
  if(cur.inWilderness){
    if(isDouble){
      cur.inWilderness=false; cur.wildernessCount=0;
      logs.push(`🌟 ${cur.name}: 더블로 광야 탈출!`);
      // continue moving
    } else {
      // Show choice UI
      pendingAction={type:"wilderness_choice",d1,d2};
      await set(gameRef,st);
      for(const l of logs) await addLog(l);
      renderActions(true, cur, cur);
      return;
    }
  }

  // Double 3 consecutive
  let consec = (st.consecutiveDoubles||0);
  if(isDouble){ consec++; } else { consec=0; }
  st.consecutiveDoubles=consec;
  if(consec>=3){
    cur.inWilderness=true; cur.wildernessCount=0;
    cur.pos=14; st.consecutiveDoubles=0;
    logs.push(`⚠️ ${cur.name}: 더블 3연속! 광야로!`);
    await set(gameRef,st);
    for(const l of logs) await addLog(l);
    if(!isDouble) advanceTurn(st);
    await set(gameRef,st);
    return;
  }

  // Move
  const steps=d1+d2;
  const oldPos=cur.pos;
  let newPos=(oldPos+steps)%TOTAL;
  if(newPos<oldPos||newPos===0){
    if(newPos===0){cur.money+=100;logs.push(`🏠 ${cur.name}: 시작/마침 정착 +100만원`);}
    else{cur.money+=50;logs.push(`💰 ${cur.name}: 시작 통과 +50만원`);}
  }
  cur.pos=newPos;
  const sq=SQUARES[newPos];
  logs.push(`📍 ${cur.name}: ${sq.name}에 도착`);

  // Handle square
  let needBuyPrompt=false;
  if(sq.type==="land"){
    const ownerId=st.landOwners?.[newPos];
    if(!ownerId){
      needBuyPrompt=true;
    } else if(ownerId!==cur.id){
      const ownerP=st.players.find(p=>p.id===ownerId);
      const hasTF=(cur.cards||[]).includes(19);
      if(hasTF){
        cur.cards=cur.cards.filter(c=>c!==19);
        logs.push(`🎫 ${cur.name}: 통행권 사용! 통행료 면제`);
      } else if(ownerP){
        const toll=sq.toll;
        const paid=Math.min(cur.money,toll);
        cur.money-=paid; ownerP.money+=paid;
        logs.push(`💸 ${cur.name}→${ownerP.name}: 통행료 ${toll}만원`);
      }
    } else {
      logs.push(`🏠 ${cur.name}: 내 땅!`);
    }
  } else if(sq.type==="key"){
    const deck=[...(st.keyDeck||[])];
    if(!deck.length){ st.keyDeck=shuffle(KEY_CARDS.map(c=>c.id)); }
    const cardId=st.keyDeck.shift();
    st.keyDeck=st.keyDeck;
    const card=KEY_CARDS.find(c=>c.id===cardId);
    logs.push(`🔑 ${cur.name}: 천국열쇠! — ${card.text}`);
    const result=applyKeyCard(st,cur,card);
    if(result.needAction){ pendingAction=result.needAction; needBuyPrompt=true; }
  } else if(sq.type==="wilderness"){
    if(!cur.inWilderness){
      cur.inWilderness=true; cur.wildernessCount=0;
      logs.push(`🏜️ ${cur.name}: 광야에 갇혔습니다!`);
    }
  } else if(sq.type==="train"){
    pendingAction={type:"train_move"};
    needBuyPrompt=true;
    logs.push(`🚂 ${cur.name}: 구원열차! 원하는 곳으로 이동하세요`);
  } else if(sq.type==="offering"){
    const pool=st.offeringPool||0;
    const has=cur.money;
    if(has>=100){cur.money-=100;st.offeringPool=pool+100;logs.push(`💌 ${cur.name}: 사랑의 헌금 100만원`);}
    else if(has>=50){cur.money-=50;st.offeringPool=pool+50;logs.push(`💌 ${cur.name}: 사랑의 헌금 50만원`);}
    else{logs.push(`💌 ${cur.name}: 헌금할 돈이 부족합니다`);}
    // Check if offering pool exists - player can collect
    if(pool>0&&!needBuyPrompt){
      cur.money+=pool; st.offeringPool=0;
      logs.push(`💝 ${cur.name}: 헌금 풀 ${pool}만원 획득!`);
    }
  } else if(sq.type==="start"){
    cur.money+=100;
    logs.push(`🏠 ${cur.name}: 시작 정착 +100만원`);
  }

  if(!needBuyPrompt && !isDouble){ advanceTurn(st); }
  else if(!needBuyPrompt && isDouble){ logs.push(`🎯 더블! ${cur.name} 한 번 더!`); }

  await set(gameRef,st);
  for(const l of logs) await addLog(l);
}

function applyKeyCard(st,cur,card){
  let needAction=null;
  switch(card.type){
    case"money": cur.money+=card.amount; break;
    case"move_start": cur.pos=0; cur.money+=100; break;
    case"move_wilderness": cur.pos=14;cur.inWilderness=true;cur.wildernessCount=0; break;
    case"move_train": cur.pos=33;needAction={type:"train_move"}; break;
    case"move_offering": cur.pos=47;break;
    case"pay_offering": cur.money-=Math.min(cur.money,card.amount);st.offeringPool=(st.offeringPool||0)+card.amount;break;
    case"steal": needAction={type:"steal_land"}; break;
    case"take_row2": needAction={type:"take_row2"}; break;
    case"extra_dice":
    case"escape_wilderness":
    case"toll_free":
      if(card.keepable){cur.cards=[...(cur.cards||[]),card.id];}
      break;
    default: break;
  }
  return{needAction};
}

window.buyLand = async function(){
  let st=JSON.parse(JSON.stringify(gameState));
  const cur=st.players[st.currentTurn];
  const pos=cur.pos; const sq=SQUARES[pos];
  if(sq.type!=="land"||st.landOwners?.[pos]||cur.money<sq.price) return;
  cur.money-=sq.price;
  st.landOwners={...st.landOwners,[pos]:cur.id};
  cur.lands=[...(cur.lands||[]),pos];
  cur.stars=(cur.stars||0)+sq.stars;
  advanceTurn(st);
  await set(gameRef,st);
  await addLog(`🏡 ${cur.name}: ${sq.name} 구매! (${sq.price}만, ⭐${sq.stars})`);
  pendingAction=null;
};

window.skipBuy = async function(){
  let st=JSON.parse(JSON.stringify(gameState));
  const cur=st.players[st.currentTurn];
  advanceTurn(st);
  await set(gameRef,st);
  await addLog(`⏭️ ${cur.name}: 패스`);
  pendingAction=null;
};

window.wildernessTry = function(method){
  if(method==="double"){
    // Roll two dice, need double
    const d1=Math.floor(Math.random()*6)+1;
    const d2=Math.floor(Math.random()*6)+1;
    showDice(d1,d2);
    processWilderness(d1===d2);
  } else {
    pendingAction={type:"oddeven_choice"};
    renderActions(true,gameState.players.find(p=>p.id===myId),null);
  }
};

window.oddevenPick = function(choice){
  const d=Math.floor(Math.random()*6)+1;
  const isOdd=d%2===1;
  const won=(choice==="odd"&&isOdd)||(choice==="even"&&!isOdd);
  showDice(d,d);
  addLog(`🎲 ${myName}: 주사위 ${d} (${isOdd?"홀":"짝"}) — ${choice==="odd"?"홀":"짝"} 선택 → ${won?"탈출!":"실패"}`);
  processWilderness(won);
};

async function processWilderness(escaped){
  let st=JSON.parse(JSON.stringify(gameState));
  const cur=st.players[st.currentTurn];
  if(escaped){
    cur.inWilderness=false; cur.wildernessCount=0;
    await addLog(`🌟 ${cur.name}: 광야 탈출!`);
    // Roll normally
    pendingAction=null;
    await set(gameRef,st);
    await rollDice();
  } else {
    cur.wildernessCount=(cur.wildernessCount||0)+1;
    advanceTurn(st);
    await set(gameRef,st);
    await addLog(`😔 ${cur.name}: 광야 탈출 실패`);
    pendingAction=null;
  }
}

window.confirmTrainMove = async function(){
  const dest=parseInt(document.getElementById("train-dest").value);
  let st=JSON.parse(JSON.stringify(gameState));
  const cur=st.players[st.currentTurn];
  cur.pos=dest;
  advanceTurn(st);
  await set(gameRef,st);
  await addLog(`🚂 ${cur.name}: ${SQUARES[dest].name}으로 이동!`);
  pendingAction=null;
};

window.stealLand = async function(fromId,pos){
  let st=JSON.parse(JSON.stringify(gameState));
  const cur=st.players[st.currentTurn];
  const from=st.players.find(p=>p.id===fromId);
  if(!from||!from.lands.includes(pos)) return;
  // Transfer land
  from.lands=from.lands.filter(p=>p!==pos);
  from.stars=Math.max(0,from.stars-(SQUARES[pos].stars||0));
  cur.lands=[...(cur.lands||[]),pos];
  cur.stars=(cur.stars||0)+(SQUARES[pos].stars||0);
  st.landOwners={...st.landOwners,[pos]:cur.id};
  advanceTurn(st);
  await set(gameRef,st);
  await addLog(`👊 ${cur.name}: ${from.name}의 ${SQUARES[pos].name} 획득!`);
  pendingAction=null;
};

window.takeRow2Land = async function(pos){
  let st=JSON.parse(JSON.stringify(gameState));
  const cur=st.players[st.currentTurn];
  const sq=SQUARES[pos];
  // Free land
  cur.lands=[...(cur.lands||[]),pos];
  cur.stars=(cur.stars||0)+sq.stars;
  st.landOwners={...st.landOwners,[pos]:cur.id};
  advanceTurn(st);
  await set(gameRef,st);
  await addLog(`🗺️ ${cur.name}: 2열 ${sq.name} 획득!`);
  pendingAction=null;
};

function advanceTurn(st){
  st.currentTurn=(st.currentTurn+1)%st.players.length;
}

function endTurn(){
  pendingAction=null;
  skipBuy();
}

async function addLog(msg){
  if(!logRef) return;
  await push(logRef, msg);
}

window.switchTab = function(tab){
  ["board","info","log"].forEach(t=>{
    document.getElementById("tc-"+t).classList.toggle("hidden",t!==tab);
    document.getElementById("tab-"+t).classList.toggle("active",t===tab);
  });
};

function showModal(title,body,actions=""){
  document.getElementById("modal-title").textContent=title;
  document.getElementById("modal-body").innerHTML=body;
  document.getElementById("modal-actions").innerHTML=actions||`<button class="btn btn-gray" onclick="closeModal()">확인</button>`;
  document.getElementById("modal-overlay").classList.remove("hidden");
}
window.closeModal=function(){document.getElementById("modal-overlay").classList.add("hidden");};
