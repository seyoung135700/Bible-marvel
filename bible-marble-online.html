<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#f0c040;--blue:#4fc3f7;--green:#2ecc71;--red:#e74c3c;--bg:#0d1117;--sur:#161b22;--sur2:#1c2128;--bor:#30363d;--text:#e6edf3;--muted:#8b949e;--font:'Noto Sans KR',sans-serif}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden}
#app{height:100vh;display:flex;flex-direction:column;max-width:500px;margin:0 auto;position:relative}
.screen{flex:1;display:flex;flex-direction:column;overflow:hidden}
.gone{display:none!important}

/* LOBBY */
#lobby{background:radial-gradient(ellipse at 50% 30%,#1a2a4a,#0d1117);justify-content:center;align-items:center;padding:32px 24px}
.logo{font-size:72px;margin-bottom:8px;animation:fl 3s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.title{font-size:38px;font-weight:900;color:var(--gold);letter-spacing:-1px;text-shadow:0 0 30px #f0c04060}
.sub{color:var(--muted);font-size:13px;margin-top:4px;margin-bottom:40px}
.lbtns{width:100%;display:flex;flex-direction:column;gap:14px}

/* SETUP */
#setup{padding:24px;justify-content:center;gap:14px;position:relative}
.backbtn{position:absolute;top:16px;left:16px;background:none;border:none;color:var(--muted);font-size:28px;cursor:pointer}

/* BUTTONS */
.btn{border:none;border-radius:14px;padding:15px 20px;font-size:17px;font-weight:700;cursor:pointer;font-family:var(--font);width:100%;transition:transform .1s,opacity .1s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97);opacity:.85}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.gold{background:var(--gold);color:#1a1a2e;box-shadow:0 4px 20px #f0c04040}
.bblue{background:var(--blue);color:#0d1117}
.bgreen{background:var(--green);color:#fff}
.bgray{background:#2d333b;color:var(--text)}
.bred{background:var(--red);color:#fff}
.bsm{padding:11px 16px;font-size:14px;border-radius:11px}
.brow{display:flex;gap:10px}
.brow .btn{flex:1}
.inp{background:var(--sur2);border:1px solid var(--bor);border-radius:12px;padding:14px 16px;color:var(--text);font-size:16px;font-family:var(--font);outline:none;width:100%}
.inp:focus{border-color:var(--gold)}
.inp::placeholder{color:var(--muted)}

/* GAME HEADER */
.ghdr{background:var(--sur);padding:8px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bor);flex-shrink:0;gap:8px}
.gtitle{font-weight:900;color:var(--gold);font-size:15px;flex-shrink:0}
.rbadge{background:#0f3460;color:var(--blue);font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700;flex-shrink:0}
.timer-box{background:#1a2a1a;border:1px solid var(--green);color:var(--green);font-size:13px;font-weight:900;padding:3px 10px;border-radius:20px;flex-shrink:0}
.timer-box.warn{background:#2a1a1a;border-color:var(--red);color:var(--red)}

/* TURN BAR */
.tbar{padding:8px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bor);flex-shrink:0}
.tbar.myturn{background:linear-gradient(90deg,#1a3a1a,#162e16)}
.tbar.other{background:var(--sur2)}
.mybadge{background:var(--green);color:#fff;font-size:11px;font-weight:900;padding:3px 10px;border-radius:20px;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--bor);flex-shrink:0}
.tab{flex:1;padding:9px 0;background:none;border:none;color:var(--muted);font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:var(--gold);border-bottom-color:var(--gold);background:var(--sur)}
.tc{flex:1;overflow-y:auto;padding:12px}

/* ACTION BAR */
.abar{padding:12px 14px;border-top:1px solid var(--bor);flex-shrink:0;background:var(--bg)}
.pplay{display:flex;flex-direction:column;flex:1;overflow:hidden}

/* BOARD TAB - 보드판 스타일 */
.board-wrap{padding:8px}
.player-summary{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pscard{border-radius:10px;padding:8px 10px;border:1px solid transparent;min-width:80px}
.pscard.active{border-color:var(--gold)}

/* 보드 섹션 */
.board-section{margin-bottom:12px}
.section-label{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;padding-left:4px}
.sq-row{display:flex;gap:4px;flex-wrap:wrap}
.sq{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;padding:6px 4px;border:2px solid transparent;cursor:default;min-width:52px;flex:1;position:relative;transition:transform .15s}
.sq.land{background:var(--sur);border-color:var(--bor)}
.sq.land.mine{background:#1a2e0a;border-color:var(--green)}
.sq.land.others{background:#1a1a2e;border-color:var(--blue)}
.sq.here{transform:scale(1.08);box-shadow:0 0 12px #f0c04080}
.sq.special{background:linear-gradient(135deg,#1a2040,#0a1530);border-color:#4a6080}
.sq.key-sq{background:linear-gradient(135deg,#2a2010,#1a1508);border-color:#a07820}
.sq-name{font-size:10px;font-weight:700;text-align:center;line-height:1.2;margin-bottom:2px}
.sq-price{font-size:9px;color:var(--blue);font-weight:700}
.sq-players{display:flex;gap:1px;flex-wrap:wrap;justify-content:center;margin-top:2px}
.sq-owner{font-size:8px;position:absolute;top:3px;right:3px}
.sq-stars{font-size:8px;color:#ffd700}
.sq-icon{font-size:16px;margin-bottom:2px}

/* 주사위 */
.dice-area{text-align:center;margin-bottom:10px}
.dice-wrap{display:flex;gap:16px;justify-content:center;margin-bottom:8px}
.die{width:56px;height:56px;background:white;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 15px rgba(0,0,0,.5);transition:transform .3s;border:3px solid #ddd}
.die.rolling{animation:roll .4s ease-in-out}
.die.double{border-color:var(--gold);box-shadow:0 4px 20px #f0c04060}
@keyframes roll{0%{transform:rotate(0deg) scale(1)}50%{transform:rotate(180deg) scale(1.2)}100%{transform:rotate(360deg) scale(1)}}
.double-badge{background:var(--gold);color:#1a1a2e;font-size:12px;font-weight:900;padding:3px 12px;border-radius:20px;display:inline-block;margin-bottom:6px}

/* CARDS */
.card{background:var(--sur);border-radius:12px;padding:11px 13px;margin-bottom:7px;border:1px solid var(--bor)}
.card.hl{border-color:var(--gold);background:#1e1a08}

/* LOG */
.loge{background:var(--sur);border-radius:8px;padding:7px 10px;margin-bottom:4px;font-size:12px;color:#c9d1d9;line-height:1.5}

/* RANK */
.rrow{display:flex;align-items:center;gap:10px;background:var(--sur);border-radius:10px;padding:8px 11px;margin-bottom:5px}

/* SPINNER */
.spin{display:inline-block;width:20px;height:20px;border:3px solid var(--bor);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* MODAL */
.mov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:flex-end;justify-content:center;z-index:100;max-width:500px;margin:0 auto}
.mo{background:#1c2128;border-radius:22px 22px 0 0;padding:24px 20px 32px;width:100%;border-top:1px solid var(--bor);max-height:80vh;overflow-y:auto}
.mo-title{font-size:18px;font-weight:900;color:var(--gold);margin-bottom:12px}

/* KEY CARD POPUP */
.key-card{background:linear-gradient(135deg,#2a2010,#1a1508);border:2px solid #a07820;border-radius:16px;padding:20px;text-align:center;margin-bottom:14px}
.key-card-icon{font-size:48px;margin-bottom:8px}
.key-card-text{font-size:15px;line-height:1.6;color:var(--text)}

::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--bor);border-radius:4px}
</style>
</head>

function cm(){return 3+4+15+50+40+100+200+500;}
function shuf(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}
function g(id){return document.getElementById(id);}

var db,rRef,gRef,lRef;
var myId="",myName="",roomId="",gs=null,mode="create",pa=null;

document.addEventListener("DOMContentLoaded",function(){
  try{firebase.initializeApp(FC);db=firebase.database();}
  catch(e){alert("Firebase 오류: "+e.message);return;}

  g("bc").onclick=function(){showSetup("create");};

      b.classList.remove("bgray");b.classList.add("gold");
      selectedTime=parseInt(b.dataset.min);
    };
  });

  document.querySelectorAll(".tab").forEach(function(t){

function showScr(id){
  ["lobby","setup","game"].forEach(function(s){g(s).classList.add("gone");});
  g(id).classList.remove("gone");
}
function showSetup(m){
  mode=m;
  g("sico").textContent=m==="create"?"🏠":"🚪";
  g("stitle").textContent=m==="create"?"방 만들기":"방 참가하기";
  g("sbtn").textContent=m==="create"?"방 생성":"참가하기";
  g("ri").classList.toggle("gone",m!=="join");
  g("time-wrap").classList.toggle("gone",m!=="create");
  g("serr").style.display="none";g("ni").value="";g("rc").value="";
  showScr("setup");
}
function serr(msg){g("serr").textContent=msg;g("serr").style.display="block";g("sld").classList.add("gone");g("sbtn").disabled=false;}

function mkP(idx){return{id:myId,name:myName,money:cm(),pos:0,lands:[],stars:0,inWilderness:false,wildernessCount:0,cards:[],color:CL[idx],emoji:EM[idx]};}

function handleSetup(){
  var nm=g("ni").value.trim();
  if(!nm){serr("닉네임을 입력해주세요");return;}
  g("sld").classList.remove("gone");g("sbtn").disabled=true;g("serr").style.display="none";
  if(mode==="create"){createRoom(nm);}
  else{
    var cd=g("rc").value.trim().toUpperCase();
    if(!cd||cd.length!==5){serr("방 코드 5자리를 입력해주세요");return;}
    joinRoom(nm,cd);
  }
}

function createRoom(nm){
  myId="p_"+Math.random().toString(36).slice(2,9);myName=nm;
  roomId=Math.random().toString(36).slice(2,7).toUpperCase();
  var st={
    phase:"waiting",players:[mkP(0)],
    currentTurn:0,landOwners:{},offeringPool:0,
    keyDeck:shuf(KC.map(function(c){return c.id;})),
    consecutiveDoubles:0,hostId:myId,
    timeLimitMin:selectedTime,startTime:0,
    needAction:false
  };
  rRef=db.ref("rooms/"+roomId);
  gRef=db.ref("rooms/"+roomId+"/state");
  lRef=db.ref("rooms/"+roomId+"/log");
  rRef.set({state:st,log:{0:"방 생성! 코드: "+roomId+(selectedTime>0?" | ⏱️ "+selectedTime+"분 제한":"")}})
    .then(function(){enterGame();})
    .catch(function(e){serr("오류: "+e.message);});
}

function joinRoom(nm,cd){
  db.ref("rooms/"+cd).once("value").then(function(snap){
    if(!snap.exists()){serr("방을 찾을 수 없습니다");return;}
    var d=snap.val();
    if(d.state.phase!=="waiting"){serr("이미 시작된 게임입니다");return;}
    var pl=d.state.players||[];
    if(pl.length>=6){serr("방이 꽉 찼습니다");return;}
    myId="p_"+Math.random().toString(36).slice(2,9);myName=nm;roomId=cd;
    var np=mkP(pl.length);pl.push(np);
    rRef=db.ref("rooms/"+roomId);
    gRef=db.ref("rooms/"+roomId+"/state");
    lRef=db.ref("rooms/"+roomId+"/log");
    gRef.update({players:pl}).then(function(){
      lRef.push(myName+"님 입장! 👋");
      enterGame();
    }).catch(function(e){serr("오류: "+e.message);});
  }).catch(function(e){serr("오류: "+e.message);});
}

function enterGame(){
  g("rbadge").textContent="코드: "+roomId;
  showScr("game");
  subGame();
}

function subGame(){
  gRef.on("value",function(snap){
    if(!snap.exists())return;
    gs=snap.val();
    renderGame();
    updateTimer();
  });
  lRef.on("value",function(snap){
    if(!snap.exists())return;
    var es=Object.values(snap.val()).reverse();
    g("tl").innerHTML=es.map(function(e){return"<div class='loge'>"+e+"</div>";}).join("");
  });
}

// TIMER
function updateTimer(){
  if(!gs)return;
  var lim=gs.timeLimitMin||0;
  if(!lim||!gs.startTime||gs.phase!=="playing"){g("timer-disp").classList.add("gone");return;}
  g("timer-disp").classList.remove("gone");
  var elapsed=Math.floor((Date.now()-gs.startTime)/1000);
  var total=lim*60;
  var left=Math.max(0,total-elapsed);
  var mm=Math.floor(left/60),ss=left%60;
  g("timer-disp").textContent=(mm<10?"0":"")+mm+":"+(ss<10?"0":"")+ss;
  if(left<300){g("timer-disp").className="timer-box warn";}
  else{g("timer-disp").className="timer-box";}
  if(left===0&&gs.phase==="playing"){endGameByTimer();}
}

function endGameByTimer(){
  var sorted=gs.players.slice().sort(function(a,b){return b.stars-a.stars;});
  var winner=sorted[0];
  showModal("⏱️ 시간 종료!",
    "<div style='text-align:center;font-size:40px;margin-bottom:8px'>🏆</div>"
    +"<div style='text-align:center;font-size:20px;font-weight:900;color:var(--gold)'>"+winner.emoji+" "+winner.name+"</div>"
    +"<div style='text-align:center;color:var(--muted);margin-top:4px'>⭐ "+winner.stars+"개로 1위!</div>"
    +"<div style='margin-top:14px'>"+sorted.map(function(p,i){
      return"<div class='rrow'><span style='font-weight:900;color:"+(i===0?"var(--gold)":"var(--muted)")+";width:20px'>"+(i+1)+"</span>"
        +"<span>"+p.emoji+"</span><span style='flex:1;color:"+p.color+";font-weight:700'>"+p.name+"</span>"
        +"<span style='color:#ffd700'>⭐"+p.stars+"</span></div>";
    }).join("")+"</div>",
    "<button class='btn gold' onclick='closeModal()'>확인</button>"
  );
}

function renderGame(){
  if(!gs)return;
  if(gs.phase==="waiting"){renderWaiting();}
  else{renderPlaying();}
}

function renderWaiting(){
  g("pwait").classList.remove("gone");g("pplay").classList.add("gone");
  var pl=gs.players||[];
  g("wplayers").innerHTML=pl.map(function(p){
    var m=p.id===myId?"<span style='color:var(--blue);font-size:11px'>(나)</span>":"";

      +"<span style='color:"+p.color+";font-weight:700'>"+p.name+"</span>"+m+"</div>";
  }).join("");

  g("wtime-info").textContent=lim>0?"⏱️ 게임 제한 시간: "+lim+"분":"⏱️ 제한 시간 없음";

function renderPlaying(){
  g("pwait").classList.add("gone");g("pplay").classList.remove("gone");

  var me=gs.players.find(function(p){return p.id===myId;});

  g("temoji").textContent=cur?cur.emoji:"";
  g("tname").textContent=cur?cur.name:"";
  g("mbadge").classList.toggle("gone",!isMT);
  renderBoard(me);
  renderInfo(me);
  renderActions(isMT,me,cur);
}

function renderBoard(me){
  var own=gs.landOwners||{},bp={};
  gs.players.forEach(function(p){(bp[p.pos]=bp[p.pos]||[]).push(p);});

  // Player summary
  var ps="<div class='player-summary'>"+gs.players.map(function(p){
    var isMe=p.id===myId;
    var isCur=gs.players[gs.currentTurn]&&gs.players[gs.currentTurn].id===p.id;
    return"<div class='pscard"+(isMe?" active":"")+"' style='background:"+p.color+"18;border-color:"+(isCur?p.color:"transparent")+"'>"
      +"<div style='display:flex;align-items:center;gap:4px;margin-bottom:3px'><span>"+p.emoji+"</span><span style='color:"+p.color+";font-size:11px;font-weight:700'>"+p.name+"</span></div>"
      +"<div style='font-size:10px;color:var(--gold)'>💰"+p.money.toLocaleString()+"만</div>"
      +"<div style='font-size:10px;color:#ffd700'>⭐"+p.stars+"</div>"
      +(p.inWilderness?"<div style='font-size:9px;color:var(--red)'>🏜️광야</div>":"")+"</div>";
  }).join("")+"</div>";

  // 보드를 열별로 묶어서 표시
  var rows={1:[],2:[],3:[],4:[]};
  var specials=[];
  SQ.forEach(function(s){
    if(s.row){rows[s.row].push(s);}
    else{specials.push(s);}
  });

  function renderSqCard(s){
    var h=bp[s.id]||[];
    var op=own[s.id]?gs.players.find(function(p){return p.id===own[s.id];}):null;
    var isMine=op&&op.id===myId;
    var isOther=op&&op.id!==myId;
    var isHere=h.some(function(p){return p.id===myId;});
    var cls="sq "+(s.type==="land"?"land"+(isMine?" mine":isOther?" others":""):"special")+(isHere?" here":"")+(s.type==="key"?" key-sq":"");
    var pds=h.map(function(p){return"<span style='font-size:10px'>"+p.emoji+"</span>";}).join("");
    var nm=s.name.length>5?s.name.slice(0,5)+"..":s.name;
    if(s.type==="land"){
      return"<div class='"+cls+"'>"
        +(op?"<span class='sq-owner'>"+op.emoji+"</span>":"")
        +"<div class='sq-name'>"+nm+"</div>"
        +"<div class='sq-price'>"+s.price+"만</div>"
        +"<div class='sq-stars'>"+"★".repeat(Math.min(s.stars,5))+"</div>"
        +(pds?"<div class='sq-players'>"+pds+"</div>":"")
        +"</div>";
    } else {
      return"<div class='"+cls+"'>"
        +"<div class='sq-icon'>"+s.icon+"</div>"
        +"<div class='sq-name' style='font-size:9px'>"+s.name+"</div>"
        +(pds?"<div class='sq-players'>"+pds+"</div>":"")
        +"</div>";
    }
  }

  // 특수 칸 표시
  var specHtml="<div class='board-section'><div class='section-label'>특수 칸</div><div class='sq-row'>"
    +specials.map(renderSqCard).join("")+"</div></div>";

  var rowHtml=[1,2,3,4].map(function(r){
    return"<div class='board-section'><div class='section-label'>"+r+"열</div><div class='sq-row'>"
      +rows[r].map(renderSqCard).join("")+"</div></div>";
  }).join("");

  g("tb").innerHTML=ps+specHtml+rowHtml;
}

      +"<button class='btn bsm' style='background:#1a3a6a;color:var(--blue)' id='wd'>🎲 더블 도전</button>"
      +"<button class='btn bsm' style='background:#1a3a2a;color:var(--green)' id='wo'>홀/짝 선택</button>"
      +"</div>";
    g("wd").onclick=function(){wTry("double");};
    g("wo").onclick=function(){wTry("oddeven");};
    return;
  }
  if(pa&&pa.type==="oddeven_choice"){
    g("dice-area").classList.add("gone");
    ac.innerHTML="<div style='text-align:center;color:var(--muted);font-size:12px;margin-bottom:8px'>홀수? 짝수?</div>"
      +"<div class='brow'>"
      +"<button class='btn bsm' style='background:#3a1a3a;color:#e879f9' id='po'>홀수</button>"
      +"<button class='btn bsm' style='background:#1a2a3a;color:var(--blue)' id='pe'>짝수</button>"
      +"</div>";
    g("po").onclick=function(){oePick("odd");};
    g("pe").onclick=function(){oePick("even");};
    return;
  }
  if(pa&&pa.type==="train_move"){
    g("dice-area").classList.add("gone");
    var opts=SQ.filter(function(s){return s.type==="land";}).map(function(s){return"<option value='"+s.id+"'>"+s.name+"</option>";}).join("");
    ac.innerHTML="<div style='color:var(--muted);font-size:12px;margin-bottom:6px'>🚂 이동할 곳 선택</div>"
      +"<select class='inp' id='td' style='margin-bottom:8px'>"+opts+"</select>"
      +"<button class='btn gold bsm' id='tgo'>이동!</button>";
    g("tgo").onclick=confirmTrain;
    return;
  }
  if(pa&&pa.type==="steal_land"){
    g("dice-area").classList.add("gone");
    var oth=gs.players.filter(function(p){return p.id!==myId&&(p.lands||[]).length>0;});
    if(!oth.length){ac.innerHTML="<div style='color:var(--muted);text-align:center'>빼앗을 땅이 없습니다</div>";endTurn();return;}
    var h2="<div style='color:var(--muted);font-size:12px;margin-bottom:8px'>👊 빼앗을 땅 선택</div>";
    oth.forEach(function(p){
      h2+="<div style='margin-bottom:8px'>"
        +"<div style='color:"+p.color+";font-size:12px;margin-bottom:4px'>"+p.emoji+" "+p.name+"</div>"
        +"<div style='display:flex;flex-wrap:wrap;gap:5px'>"
        +(p.lands||[]).map(function(pos){
          return"<button class='btn bsm bgray' style='flex:none;width:auto;padding:6px 10px;font-size:11px' data-f='"+p.id+"' data-p='"+pos+"'>"+SQ[pos].name+"</button>";
        }).join("")+"</div></div>";
    });
    ac.innerHTML=h2;
    ac.querySelectorAll("[data-f]").forEach(function(b){b.onclick=function(){stealL(b.dataset.f,parseInt(b.dataset.p));};});
    return;
  }
  if(pa&&pa.type==="take_row2"){
    g("dice-area").classList.add("gone");
    var r2=SQ.filter(function(s){return s.id>=15&&s.id<=32&&s.type==="land"&&!own[s.id];});
    if(!r2.length){addLog("2열에 가져올 땅이 없습니다.");endTurn();return;}
    ac.innerHTML="<div style='color:var(--muted);font-size:12px;margin-bottom:6px'>🗺️ 2열 땅 선택</div>"
      +"<div style='display:flex;flex-wrap:wrap;gap:5px'>"
      +r2.map(function(s){return"<button class='btn bsm bblue' style='flex:none;width:auto;padding:6px 10px;font-size:11px' data-p='"+s.id+"'>"+s.name+"</button>";}).join("")+"</div>";
    ac.querySelectorAll("[data-p]").forEach(function(b){b.onclick=function(){takeR2(parseInt(b.dataset.p));};});
    return;
  }

  // 땅 구매 상황
  var isL=sq&&sq.type==="land";
  var unowned=isL&&!own[me.pos];
  var canBuy=unowned&&me.money>=sq.price;

  if(unowned&&gs.needAction){
    g("dice-area").classList.add("gone");
    var bb=canBuy?"<button class='btn bgreen bsm' id='bbuy'>🏡 구매 ("+sq.price+"만원)</button>":"";
    ac.innerHTML="<div class='card hl' style='margin-bottom:8px'>"
      +"<div style='font-weight:700;margin-bottom:3px'>🏛️ "+sq.name+"</div>"
      +"<div style='color:var(--muted);font-size:11px;margin-bottom:6px'>"+sq.desc+"</div>"
      +"<div style='display:flex;justify-content:space-between;font-size:12px'>"
      +"<span>💰<b style='color:var(--gold)'>"+sq.price+"만</b></span>"
      +"<span>⭐<b style='color:#ffd700'>"+sq.stars+"개</b></span>"
      +"<span>🚶<b style='color:var(--blue)'>"+sq.toll+"만</b></span>"
      +"</div></div>"
      +"<div class='brow'>"+bb+"<button class='btn bgray bsm' id='bskip'>⏭️ 패스</button></div>";
    if(canBuy)g("bbuy").onclick=buyL;
    g("bskip").onclick=skipB;
    return;
  }

  // 주사위 굴리기
  g("dice-area").classList.remove("gone");
  if(!g("dice-area").querySelector(".die")){
    g("dice-area").innerHTML="<div class='dice-wrap'><div class='die' id='d1'>🎲</div><div class='die' id='d2'>🎲</div></div>";
  }
  var ex=(me.cards||[]).includes(5)?"<button class='btn bblue bsm' id='bex' style='margin-top:6px'>🎲 추가 주사위 사용 (보관 카드)</button>":"";
  ac.innerHTML="<button class='btn gold' id='broll'>🎲 주사위 굴리기</button>"+ex;
  g("broll").onclick=rollDice;
  if((me.cards||[]).includes(5))g("bex").onclick=useEx;
}

// GAME ACTIONS
function startGame(){
  if(!gs||gs.players.length<2){alert("최소 2명이 필요합니다!");return;}
  var st=JSON.parse(JSON.stringify(gs));
  st.phase="playing";st.currentTurn=0;
  st.startTime=gs.timeLimitMin>0?Date.now():0;
  st.needAction=false;
  gRef.set(st).then(function(){addLog("🎮 게임 시작!");});
}

function rollDice(){
  if(!gs)return;
  var d1=Math.floor(Math.random()*6)+1,d2=Math.floor(Math.random()*6)+1;
  // 주사위 애니메이션
  var da=g("dice-area");
  da.classList.remove("gone");
  da.innerHTML="<div class='dice-wrap'><div class='die rolling' id='d1'>🎲</div><div class='die rolling' id='d2'>🎲</div></div>";
  setTimeout(function(){
    var dbl=d1===d2;
    da.innerHTML="<div class='dice-wrap'><div class='die"+(dbl?" double":"")+"'>"+DICE_FACES[d1]+"</div><div class='die"+(dbl?" double":"")+"'>"+DICE_FACES[d2]+"</div></div>"
      +(dbl?"<div><span class='double-badge'>🎯 더블!</span></div>":"");
    procTurn(d1,d2);
  },400);
}

function useEx(){
  var st=JSON.parse(JSON.stringify(gs));
  var me=st.players.find(function(p){return p.id===myId;});
  me.cards=me.cards.filter(function(c){return c!==5;});
  st.needAction=false;
  gRef.set(st).then(function(){addLog("🎲 "+myName+": 추가 주사위 카드 사용!");rollDice();});
}

function procTurn(d1,d2){
  var st=JSON.parse(JSON.stringify(gs));
  var cur=st.players[st.currentTurn];
  var isD=d1===d2;
  var logs=["🎲 "+cur.name+": "+d1+"+"+d2+"="+(d1+d2)+(isD?" (더블!)":"")];
  st.needAction=false;

  if(cur.inWilderness){
    if(isD){cur.inWilderness=false;cur.wildernessCount=0;logs.push("🌟 "+cur.name+": 광야 탈출!");}
    else{
      pa={type:"wilderness_choice"};
      st.needAction=false;
      gRef.set(st).then(function(){logs.forEach(function(l){addLog(l);});renderActions(true,cur,cur);});
      return;
    }
  }

  var cs=st.consecutiveDoubles||0;cs=isD?cs+1:0;st.consecutiveDoubles=cs;
  if(cs>=3){
    cur.inWilderness=true;cur.wildernessCount=0;cur.pos=14;st.consecutiveDoubles=0;
    logs.push("⚠️ "+cur.name+": 더블 3연속! 광야!");
    advTurn(st);gRef.set(st).then(function(){logs.forEach(function(l){addLog(l);});});
    return;
  }

  var steps=d1+d2,op=cur.pos,np=(op+steps)%TOTAL;
  if(op+steps>=TOTAL){
    if(np===0){cur.money+=100;logs.push("🏠 "+cur.name+": 시작/마침 +100만원");}
    else{cur.money+=50;logs.push("💰 "+cur.name+": 시작 통과 +50만원");}
  }
  cur.pos=np;
  var sq=SQ[np];
  logs.push("📍 "+cur.name+": "+sq.name+"에 도착");

  var needPrompt=false;

  if(sq.type==="land"){
    var oid=st.landOwners&&st.landOwners[np];
    if(!oid){
      needPrompt=true;st.needAction=true;
    } else if(oid!==cur.id){
      var owP=st.players.find(function(p){return p.id===oid;});
      var hasTF=(cur.cards||[]).includes(19);
      if(hasTF){cur.cards=cur.cards.filter(function(c){return c!==19;});logs.push("🎫 "+cur.name+": 통행권 사용!");}
      else if(owP){var pd=Math.min(cur.money,sq.toll);cur.money-=pd;owP.money+=pd;logs.push("💸 "+cur.name+"→"+owP.name+": 통행료 "+sq.toll+"만원");}
    } else{logs.push("🏠 "+cur.name+": 내 땅!");}
  } else if(sq.type==="key"){
    var dk=st.keyDeck||[];if(!dk.length)dk=shuf(KC.map(function(c){return c.id;}));
    var cid=dk.shift();st.keyDeck=dk;
    var card=KC.find(function(c){return c.id===cid;});
    logs.push("🔑 "+cur.name+": "+card.text.split("\n")[0]);
    var res=applyC(st,cur,card);
    if(res){pa=res;needPrompt=true;st.needAction=true;}
    // 카드 팝업 표시
    showKeyCardPopup(card);
  } else if(sq.type==="wilderness"){
    if(!cur.inWilderness){cur.inWilderness=true;cur.wildernessCount=0;logs.push("🏜️ "+cur.name+": 광야에 갇혔습니다!");}
  } else if(sq.type==="train"){
    pa={type:"train_move"};needPrompt=true;st.needAction=true;
    logs.push("🚂 "+cur.name+": 구원열차! 이동할 곳을 선택하세요");
  } else if(sq.type==="offering"){
    var pl2=st.offeringPool||0;
    if(cur.money>=100){cur.money-=100;st.offeringPool=pl2+100;logs.push("💌 "+cur.name+": 헌금 100만원");}
    else if(cur.money>=50){cur.money-=50;st.offeringPool=pl2+50;logs.push("💌 "+cur.name+": 헌금 50만원");}
    if(pl2>0){cur.money+=pl2;st.offeringPool=0;logs.push("💝 "+cur.name+": 헌금 풀 "+pl2+"만원 획득!");}
  } else if(sq.type==="start"){
    cur.money+=100;logs.push("🏠 "+cur.name+": 시작 정착 +100만원");
  }

  if(!needPrompt&&!isD)advTurn(st);
  else if(!needPrompt&&isD)logs.push("🎯 더블! "+cur.name+" 한 번 더 굴리세요!");

  gRef.set(st).then(function(){logs.forEach(function(l){addLog(l);});});
}

function showKeyCardPopup(card){
  var icon="🔑";
  if(card.type==="money")icon="💰";
  else if(card.type==="blank")icon="🙅";
  else if(card.type==="move_wilderness")icon="🏜️";
  else if(card.type==="steal")icon="👊";
  else if(card.type==="move_train")icon="🚂";
  else if(card.type==="toll_free")icon="🎫";
  showModal("🔑 천국열쇠 카드",
    "<div class='key-card'><div class='key-card-icon'>"+icon+"</div><div class='key-card-text'>"+card.text.replace(/\n/g,"<br>")+"</div>"
    +(card.keep?"<div style='margin-top:8px;color:var(--blue);font-size:12px'>📦 보관 가능한 카드입니다</div>":"")
    +"</div>",
    "<button class='btn gold bsm' onclick='closeModal()'>확인</button>"
  );
}

function applyC(st,cur,card){
  switch(card.type){
    case"money":cur.money+=card.amount;break;
    case"move_start":cur.pos=0;cur.money+=100;break;
    case"move_wilderness":cur.pos=14;cur.inWilderness=true;cur.wildernessCount=0;break;
    case"move_train":cur.pos=33;return{type:"train_move"};
    case"move_offering":cur.pos=47;break;
    case"pay_offering":cur.money-=Math.min(cur.money,card.amount);st.offeringPool=(st.offeringPool||0)+card.amount;break;
    case"steal":return{type:"steal_land"};
    case"take_row2":return{type:"take_row2"};
    case"extra_dice":case"escape_wilderness":case"toll_free":
      if(card.keep){cur.cards=cur.cards||[];cur.cards.push(card.id);}break;
    default:break;
  }
  return null;
}

function advTurn(st){st.currentTurn=(st.currentTurn+1)%st.players.length;st.needAction=false;}
function endTurn(){pa=null;var st=JSON.parse(JSON.stringify(gs));advTurn(st);gRef.set(st).then(function(){addLog("⏭️ 턴 종료");});}

function buyL(){
  var st=JSON.parse(JSON.stringify(gs));
  var cur=st.players[st.currentTurn];
  var sq=SQ[cur.pos];
  if(sq.type!=="land"||(st.landOwners&&st.landOwners[cur.pos])||cur.money<sq.price)return;
  cur.money-=sq.price;
  st.landOwners=st.landOwners||{};st.landOwners[cur.pos]=cur.id;
  cur.lands=cur.lands||[];cur.lands.push(cur.pos);
  cur.stars=(cur.stars||0)+sq.stars;
  advTurn(st);pa=null;
  gRef.set(st).then(function(){addLog("🏡 "+cur.name+": "+sq.name+" 구매! ("+sq.price+"만, ⭐"+sq.stars+")");});
}

function skipB(){
  var st=JSON.parse(JSON.stringify(gs));
  var cur=st.players[st.currentTurn];
  advTurn(st);pa=null;
  gRef.set(st).then(function(){addLog("⏭️ "+cur.name+": 구매 패스");});
}

function wTry(m){
  if(m==="double"){
    var d1=Math.floor(Math.random()*6)+1,d2=Math.floor(Math.random()*6)+1;
    var da=g("dice-area");da.classList.remove("gone");
    da.innerHTML="<div class='dice-wrap'><div class='die rolling'>🎲</div><div class='die rolling'>🎲</div></div>";
    setTimeout(function(){
      var dbl=d1===d2;
      da.innerHTML="<div class='dice-wrap'><div class='die"+(dbl?" double":"")+"'>"+DICE_FACES[d1]+"</div><div class='die"+(dbl?" double":"")+"'>"+DICE_FACES[d2]+"</div></div>"+(dbl?"<div><span class='double-badge'>🎯 더블!</span></div>":"");
      addLog("🎲 "+myName+": 더블 도전 "+d1+"+"+d2+(dbl?" → 탈출!":" → 실패"));
      procW(dbl);
    },400);
  } else {
    pa={type:"oddeven_choice"};
    renderActions(true,gs.players.find(function(p){return p.id===myId;}),null);
  }
}

function oePick(c){
  var d=Math.floor(Math.random()*6)+1;
  var io=d%2===1;var w=(c==="odd"&&io)||(c==="even"&&!io);
  var da=g("dice-area");da.classList.remove("gone");
  da.innerHTML="<div class='dice-wrap'><div class='die"+(w?" double":"")+"'>"+DICE_FACES[d]+"</div></div>";
  addLog("🎲 "+myName+": "+d+(io?" (홀)":" (짝)")+" → "+(c==="odd"?"홀":"짝")+" 선택 → "+(w?"탈출!":"실패"));
  procW(w);
}

function procW(esc){
  var st=JSON.parse(JSON.stringify(gs));
  var cur=st.players[st.currentTurn];
  if(esc){cur.inWilderness=false;cur.wildernessCount=0;pa=null;st.needAction=false;gRef.set(st).then(function(){rollDice();});}
  else{cur.wildernessCount=(cur.wildernessCount||0)+1;advTurn(st);pa=null;gRef.set(st).then(function(){addLog("😔 "+cur.name+": 광야 탈출 실패");});}
}

function confirmTrain(){
  var dest=parseInt(g("td").value);
  var st=JSON.parse(JSON.stringify(gs));
  var cur=st.players[st.currentTurn];
  cur.pos=dest;advTurn(st);pa=null;
  gRef.set(st).then(function(){addLog("🚂 "+cur.name+": "+SQ[dest].name+"으로 이동!");});
}

function stealL(fid,pos){
  var st=JSON.parse(JSON.stringify(gs));
  var cur=st.players[st.currentTurn];
  var fr=st.players.find(function(p){return p.id===fid;});
  if(!fr)return;
  fr.lands=(fr.lands||[]).filter(function(p){return p!==pos;});
  fr.stars=Math.max(0,(fr.stars||0)-(SQ[pos].stars||0));
  cur.lands=cur.lands||[];cur.lands.push(pos);
  cur.stars=(cur.stars||0)+(SQ[pos].stars||0);
  st.landOwners=st.landOwners||{};st.landOwners[pos]=cur.id;
  advTurn(st);pa=null;
  gRef.set(st).then(function(){addLog("👊 "+cur.name+": "+fr.name+"의 "+SQ[pos].name+" 획득!");});
}

function takeR2(pos){
  var st=JSON.parse(JSON.stringify(gs));
  var cur=st.players[st.currentTurn];
  var sq=SQ[pos];
  cur.lands=cur.lands||[];cur.lands.push(pos);
  cur.stars=(cur.stars||0)+sq.stars;
  st.landOwners=st.landOwners||{};st.landOwners[pos]=cur.id;
  advTurn(st);pa=null;
  gRef.set(st).then(function(){addLog("🗺️ "+cur.name+": 2열 "+sq.name+" 획득!");});
}

function addLog(msg){if(lRef)lRef.push(msg);}

function showModal(title,body,actions){
  g("mtitle").textContent=title;
  g("mbody").innerHTML=body;
  g("mact").innerHTML=actions||"<button class='btn gold bsm' onclick='closeModal()'>확인</button>";
  g("mov").classList.remove("gone");
}
function closeModal(){g("mov").classList.add("gone");}

// 1초마다 타이머 업데이트
setInterval(function(){if(gs&&gs.phase==="playing")updateTimer();},1000);
</script>
