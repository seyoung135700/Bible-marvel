<head>
<meta charset="UTF-8">

<title>성경마블 Online</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Noto Sans KR',sans-serif;overflow:hidden;background:#1a2a1a}
#app{height:100vh;display:flex;flex-direction:column;max-width:500px;margin:0 auto;background:#0d1117;color:#e6edf3;position:relative}
.gone{display:none!important}

/* ── LOBBY ── */
#lobby{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:32px 24px;background:radial-gradient(ellipse at 50% 30%,#1a2a4a,#0d1117)}
.logo{font-size:72px;animation:fl 3s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.ttl{font-size:36px;font-weight:900;color:#f0c040;letter-spacing:-1px;margin:8px 0 4px}
.sub{color:#8b949e;font-size:13px;margin-bottom:40px}
.lbtns{width:100%;display:flex;flex-direction:column;gap:12px}

/* ── SETUP ── */
#setup{flex:1;display:flex;flex-direction:column;justify-content:center;gap:13px;padding:24px;position:relative}
.backbtn{position:absolute;top:14px;left:14px;background:none;border:none;color:#8b949e;font-size:26px;cursor:pointer}

/* ── BUTTONS ── */
.btn{border:none;border-radius:13px;padding:14px 18px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;width:100%;-webkit-tap-highlight-color:transparent;transition:transform .1s,opacity .1s}
.btn:active{transform:scale(.96);opacity:.85}
.btn:disabled{opacity:.4;cursor:not-allowed}
.gold{background:#f0c040;color:#1a1a2e;box-shadow:0 4px 18px #f0c04040}
.bblue{background:#4fc3f7;color:#0d1117}
.bgreen{background:#2ecc71;color:#fff}
.bgray{background:#2d333b;color:#e6edf3}
.bred{background:#e74c3c;color:#fff}
.bsm{padding:10px 14px;font-size:13px;border-radius:10px}
.brow{display:flex;gap:8px}.brow .btn{flex:1}
.inp{background:#1c2128;border:1px solid #30363d;border-radius:11px;padding:13px 15px;color:#e6edf3;font-size:15px;font-family:'Noto Sans KR',sans-serif;outline:none;width:100%}
.inp:focus{border-color:#f0c040}
.inp::placeholder{color:#8b949e}

/* ── GAME LAYOUT (fixed heights) ── */
#game{flex:1;display:flex;flex-direction:column;overflow:hidden}
.ghdr{background:#161b22;padding:7px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #30363d;flex-shrink:0}
.gtitle{font-weight:900;color:#f0c040;font-size:14px}
.rbadge{background:#0f3460;color:#4fc3f7;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:700}
.timerbx{font-size:12px;font-weight:900;padding:3px 9px;border-radius:20px;background:#1a2e1a;border:1px solid #2ecc71;color:#2ecc71}
.timerbx.warn{background:#2e1a1a;border-color:#e74c3c;color:#e74c3c}

.tbar{padding:7px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #30363d;flex-shrink:0}
.tbar.my{background:linear-gradient(90deg,#1a3a1a,#162e16)}
.tbar.other{background:#1c2128}
.mybadge{background:#2ecc71;color:#fff;font-size:11px;font-weight:900;padding:3px 10px;border-radius:20px;animation:pu 1s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.65}}

/* 탭 */
.tabs{display:flex;border-bottom:1px solid #30363d;flex-shrink:0}
.tab{flex:1;padding:8px 0;background:none;border:none;color:#8b949e;font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:#f0c040;border-bottom-color:#f0c040;background:#161b22}

/* 탭 컨텐츠 영역 */
.tcwrap{flex:1;overflow:hidden;position:relative}
.tc{position:absolute;inset:0;overflow-y:auto;padding:10px}

/* ── ACTION BAR (항상 하단 고정) ── */
.abar{flex-shrink:0;background:#0d1117;border-top:1px solid #30363d;padding:10px 12px}

/* ── BOARD (모두의마블 스타일) ── */
.board-outer{padding:8px;overflow-y:auto;height:100%}
.player-chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.pchip{border-radius:9px;padding:6px 8px;border:1px solid transparent;font-size:10px}
.pchip.cur{border-color:#f0c040}

/* 보드판 */
.board-grid{display:grid;grid-template-columns:52px 1fr 52px;grid-template-rows:52px 1fr 52px;gap:2px;aspect-ratio:1/1;max-width:400px;margin:0 auto}
.board-corner{border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:700;text-align:center;padding:3px;border:2px solid #30363d;cursor:pointer;position:relative}
.board-corner.here{box-shadow:0 0 10px #f0c04080;border-color:#f0c040}
.board-edge{display:flex;overflow:hidden;gap:1px}
.board-edge.top{flex-direction:row}
.board-edge.bottom{flex-direction:row-reverse}
.board-edge.left{flex-direction:column}
.board-edge.right{flex-direction:column-reverse}
.board-center{background:linear-gradient(135deg,#0a1a0a,#1a2a1a);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #2a3a2a}
.board-cell{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:5px;border:1px solid #30363d;background:#161b22;padding:2px 1px;cursor:pointer;position:relative;min-width:0;overflow:hidden;transition:transform .1s}
.board-cell:active{transform:scale(.95)}
.board-cell.land{background:#161b22}
.board-cell.mine{background:#1a2e0a;border-color:#2ecc71}
.board-cell.others{background:#1a1a2e;border-color:#3498db}
.board-cell.here{box-shadow:0 0 8px #f0c04080;border-color:#f0c040;z-index:2}
.board-cell.key-sq{background:#2a2010;border-color:#a07820}
.cn{font-size:8px;font-weight:700;text-align:center;line-height:1.2;color:#e6edf3}
.cp{font-size:7px;color:#4fc3f7;font-weight:700}
.cs{font-size:7px;color:#ffd700}
.cicon{font-size:12px}
.cown{position:absolute;top:1px;right:1px;font-size:7px}
.cplayers{display:flex;gap:1px;flex-wrap:wrap;justify-content:center;margin-top:1px}

/* ── DICE ── */
.dice-wrap{display:flex;gap:12px;justify-content:center;margin-bottom:8px}
.die{width:50px;height:50px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 3px 12px rgba(0,0,0,.5);border:2px solid #ddd;transition:transform .2s}
.die.dbl{border-color:#f0c040;box-shadow:0 3px 16px #f0c04060}
.die.roll{animation:dr .35s ease-in-out}
@keyframes dr{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.15)}100%{transform:rotate(360deg) scale(1)}}
.dbl-badge{background:#f0c040;color:#1a1a2e;font-size:11px;font-weight:900;padding:2px 10px;border-radius:20px;display:inline-block;margin-bottom:5px}

/* 키카드 팝업 */
.kc-card{background:linear-gradient(135deg,#2a2010,#1a1508);border:2px solid #a07820;border-radius:14px;padding:16px;text-align:center;margin-bottom:12px}
.kc-icon{font-size:44px;margin-bottom:6px}
.kc-text{font-size:14px;line-height:1.6;color:#e6edf3;white-space:pre-line}

/* MODAL */
.mov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:flex-end;justify-content:center;z-index:100;max-width:500px;margin:0 auto}
.mo{background:#1c2128;border-radius:20px 20px 0 0;padding:20px 18px 28px;width:100%;border-top:1px solid #30363d;max-height:85vh;overflow-y:auto}
.mo-title{font-size:17px;font-weight:900;color:#f0c040;margin-bottom:10px}

/* INFO */
.info-box{background:#161b22;border-radius:12px;padding:12px;margin-bottom:8px;border:1px solid #30363d}
.loge{background:#161b22;border-radius:7px;padding:7px 9px;margin-bottom:4px;font-size:11px;color:#c9d1d9;line-height:1.5}
.rrow{display:flex;align-items:center;gap:8px;background:#161b22;border-radius:9px;padding:7px 10px;margin-bottom:5px}

.spin{display:inline-block;width:18px;height:18px;border:2px solid #30363d;border-top-color:#f0c040;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:4px}
</style>
</head>

function shuf(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}

function serr(msg){g("serr").textContent=msg;g("serr").style.display="block";g("sld").classList.add("gone");g("sbtn").disabled=false;}
function mkP(idx){return{id:myId,name:myName,money:cm(),pos:0,lands:[],stars:0,inWilderness:false,wildernessCount:0,cards:[],color:CL[idx],emoji:EM[idx]};}

function handleSetup(){
  var nm=g("ni").value.trim();
  if(!nm){serr("닉네임을 입력해주세요");return;}
  g("sld").classList.remove("gone");g("sbtn").disabled=true;g("serr").style.display="none";
  if(smode==="create"){createRoom(nm);}
  else{var cd=g("rc").value.trim().toUpperCase();if(!cd||cd.length!==5){serr("방 코드 5자리를 입력해주세요");return;}joinRoom(nm,cd);}
}
function createRoom(nm){
  myId="p_"+Math.random().toString(36).slice(2,9);myName=nm;
  roomId=Math.random().toString(36).slice(2,7).toUpperCase();
  var st={phase:"waiting",players:[mkP(0)],currentTurn:0,landOwners:{},offeringPool:0,keyDeck:shuf(KC.map(function(c){return c.id;})),consecutiveDoubles:0,hostId:myId,timeLimitMin:selTime,startTime:0,needAction:false};
  rRef=db.ref("rooms/"+roomId);gRef=db.ref("rooms/"+roomId+"/state");lRef=db.ref("rooms/"+roomId+"/log");
  rRef.set({state:st,log:{0:"방 생성! 코드: "+roomId+(selTime>0?" | ⏱️"+selTime+"분":"")}}).then(enterGame).catch(function(e){serr("오류: "+e.message);});
}
function joinRoom(nm,cd){
  db.ref("rooms/"+cd).once("value").then(function(snap){
    if(!snap.exists()){serr("방을 찾을 수 없습니다");return;}
    var d=snap.val();
    if(d.state.phase!=="waiting"){serr("이미 시작된 게임입니다");return;}
    var pl=d.state.players||[];if(pl.length>=6){serr("방이 꽉 찼습니다");return;}
    myId="p_"+Math.random().toString(36).slice(2,9);myName=nm;roomId=cd;
    var np=mkP(pl.length);pl.push(np);
    rRef=db.ref("rooms/"+roomId);gRef=db.ref("rooms/"+roomId+"/state");lRef=db.ref("rooms/"+roomId+"/log");
    gRef.update({players:pl}).then(function(){lRef.push(myName+"님 입장! 👋");enterGame();}).catch(function(e){serr("오류: "+e.message);});
  }).catch(function(e){serr("오류: "+e.message);});
}
function enterGame(){
  g("rbadge").textContent="코드: "+roomId;
  showScr("game");
  gRef.on("value",function(snap){if(!snap.exists())return;gs=snap.val();renderGame();updateTimer();});
  lRef.on("value",function(snap){
    if(!snap.exists())return;
    var es=Object.values(snap.val()).reverse();
    g("tl").innerHTML=es.map(function(e){return"<div class='loge'>"+e+"</div>";}).join("");
  });
}

function updateTimer(){
  var lim=gs&&gs.timeLimitMin||0;
  if(!lim||!gs.startTime||gs.phase!=="playing"){g("tmr").classList.add("gone");return;}
  g("tmr").classList.remove("gone");
  var left=Math.max(0,lim*60-Math.floor((Date.now()-gs.startTime)/1000));
  var mm=Math.floor(left/60),ss=left%60;
  g("tmr").textContent=(mm<10?"0":"")+mm+":"+(ss<10?"0":"")+ss;
  g("tmr").className=left<300?"timerbx warn":"timerbx";
  if(left===0)endByTimer();
}
function endByTimer(){
  var s=gs.players.slice().sort(function(a,b){return b.stars-a.stars;})[0];
  showModal("⏱️ 시간 종료!","<div style='text-align:center;font-size:36px'>🏆</div><div style='text-align:center;font-size:18px;font-weight:900;color:#f0c040'>"+s.emoji+" "+s.name+"</div><div style='text-align:center;color:#8b949e'>⭐"+s.stars+"개로 1위!</div>","<button class='btn gold bsm' onclick='closeModal()'>확인</button>");
}

// ── BOARD (사각형 판) ──
function renderBoard(me){
  var own=gs.landOwners||{},bp={};
  gs.players.forEach(function(p){(bp[p.pos]=bp[p.pos]||[]).push(p);});

  // 플레이어 칩
  var chips="<div class='player-chips'>"+gs.players.map(function(p){
    var isCur=gs.players[gs.currentTurn]&&gs.players[gs.currentTurn].id===p.id;
    return"<div class='pchip"+(isCur?" cur":"")+"' style='background:"+p.color+"22;border-color:"+(p.id===myId?p.color:"transparent")+"'>"
      +"<div style='display:flex;align-items:center;gap:3px'><span>"+p.emoji+"</span><span style='color:"+p.color+";font-size:10px;font-weight:700'>"+p.name+"</span></div>"
      +"<div style='font-size:9px;color:#f0c040'>💰"+p.money.toLocaleString()+"만</div>"
      +"<div style='font-size:9px;color:#ffd700'>⭐"+p.stars+"</div>"
      +(p.inWilderness?"<div style='font-size:8px;color:#e74c3c'>🏜️광야</div>":"")
      +"</div>";
  }).join("")+"</div>";

  // 사각형 보드판 레이아웃
  // 하단: 0~14 (시작 ~ 광야), 우측: 15~32 (두로~비손강) → 코너33(구원열차)
  // 상단: 34~47 (요단강~헌금), 좌측: 48~64 (서머나~천국)
  var bottom=SQ.slice(0,14); // id 0~13, 좌→우
  var right=SQ.slice(15,33); // id 15~32, 아래→위
  var top=SQ.slice(34,47);   // id 34~46, 우→좌 (reverse)
  var left=SQ.slice(48,65);  // id 48~64, 위→아래 (reverse)

  function cellHtml(s,dir){
    var h=bp[s.id]||[];
    var op=own[s.id]?gs.players.find(function(p){return p.id===own[s.id];}):null;
    var isMine=op&&op.id===myId,isOther=op&&!isMine;
    var isHere=h.some(function(p){return p.id===myId;});
    var cls="board-cell "+(s.type==="land"?"land"+(isMine?" mine":isOther?" others":""):"")+(s.type==="key"?" key-sq":"")+(isHere?" here":"");
    var bg=s.color||"#161b22";
    var nm=s.name.length>4?s.name.slice(0,4)+"..":s.name;
    var inner="";
    if(s.type==="land"){
      inner=(op?"<span class='cown'>"+op.emoji+"</span>":"")
        +"<div class='cn'>"+nm+"</div>"
        +"<div class='cp'>"+s.price+"만</div>"
        +"<div class='cs'>"+"★".repeat(Math.min(s.stars,4))+"</div>";
    } else {
      inner="<div class='cicon'>"+s.icon+"</div>"
        +"<div class='cn' style='font-size:7px'>"+s.name+"</div>";
    }
    var players=h.map(function(p){return"<span style='font-size:9px'>"+p.emoji+"</span>";}).join("");
    if(players)inner+="<div class='cplayers'>"+players+"</div>";
    // 수직 셀 (좌우 열)은 가로/세로 바꿈
    var style=dir==="v"?"flex-direction:column;writing-mode:horizontal-tb;":"";
    return"<div class='"+cls+"' style='background:"+bg+";"+style+"'>"+inner+"</div>";
  }

  function cornerHtml(s){
    var h=bp[s.id]||[];var isHere=h.some(function(p){return p.id===myId;});
    var players=h.map(function(p){return"<span style='font-size:10px'>"+p.emoji+"</span>";}).join("");
    return"<div class='board-corner"+(isHere?" here":"")+"' style='background:"+(s.color||"#1a2a1a")+"'>"
      +"<div style='font-size:14px'>"+s.icon+"</div>"
      +"<div style='font-size:8px;font-weight:700'>"+s.name+"</div>"
      +(players?"<div>"+players+"</div>":"")
      +"</div>";
  }

  var bottomHtml=bottom.map(function(s){return cellHtml(s,"h");}).join("");
  var rightHtml=right.map(function(s){return cellHtml(s,"v");}).join("");
  var topHtml=top.slice().reverse().map(function(s){return cellHtml(s,"h");}).join("");
  var leftHtml=left.slice().reverse().map(function(s){return cellHtml(s,"v");}).join("");

  var board="<div class='board-grid'>"
    // 우하 코너 (광야 id14)
    +cornerHtml(SQ[14])
    // 하단 열 (id 0~13)
    +"<div class='board-edge bottom'>"+bottomHtml+"</div>"
    // 우상 코너 (구원열차 id33)
    +cornerHtml(SQ[33])
    // 좌측 열 (id 48~64, 위→아래)
    +"<div class='board-edge left'>"+leftHtml+"</div>"
    // 중앙
    +"<div class='board-center'>"
      +"<div style='font-size:24px'>📖</div>"
      +"<div style='font-size:14px;font-weight:900;color:#f0c040;margin:4px 0'>성경마블</div>"
      +(gs.offeringPool>0?"<div style='font-size:11px;color:#e74c3c'>💌헌금:"+gs.offeringPool+"만</div>":"")
    +"</div>"
    // 우측 열 (id 15~32, 아래→위)
    +"<div class='board-edge right'>"+rightHtml+"</div>"
    // 좌하 코너 (헌금 id47)
    +cornerHtml(SQ[47])
    // 상단 열 (id 34~46)
    +"<div class='board-edge top'>"+topHtml+"</div>"
    // 우상 코너 = 천국(id64)
    +cornerHtml(SQ[64])
    +"</div>";

  g("tb").innerHTML=chips+board;
}

function renderInfo(me){
  if(!me){g("ti").innerHTML="";return;}
  var ml=(me.lands||[]).map(function(pos){return Object.assign({pos:pos},SQ[pos]);});
  var sr=gs.players.slice().sort(function(a,b){return b.stars-a.stars;});
  var cd=(me.cards||[]).length>0?"<div style='color:#8b949e;font-size:11px;margin-bottom:6px'>🃏 보관 카드</div>"+(me.cards||[]).map(function(cid){var c=KC.find(function(x){return x.id===cid;});return"<div class='info-box' style='color:#4fc3f7;font-size:11px'>🔑 "+(c?c.text:"")+"</div>";}).join(""):"";
  var ll=ml.length===0?"<div style='color:#8b949e;font-size:12px'>아직 땅이 없습니다.</div>":ml.map(function(l){return"<div class='info-box'><div style='display:flex;justify-content:space-between;align-items:center'><div><div style='font-weight:700;font-size:12px'>"+l.name+"</div><div style='color:#8b949e;font-size:10px'>"+l.desc+"</div></div><div style='text-align:right'><div style='color:#4fc3f7;font-size:10px'>T:"+l.toll+"만</div><div style='color:#ffd700;font-size:10px'>"+"★".repeat(Math.min(l.stars,5))+"</div></div></div></div>";}).join("");
  var rl=sr.map(function(p,i){return"<div class='rrow'><span style='font-weight:900;color:"+(i===0?"#f0c040":"#8b949e")+";width:18px'>"+(i+1)+"</span><span>"+p.emoji+"</span><span style='flex:1;color:"+p.color+";font-weight:700;font-size:12px'>"+p.name+"</span><span style='color:#ffd700;font-size:11px'>⭐"+p.stars+"</span><span style='color:#f0c040;font-size:10px'>"+p.money.toLocaleString()+"만</span></div>";}).join("");
  g("ti").innerHTML="<div class='info-box' style='border-color:"+me.color+"40;background:linear-gradient(135deg,#1a2a1a,#1e3a1e)'>"
    +"<div style='display:flex;align-items:center;gap:9px;margin-bottom:9px'><span style='font-size:28px'>"+me.emoji+"</span><div><div style='color:"+me.color+";font-weight:900;font-size:16px'>"+me.name+"</div>"+(me.inWilderness?"<div style='color:#e74c3c;font-size:11px'>🏜️ 광야</div>":"")+"</div></div>"
    +"<div style='display:grid;grid-template-columns:1fr 1fr;gap:6px'>"
    +"<div style='background:rgba(0,0,0,.3);border-radius:8px;padding:7px'><div style='font-size:9px;color:#8b949e'>💰 보유 금액</div><div style='font-size:14px;font-weight:900;color:#f0c040'>"+me.money.toLocaleString()+"만</div></div>"
    +"<div style='background:rgba(0,0,0,.3);border-radius:8px;padding:7px'><div style='font-size:9px;color:#8b949e'>⭐ 별</div><div style='font-size:14px;font-weight:900;color:#ffd700'>"+me.stars+"개</div></div>"
    +"<div style='background:rgba(0,0,0,.3);border-radius:8px;padding:7px'><div style='font-size:9px;color:#8b949e'>🏛️ 땅</div><div style='font-size:14px;font-weight:900'>"+(me.lands||[]).length+"개</div></div>"
    +"<div style='background:rgba(0,0,0,.3);border-radius:8px;padding:7px'><div style='font-size:9px;color:#8b949e'>🃏 카드</div><div style='font-size:14px;font-weight:900'>"+(me.cards||[]).length+"개</div></div>"
    +"</div></div>"+cd
    +"<div style='color:#8b949e;font-size:11px;margin-bottom:6px;margin-top:7px'>🏛️ 보유 땅 ("+ml.length+"개)</div>"+ll
    +"<div style='color:#8b949e;font-size:11px;margin-top:12px;margin-bottom:6px'>🏆 순위</div>"+rl;
}

// ── ACTIONS (항상 하단에 표시) ──
function renderActions(isMT,me,cur){
  var da=g("darea"),ac=g("ac");
  if(!isMT){
    da.classList.add("gone");
    ac.innerHTML="<div style='text-align:center;color:#8b949e;font-size:13px;padding:4px 0'>"+(cur?cur.emoji+" "+cur.name:"")+"의 차례입니다...</div>";
    return;
  }
  var sq=me?SQ[me.pos]:null,own=gs.landOwners||{};

  // 광야 탈출
  if(me&&me.inWilderness&&pa&&pa.type==="wilderness_choice"){
    da.classList.add("gone");
    ac.innerHTML="<div style='text-align:center;color:#8b949e;font-size:12px;margin-bottom:7px'>🏜️ 광야 탈출 방법 선택</div>"
      +"<div class='brow'><button class='btn bsm' style='background:#1a3a6a;color:#4fc3f7' id='wd'>🎲 더블 도전</button>"
      +"<button class='btn bsm' style='background:#1a3a2a;color:#2ecc71' id='wo'>홀/짝 선택</button></div>";
    g("wd").onclick=function(){wTry("double");};g("wo").onclick=function(){wTry("oddeven");};return;
  }
  if(pa&&pa.type==="oddeven_choice"){
    da.classList.add("gone");
    ac.innerHTML="<div style='text-align:center;color:#8b949e;font-size:12px;margin-bottom:7px'>홀수? 짝수?</div>"
      +"<div class='brow'><button class='btn bsm' style='background:#3a1a3a;color:#e879f9' id='po'>홀수</button>"
      +"<button class='btn bsm' style='background:#1a2a3a;color:#4fc3f7' id='pe'>짝수</button></div>";
    g("po").onclick=function(){oePick("odd");};g("pe").onclick=function(){oePick("even");};return;
  }
  if(pa&&pa.type==="train_move"){
    da.classList.add("gone");
    var opts=SQ.filter(function(s){return s.type==="land";}).map(function(s){return"<option value='"+s.id+"'>"+s.name+"</option>";}).join("");
    ac.innerHTML="<div style='color:#8b949e;font-size:11px;margin-bottom:5px'>🚂 이동할 곳 선택</div>"
      +"<select class='inp' id='td' style='margin-bottom:7px'>"+opts+"</select>"
      +"<button class='btn gold bsm' id='tgo'>이동!</button>";
    g("tgo").onclick=confirmTrain;return;
  }
  if(pa&&pa.type==="steal_land"){
    da.classList.add("gone");
    var oth=gs.players.filter(function(p){return p.id!==myId&&(p.lands||[]).length>0;});
    if(!oth.length){ac.innerHTML="<div style='color:#8b949e;text-align:center;font-size:12px'>빼앗을 땅이 없습니다</div>";endTurn();return;}
    var h2="<div style='color:#8b949e;font-size:11px;margin-bottom:6px'>👊 빼앗을 땅 선택</div>";
    oth.forEach(function(p){h2+="<div style='margin-bottom:6px'><div style='color:"+p.color+";font-size:11px;margin-bottom:3px'>"+p.emoji+" "+p.name+"</div><div style='display:flex;flex-wrap:wrap;gap:4px'>"+(p.lands||[]).map(function(pos){return"<button class='btn bsm bgray' style='flex:none;width:auto;padding:5px 9px;font-size:11px' data-f='"+p.id+"' data-p='"+pos+"'>"+SQ[pos].name+"</button>";}).join("")+"</div></div>";});
    ac.innerHTML=h2;ac.querySelectorAll("[data-f]").forEach(function(b){b.onclick=function(){stealL(b.dataset.f,parseInt(b.dataset.p));};});return;
  }
  if(pa&&pa.type==="take_row2"){
    da.classList.add("gone");
    var r2=SQ.filter(function(s){return s.id>=15&&s.id<=32&&s.type==="land"&&!own[s.id];});
    if(!r2.length){addLog("2열에 가져올 땅이 없습니다.");endTurn();return;}
    ac.innerHTML="<div style='color:#8b949e;font-size:11px;margin-bottom:5px'>🗺️ 2열 땅 선택</div><div style='display:flex;flex-wrap:wrap;gap:4px'>"+r2.map(function(s){return"<button class='btn bsm bblue' style='flex:none;width:auto;padding:5px 9px;font-size:11px' data-p='"+s.id+"'>"+s.name+"</button>";}).join("")+"</div>";
    ac.querySelectorAll("[data-p]").forEach(function(b){b.onclick=function(){takeR2(parseInt(b.dataset.p));};});return;
  }

  // 땅 구매
  var isL=sq&&sq.type==="land",un=isL&&!own[me.pos],canB=un&&me.money>=sq.price;
  if(un&&gs.needAction){
    da.classList.add("gone");
    ac.innerHTML="<div style='background:#1e1a08;border:1px solid #f0c040;border-radius:11px;padding:10px;margin-bottom:7px'>"
      +"<div style='font-weight:700;font-size:13px;margin-bottom:2px'>🏛️ "+sq.name+"</div>"
      +"<div style='color:#8b949e;font-size:10px;margin-bottom:6px'>"+sq.desc+"</div>"
      +"<div style='display:flex;justify-content:space-between;font-size:11px'>"
      +"<span>💰<b style='color:#f0c040'>"+sq.price+"만</b></span><span>⭐<b style='color:#ffd700'>"+sq.stars+"</b></span><span>🚶<b style='color:#4fc3f7'>"+sq.toll+"만</b></span></div></div>"
      +"<div class='brow'>"+(canB?"<button class='btn bgreen bsm' id='bbuy'>🏡 구매 ("+sq.price+"만)</button>":"")
      +"<button class='btn bgray bsm' id='bskip'>⏭️ 패스</button></div>";
    if(canB)g("bbuy").onclick=buyL;g("bskip").onclick=skipB;return;
  }

  // 주사위 - 항상 보임
  da.classList.remove("gone");
  da.innerHTML="<div class='dice-wrap'><div class='die' id='d1' style='opacity:.4'>🎲</div><div class='die' id='d2' style='opacity:.4'>🎲</div></div>";
  var extra=(me&&me.cards&&me.cards.includes(5))?"<button class='btn bblue bsm' id='bex' style='margin-top:6px'>🎲 추가 주사위 (보관 카드)</button>":"";
  ac.innerHTML="<button class='btn gold' id='broll'>🎲 주사위 굴리기</button>"+extra;
  g("broll").onclick=rollDice;
  if(me&&me.cards&&me.cards.includes(5))g("bex").onclick=useEx;
}

function startGame(){
  if(!gs||gs.players.length<2){alert("최소 2명이 필요합니다!");return;}
  var st=JSON.parse(JSON.stringify(gs));
  st.phase="playing";st.currentTurn=0;st.startTime=gs.timeLimitMin>0?Date.now():0;st.needAction=false;
  gRef.set(st).then(function(){addLog("🎮 게임 시작!");});
}

function rollDice(){
  if(!gs)return;
  var d1=Math.floor(Math.random()*6)+1,d2=Math.floor(Math.random()*6)+1;
  var da=g("darea");da.classList.remove("gone");
  da.innerHTML="<div class='dice-wrap'><div class='die roll'>🎲</div><div class='die roll'>🎲</div></div>";
  g("ac").innerHTML="<button class='btn bgray' disabled>🎲 굴리는 중...</button>";
  setTimeout(function(){
    var dbl=d1===d2;
    da.innerHTML="<div class='dice-wrap'><div class='die"+(dbl?" dbl":"")+"'>"+DF[d1]+"</div><div class='die"+(dbl?" dbl":"")+"'>"+DF[d2]+"</div></div>"+(dbl?"<div><span class='dbl-badge'>🎯 더블!</span></div>":"");
    procTurn(d1,d2);
  },420);
}

function useEx(){
  var st=JSON.parse(JSON.stringify(gs));
  var me=st.players.find(function(p){return p.id===myId;});
  me.cards=me.cards.filter(function(c){return c!==5;});st.needAction=false;
  gRef.set(st).then(function(){addLog("🎲 추가 주사위 카드 사용!");rollDice();});
}

function procTurn(d1,d2){
  var st=JSON.parse(JSON.stringify(gs));
  var cur=st.players[st.currentTurn],isD=d1===d2;
  var logs=["🎲 "+cur.name+": "+d1+"+"+d2+"="+(d1+d2)+(isD?" (더블!)":"")];
  st.needAction=false;

  if(cur.inWilderness){
    if(isD){cur.inWilderness=false;cur.wildernessCount=0;logs.push("🌟 "+cur.name+": 광야 탈출!");}
    else{pa={type:"wilderness_choice"};gRef.set(st).then(function(){logs.forEach(function(l){addLog(l);});renderActions(true,cur,cur);});return;}
  }

  var cs=isD?(st.consecutiveDoubles||0)+1:0;st.consecutiveDoubles=cs;
  if(cs>=3){cur.inWilderness=true;cur.wildernessCount=0;cur.pos=14;st.consecutiveDoubles=0;logs.push("⚠️ 더블 3연속! 광야!");advTurn(st);gRef.set(st).then(function(){logs.forEach(function(l){addLog(l);});});return;}

  var steps=d1+d2,op=cur.pos,np=(op+steps)%TOTAL;
  if(op+steps>=TOTAL){if(np===0){cur.money+=100;logs.push("🏠 시작/마침 +100만");}else{cur.money+=50;logs.push("💰 시작 통과 +50만");}}
  cur.pos=np;var sq=SQ[np];logs.push("📍 "+cur.name+": "+sq.name);
  var need=false;

  if(sq.type==="land"){
    var oid=st.landOwners&&st.landOwners[np];
    if(!oid){need=true;st.needAction=true;}
    else if(oid!==cur.id){
      var owP=st.players.find(function(p){return p.id===oid;});
      var hasTF=(cur.cards||[]).includes(19);
      if(hasTF){cur.cards=cur.cards.filter(function(c){return c!==19;});logs.push("🎫 통행권 사용!");}
      else if(owP){var pd=Math.min(cur.money,sq.toll);cur.money-=pd;owP.money+=pd;logs.push("💸 "+cur.name+"→"+owP.name+": "+sq.toll+"만");}
    } else logs.push("🏠 내 땅!");
  } else if(sq.type==="key"){
    var dk=st.keyDeck||[];if(!dk.length)dk=shuf(KC.map(function(c){return c.id;}));
    var cid=dk.shift();st.keyDeck=dk;
    var card=KC.find(function(c){return c.id===cid;});
    logs.push("🔑 "+card.text.split("\n")[0]);
    var res=applyC(st,cur,card);
    if(res){pa=res;need=true;st.needAction=true;}
    showKC(card);
  } else if(sq.type==="wilderness"){
    if(!cur.inWilderness){cur.inWilderness=true;cur.wildernessCount=0;logs.push("🏜️ 광야에 갇혔습니다!");}
  } else if(sq.type==="train"){
    pa={type:"train_move"};need=true;st.needAction=true;logs.push("🚂 구원열차!");
  } else if(sq.type==="offering"){
    var pl2=st.offeringPool||0;
    if(cur.money>=100){cur.money-=100;st.offeringPool=pl2+100;logs.push("💌 헌금 100만");}
    else if(cur.money>=50){cur.money-=50;st.offeringPool=pl2+50;logs.push("💌 헌금 50만");}
    if(pl2>0){cur.money+=pl2;st.offeringPool=0;logs.push("💝 헌금 풀 "+pl2+"만 획득!");}
  } else if(sq.type==="start"){cur.money+=100;logs.push("🏠 +100만");}

  if(!need&&!isD)advTurn(st);
  else if(!need&&isD)logs.push("🎯 더블! 한 번 더!");
  gRef.set(st).then(function(){logs.forEach(function(l){addLog(l);});});
}

function showKC(card){
  var icons={"money":"💰","move_start":"✈️","move_wilderness":"🏜️","steal":"👊","extra_dice":"🎲","give_land":"🎁","move_offering":"💌","take_row2":"🗺️","pay_offering":"💸","move_train":"🚂","escape_wilderness":"🌟","toll_free":"🎫","blank":"🙅"};
  var icon=icons[card.type]||"🔑";
  showModal("🔑 천국열쇠 카드","<div class='kc-card'><div class='kc-icon'>"+icon+"</div><div class='kc-text'>"+card.text+"</div>"+(card.keep?"<div style='margin-top:7px;color:#4fc3f7;font-size:11px'>📦 보관 가능</div>":"")+"</div>","<button class='btn gold bsm' onclick='closeModal()'>확인</button>");
}
function applyC(st,cur,card){
  switch(card.type){
    case"money":cur.money+=card.amount;break;
    case"move_start":cur.pos=0;cur.money+=100;break;
    case"move_wilderness":cur.pos=14;cur.inWilderness=true;cur.wildernessCount=0;break;
    case"move_train":cur.pos=33;return{type:"train_move"};
    case"move_offering":cur.pos=47;break;
    case"pay_offering":cur.money-=Math.min(cur.money,card.amount);st.offeringPool=(st.offeringPool||0)+card.amount;break;
    case"steal":return{type:"steal_land"};
    case"take_row2":return{type:"take_row2"};
    case"extra_dice":case"escape_wilderness":case"toll_free":if(card.keep){cur.cards=cur.cards||[];cur.cards.push(card.id);}break;
    default:break;
  }
  return null;
}
function advTurn(st){st.currentTurn=(st.currentTurn+1)%st.players.length;st.needAction=false;}
function endTurn(){pa=null;var st=JSON.parse(JSON.stringify(gs));advTurn(st);gRef.set(st).then(function(){addLog("⏭️ 턴 종료");});}
function buyL(){var st=JSON.parse(JSON.stringify(gs));var cur=st.players[st.currentTurn];var sq=SQ[cur.pos];if(sq.type!=="land"||(st.landOwners&&st.landOwners[cur.pos])||cur.money<sq.price)return;cur.money-=sq.price;st.landOwners=st.landOwners||{};st.landOwners[cur.pos]=cur.id;cur.lands=cur.lands||[];cur.lands.push(cur.pos);cur.stars=(cur.stars||0)+sq.stars;advTurn(st);pa=null;gRef.set(st).then(function(){addLog("🏡 "+cur.name+": "+sq.name+" 구매! ("+sq.price+"만, ⭐"+sq.stars+")");});}
function skipB(){var st=JSON.parse(JSON.stringify(gs));var cur=st.players[st.currentTurn];advTurn(st);pa=null;gRef.set(st).then(function(){addLog("⏭️ "+cur.name+": 패스");});}
function wTry(m){
  if(m==="double"){
    var d1=Math.floor(Math.random()*6)+1,d2=Math.floor(Math.random()*6)+1;
    var da=g("darea");da.classList.remove("gone");
    da.innerHTML="<div class='dice-wrap'><div class='die roll'>🎲</div><div class='die roll'>🎲</div></div>";
    setTimeout(function(){
      var dbl=d1===d2;
      da.innerHTML="<div class='dice-wrap'><div class='die"+(dbl?" dbl":"")+"'>"+DF[d1]+"</div><div class='die"+(dbl?" dbl":"")+"'>"+DF[d2]+"</div></div>"+(dbl?"<div><span class='dbl-badge'>탈출!</span></div>":"");
      addLog("🎲 더블 도전 "+d1+"+"+d2+(dbl?" → 탈출!":" → 실패"));procW(dbl);
    },420);
  } else {pa={type:"oddeven_choice"};renderActions(true,gs.players.find(function(p){return p.id===myId;}),null);}
}
function oePick(c){
  var d=Math.floor(Math.random()*6)+1,io=d%2===1,w=(c==="odd"&&io)||(c==="even"&&!io);
  var da=g("darea");da.classList.remove("gone");
  da.innerHTML="<div class='dice-wrap'><div class='die"+(w?" dbl":"")+"'>"+DF[d]+"</div></div>";
  addLog("🎲 "+d+(io?" (홀)":" (짝)")+" → "+(c==="odd"?"홀":"짝")+" → "+(w?"탈출!":"실패"));
  procW(w);
}
function procW(esc){var st=JSON.parse(JSON.stringify(gs));var cur=st.players[st.currentTurn];if(esc){cur.inWilderness=false;cur.wildernessCount=0;pa=null;st.needAction=false;gRef.set(st).then(function(){rollDice();});}else{cur.wildernessCount=(cur.wildernessCount||0)+1;advTurn(st);pa=null;gRef.set(st).then(function(){addLog("😔 광야 탈출 실패");});}}
function confirmTrain(){var dest=parseInt(g("td").value);var st=JSON.parse(JSON.stringify(gs));var cur=st.players[st.currentTurn];cur.pos=dest;advTurn(st);pa=null;gRef.set(st).then(function(){addLog("🚂 "+SQ[dest].name+"으로 이동!");});}
function stealL(fid,pos){var st=JSON.parse(JSON.stringify(gs));var cur=st.players[st.currentTurn];var fr=st.players.find(function(p){return p.id===fid;});if(!fr)return;fr.lands=(fr.lands||[]).filter(function(p){return p!==pos;});fr.stars=Math.max(0,(fr.stars||0)-(SQ[pos].stars||0));cur.lands=cur.lands||[];cur.lands.push(pos);cur.stars=(cur.stars||0)+(SQ[pos].stars||0);st.landOwners=st.landOwners||{};st.landOwners[pos]=cur.id;advTurn(st);pa=null;gRef.set(st).then(function(){addLog("👊 "+cur.name+": "+fr.name+"의 "+SQ[pos].name+" 획득!");});}
function takeR2(pos){var st=JSON.parse(JSON.stringify(gs));var cur=st.players[st.currentTurn];var sq=SQ[pos];cur.lands=cur.lands||[];cur.lands.push(pos);cur.stars=(cur.stars||0)+sq.stars;st.landOwners=st.landOwners||{};st.landOwners[pos]=cur.id;advTurn(st);pa=null;gRef.set(st).then(function(){addLog("🗺️ 2열 "+sq.name+" 획득!");});}
function addLog(msg){if(lRef)lRef.push(msg);}
function showModal(t,b,a){g("mtitle").textContent=t;g("mbody").innerHTML=b;g("mact").innerHTML=a||"<button class='btn gold bsm' onclick='closeModal()'>확인</button>";g("mov").classList.remove("gone");}
function closeModal(){g("mov").classList.add("gone");}
</script>
