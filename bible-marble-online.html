<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Noto Sans KR',sans-serif;overflow:hidden;background:#0d1117}
#app{height:100dvh;display:flex;flex-direction:column;max-width:500px;margin:0 auto;background:#0d1117;color:#e6edf3;position:relative;overflow:hidden}
.gone{display:none!important}

/* LOBBY */
#lobby{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:32px 24px;background:radial-gradient(ellipse at 50% 30%,#1a2a4a,#0d1117);gap:0}
.logo{font-size:72px;animation:fl 3s ease-in-out infinite;filter:drop-shadow(0 0 20px #f0c04080)}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.ttl{font-size:38px;font-weight:900;color:#f0c040;letter-spacing:-1px;margin:8px 0 4px;text-shadow:0 0 30px #f0c04060}
.sub{color:#8b949e;font-size:13px;margin-bottom:40px}
.lbtns{width:100%;display:flex;flex-direction:column;gap:12px}
.install-hint{color:#4fc3f7;font-size:11px;margin-top:16px;text-align:center;opacity:.8}

/* SETUP */
#setup{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:24px;position:relative}
.backbtn{position:absolute;top:14px;left:14px;background:none;border:none;color:#8b949e;font-size:26px;cursor:pointer}

/* BUTTONS */
.btn{border:none;border-radius:13px;padding:14px 18px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;width:100%;-webkit-tap-highlight-color:transparent;transition:transform .1s,opacity .1s}
.btn:active{transform:scale(.96);opacity:.85}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.gold{background:#f0c040;color:#1a1a2e;box-shadow:0 4px 18px #f0c04040}
.bblue{background:#4fc3f7;color:#0d1117}
.bgreen{background:#2ecc71;color:#fff}
.bgray{background:#2d333b;color:#e6edf3}
.bred{background:#e74c3c;color:#fff}
.borange{background:#e67e22;color:#fff}
.bpurple{background:#9b59b6;color:#fff}
.bsm{padding:10px 14px;font-size:13px;border-radius:10px}
.brow{display:flex;gap:8px}.brow .btn{flex:1}
.inp{background:#1c2128;border:1px solid #30363d;border-radius:11px;padding:13px 15px;color:#e6edf3;font-size:15px;font-family:'Noto Sans KR',sans-serif;outline:none;width:100%}
.inp:focus{border-color:#f0c040}
.inp::placeholder{color:#8b949e}

/* GAME */
#game{flex:1;display:flex;flex-direction:column;overflow:hidden}
.ghdr{background:#161b22;padding:7px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #30363d;flex-shrink:0;gap:6px}
.gtitle{font-weight:900;color:#f0c040;font-size:14px}
.rbadge{background:#0f3460;color:#4fc3f7;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:700}
.timerbx{font-size:12px;font-weight:900;padding:3px 9px;border-radius:20px;background:#1a2e1a;border:1px solid #2ecc71;color:#2ecc71}
.timerbx.warn{background:#2e1a1a;border-color:#e74c3c;color:#e74c3c}
.tbar{padding:7px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #30363d;flex-shrink:0}
.tbar.my{background:linear-gradient(90deg,#1a3a1a,#162e16)}
.tbar.other{background:#1c2128}
.mybadge{background:#2ecc71;color:#fff;font-size:11px;font-weight:900;padding:3px 10px;border-radius:20px;animation:pu 1s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.6}}
.tabs{display:flex;border-bottom:1px solid #30363d;flex-shrink:0}
.tab{flex:1;padding:8px 0;background:none;border:none;color:#8b949e;font-family:'Noto Sans KR',sans-serif;font-size:11px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:#f0c040;border-bottom-color:#f0c040;background:#161b22}
.tcwrap{flex:1;overflow:hidden;position:relative}
.tc{position:absolute;inset:0;overflow-y:auto;padding:10px}

/* ACTION BAR */
.abar{flex-shrink:0;background:#0d1117;border-top:1px solid #30363d;padding:10px 12px;max-height:45vh;overflow-y:auto}

/* BOARD LIST STYLE */
.board-outer{padding:8px}
.pchips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.pchip{border-radius:9px;padding:6px 8px;border:1px solid transparent;font-size:10px;min-width:70px}
.pchip.cur{border-color:#f0c040}
.pchip.me{border-color:inherit}
.sq-item{display:flex;align-items:center;gap:8px;border-radius:10px;padding:8px 10px;margin-bottom:4px;border:2px solid transparent;position:relative;cursor:default}
.sq-item.land{background:#161b22;border-color:#30363d}
.sq-item.special{background:#1a1a2e;border-color:#2a3a5a}
.sq-item.key-sq{background:#2a2010;border-color:#6a5010}
.sq-item.mine{background:#0a2010;border-color:#2ecc71}
.sq-item.others{background:#0a1030;border-color:#3498db}
.sq-item.here{border-color:#f0c040;background:#2a2010;box-shadow:0 0 10px #f0c04050}
.sq-item.me-here{border-color:#f0c040!important;background:#2a2010!important;box-shadow:0 0 12px #f0c04080!important}
.sq-num{font-size:10px;color:#8b949e;width:16px;flex-shrink:0;text-align:right}
.sq-icon2{font-size:16px;flex-shrink:0}
.sq-info{flex:1;min-width:0}
.sq-name2{font-size:13px;font-weight:700;line-height:1.2}
.sq-desc{font-size:10px;color:#8b949e}
.sq-right{text-align:right;flex-shrink:0}
.sq-price2{font-size:11px;color:#4fc3f7;font-weight:700}
.sq-toll2{font-size:10px;color:#e74c3c}
.sq-stars2{font-size:10px;color:#ffd700}
.sq-owner2{font-size:11px}
.sq-players2{display:flex;gap:2px;flex-shrink:0}
.section-hdr{font-size:10px;font-weight:900;color:#8b949e;letter-spacing:1px;padding:6px 4px 3px;margin-top:4px}

/* DICE */
.dice-area{text-align:center;padding:6px 0}
.dice-wrap{display:flex;gap:14px;justify-content:center;margin-bottom:6px}
.die{width:54px;height:54px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 3px 12px rgba(0,0,0,.5);border:2px solid #ddd;transition:transform .15s}
.die.dbl{border-color:#f0c040;box-shadow:0 3px 18px #f0c04080}
.die.rolling{animation:dr .5s ease-in-out infinite alternate}
@keyframes dr{0%{transform:rotate(-15deg) scale(.9)}100%{transform:rotate(15deg) scale(1.1)}}
.dbl-badge{background:#f0c040;color:#1a1a2e;font-size:12px;font-weight:900;padding:2px 12px;border-radius:20px;display:inline-block;margin-bottom:4px}

/* CARD FLIP */
.card-flip-wrap{perspective:600px;width:200px;margin:0 auto 12px;height:130px}
.card-flip{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .6s ease}
.card-flip.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;padding:12px}
.card-front{background:linear-gradient(135deg,#2a2010,#1a1508);border:2px solid #a07820}
.card-back{background:linear-gradient(135deg,#1a2a3a,#0a1a2a);border:2px solid #4a7090;transform:rotateY(180deg)}
.card-key-icon{font-size:40px}
.card-back-text{font-size:13px;line-height:1.6;color:#e6edf3;white-space:pre-line;text-align:center}

/* BAG */
.bag-btn{position:fixed;bottom:80px;right:16px;background:#9b59b6;border:none;border-radius:50%;width:48px;height:48px;font-size:22px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.4);z-index:50;display:flex;align-items:center;justify-content:center}
.bag-count{position:absolute;top:-2px;right:-2px;background:#e74c3c;color:#fff;font-size:9px;font-weight:900;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center}

/* OPPONENT DICE BANNER */
.opp-dice{background:#1c2128;border:1px solid #30363d;border-radius:12px;padding:8px 12px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.opp-dice-roll{display:flex;gap:8px}
.opp-die{width:36px;height:36px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid #ddd}
.opp-die.dbl{border-color:#f0c040}

/* MODAL */
.mov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:flex-end;justify-content:center;z-index:200;max-width:500px;margin:0 auto}
.mo{background:#1c2128;border-radius:20px 20px 0 0;padding:20px 18px 28px;width:100%;border-top:1px solid #30363d;max-height:88vh;overflow-y:auto}
.mo-title{font-size:17px;font-weight:900;color:#f0c040;margin-bottom:10px}

/* TOAST */
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#1c2128;border:1px solid #30363d;border-radius:20px;padding:8px 18px;font-size:13px;color:#e6edf3;z-index:300;white-space:nowrap;animation:toastIn .3s ease;pointer-events:none}
@keyframes toastIn{from{opacity:0;top:70px}to{opacity:1;top:80px}}

/* MOVE ANIMATION */
.player-move-indicator{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:48px;z-index:150;animation:moveAni .4s ease-out forwards;pointer-events:none}
@keyframes moveAni{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) scale(1.5)}}

/* BANKRUPT */
.bankrupt-overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:500;max-width:500px;margin:0 auto}
.bankrupt-icon{font-size:80px;animation:shake .5s ease-in-out}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}

/* RANKING */
.rank-card{background:#1c2128;border-radius:14px;padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;border:1px solid #30363d}
.rank-num{font-size:24px;font-weight:900;width:30px;text-align:center}
.rank-1{color:#f0c040}
.rank-2{color:#c0c0c0}
.rank-3{color:#cd7f32}

.spin{display:inline-block;width:18px;height:18px;border:2px solid #30363d;border-top-color:#f0c040;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:4px}
</style>
</head>

}
function showSetup(m){

}
function serr(msg){g("serr").textContent=msg;g("serr").style.display="block";g("sld").classList.add("gone");g("sbtn").disabled=false;}
function mkP(idx){return{id:myId,name:myName,money:cm(),pos:0,lands:[],stars:0,inWilderness:false,wildernessCount:0,cards:[],color:CL[idx],emoji:EM[idx],bankrupt:false};}

function handleSetup(){
  var nm=g("ni").value.trim();if(!nm){serr("닉네임을 입력해주세요");return;}
  g("sld").classList.remove("gone");g("sbtn").disabled=true;g("serr").style.display="none";
  if(smode==="create"){createRoom(nm);}
  else{var cd=g("rc").value.trim().toUpperCase();if(!cd||cd.length!==5){serr("방 코드 5자리를 입력해주세요");return;}joinRoom(nm,cd);}
}
function createRoom(nm){
  myId="p_"+Math.random().toString(36).slice(2,9);myName=nm;
  roomId=Math.random().toString(36).slice(2,7).toUpperCase();
  var st={phase:"waiting",players:[mkP(0)],currentTurn:0,landOwners:{},offeringPool:0,
    keyDeck:shuf(KC.map(function(c){return c.id;})),consecutiveDoubles:0,hostId:myId,
    timeLimitMin:selTime,startTime:0,needAction:false,lastDice:null,lastMove:null};
  rRef=db.ref("rooms/"+roomId);gRef=db.ref("rooms/"+roomId+"/state");lRef=db.ref("rooms/"+roomId+"/log");
  rRef.set({state:st,log:{0:"방 생성! 코드: "+roomId+(selTime>0?" | ⏱️"+selTime+"분":"")}}).then(enterGame).catch(function(e){serr("오류: "+e.message);});
}
function joinRoom(nm,cd){
  db.ref("rooms/"+cd).once("value").then(function(snap){
    if(!snap.exists()){serr("방을 찾을 수 없습니다");return;}
    var d=snap.val();
    if(d.state.phase!=="waiting"){serr("이미 시작된 게임입니다");return;}
    var pl=d.state.players||[];if(pl.length>=6){serr("방이 꽉 찼습니다");return;}
    myId="p_"+Math.random().toString(36).slice(2,9);myName=nm;roomId=cd;
    var np=mkP(pl.length);pl.push(np);
    rRef=db.ref("rooms/"+roomId);gRef=db.ref("rooms/"+roomId+"/state");lRef=db.ref("rooms/"+roomId+"/log");
    gRef.update({players:pl}).then(function(){lRef.push(myName+"님 입장! 👋");enterGame();}).catch(function(e){serr("오류: "+e.message);});
  }).catch(function(e){serr("오류: "+e.message);});
}
function enterGame(){
  g("rbadge").textContent="코드: "+roomId;
  showScr("game");g("bag-btn").classList.remove("gone");
  gRef.on("value",function(snap){if(!snap.exists())return;var prev=gs;gs=snap.val();
    // 상대방 주사위 표시
    if(gs.lastDice&&gs.lastDice.playerId!==myId){
      if(!prev||!prev.lastDice||prev.lastDice.ts!==gs.lastDice.ts)showOppDice(gs.lastDice);
    }
    renderGame();updateTimer();updateBagBtn();
  });
  lRef.on("value",function(snap){
    if(!snap.exists())return;
    var es=Object.values(snap.val()).reverse();
    g("tl").innerHTML=es.map(function(e){return"<div style='background:#161b22;border-radius:7px;padding:7px 9px;margin-bottom:4px;font-size:11px;color:#c9d1d9;line-height:1.5'>"+e+"</div>";}).join("");
  });
}

function updateTimer(){
  var lim=gs&&gs.timeLimitMin||0;
  if(!lim||!gs.startTime||gs.phase!=="playing"){g("tmr").classList.add("gone");return;}
  g("tmr").classList.remove("gone");
  var left=Math.max(0,lim*60-Math.floor((Date.now()-gs.startTime)/1000));
  var mm=Math.floor(left/60),ss=left%60;
  g("tmr").textContent=(mm<10?"0":"")+mm+":"+(ss<10?"0":"")+ss;
  g("tmr").className=left<300?"timerbx warn":"timerbx";
  if(left===0)showFinalRanking("시간 종료");
}

function updateBagBtn(){
  var me=gs&&gs.players&&gs.players.find(function(p){return p.id===myId;});
  var cnt=(me&&me.cards&&me.cards.length)||0;
  g("bag-count").textContent=cnt;
  g("bag-btn").style.display=cnt>0?"flex":"none";
}

function renderGame(){
  if(!gs)return;
  if(gs.phase==="waiting"){
    g("pwait").classList.remove("gone");g("pwait").style.display="block";
    g("pplay").classList.add("gone");g("pplay").style.display="none";
    var pl=gs.players||[];
    g("wpl").innerHTML=pl.map(function(p){var m=p.id===myId?"<span style='color:#4fc3f7;font-size:10px'>(나)</span>":"";return"<div style='background:#161b22;border-radius:10px;padding:9px 12px;margin-bottom:7px;display:flex;align-items:center;gap:9px;border:1px solid #30363d'><span style='font-size:24px'>"+p.emoji+"</span><span style='color:"+p.color+";font-weight:700'>"+p.name+"</span>"+m+"</div>";}).join("");
    g("wti").textContent=gs.timeLimitMin>0?"⏱️ 제한 시간: "+gs.timeLimitMin+"분":"⏱️ 제한 시간 없음";
    var isH=pl[0]&&pl[0].id===myId;
    g("bstart").classList.toggle("gone",!isH);g("whint").classList.toggle("gone",isH);
  } else {
    g("pwait").classList.add("gone");g("pwait").style.display="none";
    g("pplay").classList.remove("gone");g("pplay").style.display="flex";
    var activePlayers=gs.players.filter(function(p){return!p.bankrupt;});
    var cur=gs.players[gs.currentTurn];
    var isMT=cur&&cur.id===myId&&!cur.bankrupt;
    var me=gs.players.find(function(p){return p.id===myId;});
    g("tbar").className="tbar "+(isMT?"my":"other");
    g("temoji").textContent=cur?cur.emoji:"";g("tname").textContent=cur?cur.name:"";
    g("mbadge").classList.toggle("gone",!isMT);
    renderBoard(me);renderInfo(me);
    if(!isMT&&!me.bankrupt)g("ac").innerHTML="<div style='text-align:center;color:#8b949e;font-size:13px;padding:4px 0'>"+(cur?cur.emoji+" "+cur.name:"")+"의 차례입니다...</div>";
    else if(!me.bankrupt)renderActions(me,cur);
  }
}

function renderBoard(me){
  var own=gs.landOwners||{},bp={};
  gs.players.forEach(function(p){if(!p.bankrupt)(bp[p.pos]=bp[p.pos]||[]).push(p);});

  var chips="<div class='pchips'>"+gs.players.map(function(p){
    var isCur=gs.players[gs.currentTurn]&&gs.players[gs.currentTurn].id===p.id;
    var isMe=p.id===myId;
    return"<div class='pchip"+(isCur?" cur":"")+"' style='background:"+p.color+"20;border-color:"+(isMe?p.color:(isCur?"#f0c040":"transparent"))+"'>"
      +"<div style='display:flex;align-items:center;gap:3px'><span>"+p.emoji+"</span><span style='color:"+p.color+";font-size:10px;font-weight:700'>"+p.name+(p.bankrupt?" 💀":"")+"</span></div>"

      +"</div>";

  var sections={};

    var h=bp[s.id]||[];

    var isMine=op&&op.id===myId,isOther=op&&!isMine;
    var isHere=h.some(function(p){return p.id===myId;});
    var cls="sq-item "+
      (s.type==="land"?"land"+(isMine?" mine":isOther?" others":""):
       s.type==="key"?"key-sq":"special")+
      (isHere?" me-here":"");
    var playerDots=h.map(function(p){return"<span>"+p.emoji+"</span>";}).join("");

        +"<div class='sq-stars2'>"+"★".repeat(Math.min(s.stars,5))+"</div>"

    return"<div class='"+cls+"'>"
      +"<span class='sq-num'>"+s.id+"</span>"
      +"<span class='sq-icon2'>"+(s.type==="land"?"🏛️":(s.icon||""))+"</span>"
      +"<div class='sq-info'><div class='sq-name2'>"+s.name+"</div><div class='sq-desc'>"+s.desc+"</div></div>"
      +right

  var sectionOrder=["특수","1열","2열","3열","4열"];
  var boardHtml=sectionOrder.map(function(sec){
    if(!sections[sec])return"";
    return"<div class='section-hdr'>"+sec+"</div>"+sections[sec].map(sqHtml).join("");
  }).join("");

  g("tb").innerHTML=chips+boardHtml;
  // 내 위치로 스크롤
  setTimeout(function(){var el=g("tb").querySelector(".me-here");if(el)el.scrollIntoView({behavior:"smooth",block:"center"});},100);

    // 이동 버튼
    g("ac").innerHTML="<button class='btn gold' id='bmove'>📍 "+(d1+d2)+"칸 이동!</button>";
    g("bmove").onclick=function(){
      // Firebase에 주사위 결과 저장
      gRef.update({lastDice:diceData}).then(function(){procTurn(d1,d2);});
    };
  },800);
}

function animateMove(fromPos,toPos,emoji,callback){
  var steps=[];
  var cur=fromPos;
  while(cur!==toPos){cur=(cur+1)%TOTAL;steps.push(cur);}
  if(!steps.length){callback();return;}
  var i=0;
  function step(){
    if(i>=steps.length){callback();return;}
    var pos=steps[i++];
    // 잠깐 표시
    var div=document.createElement("div");div.className="player-move-indicator";div.textContent=emoji;
    document.body.appendChild(div);setTimeout(function(){if(div.parentNode)div.parentNode.removeChild(div);},380);
    // 토스트로 현재 위치 표시
    showToast(emoji+" → "+SQ[pos].name,600);
    setTimeout(step,350);
  }
  setTimeout(step,100);
}

function showToast(msg,duration){
  var t=document.querySelector(".toast");if(t)t.remove();
  t=document.createElement("div");t.className="toast";t.textContent=msg;
  document.body.appendChild(t);setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},duration||2000);
}

function procTurn(d1,d2){
  var st=JSON.parse(JSON.stringify(gs));
  var cur=st.players[st.currentTurn],isD=d1===d2;
  var logs=["🎲 "+cur.name+": "+d1+"+"+d2+"="+(d1+d2)+(isD?" 🎯더블!":"")];
  st.needAction=false;

  if(cur.inWilderness){
    if(isD){cur.inWilderness=false;cur.wildernessCount=0;logs.push("🌟 "+cur.name+": 광야 탈출!");}
    else{pa={type:"wilderness_choice"};gRef.set(st).then(function(){logs.forEach(addLog);renderActions(cur,cur);});return;}
  }

  var cs=isD?(st.consecutiveDoubles||0)+1:0;st.consecutiveDoubles=cs;
  if(cs>=3){
    cur.inWilderness=true;cur.wildernessCount=0;cur.pos=14;st.consecutiveDoubles=0;
    logs.push("⚠️ 더블 3연속! 광야로 이동!");
    advTurn(st);gRef.set(st).then(function(){logs.forEach(addLog);});return;
  }

  var steps=d1+d2,oldPos=cur.pos,np=(oldPos+steps)%TOTAL;
  if(oldPos+steps>=TOTAL){
    if(np===0){cur.money+=100;logs.push("🏠 "+cur.name+": 시작/마침 정착 +100만원");}
    else{cur.money+=50;logs.push("💰 "+cur.name+": 시작 통과 +50만원");}
  }

  // 한 칸씩 이동 애니메이션 후 처리
  animateMove(oldPos,np,cur.emoji,function(){
    cur.pos=np;var sq=SQ[np];
    logs.push("📍 "+cur.name+": "+sq.name+"에 도착");
    var need=false;

    if(sq.type==="land"){
      var oid=st.landOwners&&st.landOwners[np];
      if(!oid){need=true;st.needAction=true;}
      else if(oid!==cur.id){
        var owP=st.players.find(function(p){return p.id===oid;});
        var hasTF=(cur.cards||[]).includes(19);
        if(hasTF){cur.cards=cur.cards.filter(function(c){return c!==19;});logs.push("🎫 통행권 사용! 통행료 면제");}
        else if(owP){
          // 통행료 팝업
          pa={type:"pay_toll",toll:sq.toll,ownerId:oid};need=true;st.needAction=true;
          logs.push("⚠️ "+cur.name+": "+sq.name+"에 걸림! 통행료 "+sq.toll+"만원");
        }
      } else logs.push("🏠 "+cur.name+": 내 땅!");
    } else if(sq.type==="key"){
      var dk=st.keyDeck||[];if(!dk.length)dk=shuf(KC.map(function(c){return c.id;}));
      var cid=dk.shift();st.keyDeck=dk;
      var card=KC.find(function(c){return c.id===cid;});
      logs.push("🔑 "+cur.name+": 천국열쇠 카드!");
      var res=applyC(st,cur,card);
      if(res){pa=res;need=true;st.needAction=true;}
      showKC(card,res);
    } else if(sq.type==="wilderness"){
      if(!cur.inWilderness){cur.inWilderness=true;cur.wildernessCount=0;logs.push("🏜️ "+cur.name+": 광야에 갇혔습니다!");}
    } else if(sq.type==="train"){
      pa={type:"train_move"};need=true;st.needAction=true;logs.push("🚂 "+cur.name+": 구원열차!");
    } else if(sq.type==="offering"){
      var pl2=st.offeringPool||0;
      if(cur.money>=100){cur.money-=100;st.offeringPool=pl2+100;logs.push("💌 헌금 100만원");}
      else if(cur.money>=50){cur.money-=50;st.offeringPool=pl2+50;logs.push("💌 헌금 50만원");}
      if(pl2>0){cur.money+=pl2;st.offeringPool=0;logs.push("💝 헌금 풀 "+pl2+"만원 획득!");}
    } else if(sq.type==="start"){cur.money+=100;logs.push("🏠 시작/마침 정착 +100만원");}

    if(!need&&!isD)advTurn(st);
    else if(!need&&isD)logs.push("🎯 더블! "+cur.name+" 한 번 더 굴리세요!");
    gRef.set(st).then(function(){logs.forEach(addLog);});
  });
}

function showKC(card,needAction){
  // 카드 뒤집기 애니메이션
  var html="<div class='card-flip-wrap'><div class='card-flip' id='cflip'>"
    +"<div class='card-face card-front'><div class='card-key-icon'>🔑</div><div style='color:#a07820;font-size:12px;margin-top:4px'>눌러서 확인</div></div>"
    +"<div class='card-face card-back'><div style='font-size:32px'>"+card.icon+"</div><div class='card-back-text'>"+card.text+"</div></div>"
    +"</div></div>"
    +(card.keep?"<div style='text-align:center;color:#4fc3f7;font-size:11px;margin-bottom:8px'>📦 가방에 보관됩니다</div>":"");
  showModal("🔑 천국열쇠 카드",html,"<button class='btn gold bsm' onclick='closeModal()'>확인</button>");
  setTimeout(function(){var cf=g("cflip");if(cf)cf.classList.add("flipped");},400);
  // 카드 클릭으로도 뒤집기
  setTimeout(function(){var cf=g("cflip");if(cf)cf.onclick=function(){cf.classList.add("flipped");};},100);
}

function applyC(st,cur,card){
  switch(card.type){
    case"money":cur.money+=card.amount;showToast(cur.emoji+" +"+card.amount+"만원 받았습니다! 💰");break;
    case"move_start":cur.pos=0;cur.money+=100;break;
    case"move_wilderness":cur.pos=14;cur.inWilderness=true;cur.wildernessCount=0;break;
    case"move_train":cur.pos=33;return{type:"train_move"};
    case"move_offering":cur.pos=47;break;
    case"pay_offering":var amt=Math.min(cur.money,card.amount);cur.money-=amt;st.offeringPool=(st.offeringPool||0)+amt;break;
    case"steal":return{type:"steal_land"};
    case"give_land":return{type:"give_land"};
    case"take_row2":return{type:"take_row2"};
    case"extra_dice":case"escape_wilderness":case"toll_free":
      if(card.keep){cur.cards=cur.cards||[];cur.cards.push(card.id);showToast("🎒 카드를 가방에 넣었습니다!");}break;
    default:break;
  }
  return null;
}

// ── 가방 (보관 카드) ──
function openBag(){
  var me=gs&&gs.players&&gs.players.find(function(p){return p.id===myId;});
  var cards=(me&&me.cards)||[];
  if(!cards.length){showModal("🎒 가방","<div style='color:#8b949e;text-align:center'>보관된 카드가 없습니다</div>","<button class='btn bgray bsm' onclick='closeModal()'>닫기</button>");return;}
  var isMT=gs&&gs.players[gs.currentTurn]&&gs.players[gs.currentTurn].id===myId;
  var html=cards.map(function(cid){
    var c=KC.find(function(x){return x.id===cid;});
    if(!c)return"";
    var useBtn=isMT?"<button class='btn bsm bgreen' style='flex:none;width:auto;padding:5px 10px;font-size:11px' onclick='useBagCard("+cid+")'>사용</button>":"<span style='color:#8b949e;font-size:10px'>내 차례에 사용 가능</span>";
    return"<div style='background:#161b22;border-radius:10px;padding:10px 12px;margin-bottom:7px;display:flex;align-items:center;gap:10px;border:1px solid #30363d'>"
      +"<span style='font-size:24px'>"+c.icon+"</span>"
      +"<div style='flex:1'><div style='font-weight:700;font-size:12px'>"+c.text.split("\n")[0]+"</div></div>"
      +"<div>"+useBtn+"</div></div>";
  }).join("");
  showModal("🎒 가방 (보관 카드)",html,"<button class='btn bgray bsm' onclick='closeModal()'>닫기</button>");
}

function useBagCard(cid){
  if(!gs)return;
  var me=gs.players.find(function(p){return p.id===myId;});
  var isMT=gs.players[gs.currentTurn]&&gs.players[gs.currentTurn].id===myId;
  if(!isMT){showToast("내 차례에만 사용할 수 있습니다!");return;}
  var c=KC.find(function(x){return x.id===cid;});
  if(!c)return;
  var st=JSON.parse(JSON.stringify(gs));
  var cur=st.players[st.currentTurn];
  // 카드 제거
  cur.cards=cur.cards.filter(function(id){return id!==cid;});
  closeModal();

  if(c.type==="extra_dice"){
    // 주사위 한 번 더
    gRef.set(st).then(function(){addLog("🎲 "+cur.name+": 추가 주사위 카드 사용!");rollDice();});
  } else if(c.type==="escape_wilderness"){
    if(!cur.inWilderness){showToast("광야에 있지 않습니다!");return;}
    cur.inWilderness=false;cur.wildernessCount=0;
    gRef.set(st).then(function(){addLog("🌟 "+cur.name+": 광야 탈출 카드 사용!");});
  } else if(c.type==="toll_free"){
    showToast("🎫 통행권 준비 완료! 다음 통행 시 자동 사용");
    gRef.set(st);
  } else {
    gRef.set(st).then(function(){var res=applyC(st,cur,c);if(res){pa=res;renderActions(cur,cur);}addLog("🎒 "+cur.name+": "+c.text.split("\n")[0]+" 카드 사용!");gRef.set(st);});
  }
}

// ── GAME ACTIONS ──
function startGame(){
  if(!gs||gs.players.length<2){alert("최소 2명이 필요합니다!");return;}
  var st=JSON.parse(JSON.stringify(gs));
  st.phase="playing";st.currentTurn=0;
  st.startTime=gs.timeLimitMin>0?Date.now():0;st.needAction=false;
  gRef.set(st).then(function(){addLog("🎮 게임 시작!");});
}

function advTurn(st){
  var nextTurn=(st.currentTurn+1)%st.players.length;
  // 파산한 사람 건너뜀
  var count=0;
  while(st.players[nextTurn].bankrupt&&count<st.players.length){
    nextTurn=(nextTurn+1)%st.players.length;count++;
  }
  st.currentTurn=nextTurn;st.needAction=false;
}

function endTurn(){pa=null;var st=JSON.parse(JSON.stringify(gs));advTurn(st);gRef.set(st).then(function(){addLog("⏭️ 턴 종료");});}

function payToll(){
  var st=JSON.parse(JSON.stringify(gs));
  var cur=st.players[st.currentTurn];
  var owP=st.players.find(function(p){return p.id===pa.ownerId;});
  var toll=pa.toll;
  var paid=Math.min(cur.money,toll);
  cur.money-=paid;if(owP)owP.money+=paid;
  addLog("💸 "+cur.name+"→"+(owP?owP.name:"")+" 통행료 "+toll+"만원");
  pa=null;st.needAction=false;advTurn(st);
  gRef.set(st).then(function(){checkBankrupt(cur.id);});
}

function checkBankrupt(playerId){
  var st=JSON.parse(JSON.stringify(gs));
  var p=st.players.find(function(x){return x.id===playerId;});
  if(!p)return;
  if(p.money<=0&&(p.lands||[]).length===0&&!p.bankrupt){
    p.bankrupt=true;
    // 파산한 사람 땅 은행으로 반환
    (p.lands||[]).forEach(function(pos){delete st.landOwners[pos];});p.lands=[];p.stars=0;
    gRef.set(st).then(function(){
      addLog("💀 "+p.name+": 파산하셨습니다!");
      if(p.id===myId){
        showModal("💀 파산","<div style='text-align:center'><div style='font-size:60px'>💀</div><div style='font-size:18px;font-weight:900;color:#e74c3c;margin:8px 0'>파산하셨습니다!</div><div style='color:#8b949e'>모든 땅이 은행으로 반환되었습니다.</div></div>","<button class='btn bgray bsm' onclick='closeModal()'>확인</button>");
      }
      // 남은 플레이어 체크
      var alive=st.players.filter(function(x){return!x.bankrupt;});
      if(alive.length===1){showFinalRanking("플레이어 탈락");}
    });
  }
}

function sellLand(pos){
  var st=JSON.parse(JSON.stringify(gs));
  var cur=st.players[st.currentTurn];
  var sq=SQ[pos];
  if(!sq||!cur.lands.includes(pos))return;
  var sellPrice=sq.sell||Math.floor(sq.price/2);
  cur.money+=sellPrice;
  cur.lands=cur.lands.filter(function(p){return p!==pos;});
  cur.stars=Math.max(0,(cur.stars||0)-(sq.stars||0));
  delete st.landOwners[pos];
  gRef.set(st).then(function(){
    addLog("🏦 "+cur.name+": "+sq.name+" 은행에 매각 ("+sellPrice+"만원)");
    showToast("🏦 "+sq.name+" 매각! +"+sellPrice+"만원");
    // 통행료 팝업이 있었다면 다시 체크
    if(pa&&pa.type==="pay_toll"){renderActions(cur,cur);}
  });
}

function buyL(){
  var st=JSON.parse(JSON.stringify(gs));
  var cur=st.players[st.currentTurn];var sq=SQ[cur.pos];
  if(sq.type!=="land"||(st.landOwners&&st.landOwners[cur.pos])||cur.money<sq.price)return;
  cur.money-=sq.price;st.landOwners=st.landOwners||{};st.landOwners[cur.pos]=cur.id;
  cur.lands=cur.lands||[];cur.lands.push(cur.pos);cur.stars=(cur.stars||0)+sq.stars;
  advTurn(st);pa=null;
  gRef.set(st).then(function(){addLog("🏡 "+cur.name+": "+sq.name+" 구매! ("+sq.price+"만, ⭐"+sq.stars+")");});
}

function skipB(){
  var st=JSON.parse(JSON.stringify(gs));var cur=st.players[st.currentTurn];
  advTurn(st);pa=null;gRef.set(st).then(function(){addLog("⏭️ "+cur.name+": 구매 패스");});
}

function confirmTrain(){
  var dest=parseInt(g("td").value);
  var st=JSON.parse(JSON.stringify(gs));var cur=st.players[st.currentTurn];
  cur.pos=dest;pa=null;
  // 도착한 칸이 땅이면 구매 기회
  var sq=SQ[dest];
  var own=st.landOwners||{};
  if(sq.type==="land"&&!own[dest]){st.needAction=true;}
  else{advTurn(st);}
  gRef.set(st).then(function(){addLog("🚂 "+cur.name+": "+sq.name+"으로 이동!");});
}

function stealL(fid,pos){
  var st=JSON.parse(JSON.stringify(gs));var cur=st.players[st.currentTurn];
  var fr=st.players.find(function(p){return p.id===fid;});if(!fr)return;
  fr.lands=(fr.lands||[]).filter(function(p){return p!==pos;});
  fr.stars=Math.max(0,(fr.stars||0)-(SQ[pos].stars||0));
  cur.lands=cur.lands||[];cur.lands.push(pos);cur.stars=(cur.stars||0)+(SQ[pos].stars||0);
  st.landOwners=st.landOwners||{};st.landOwners[pos]=cur.id;
  advTurn(st);pa=null;
  gRef.set(st).then(function(){addLog("👊 "+cur.name+": "+fr.name+"의 "+SQ[pos].name+" 획득!");});
}

function takeR2(pos){
  var st=JSON.parse(JSON.stringify(gs));var cur=st.players[st.currentTurn];var sq=SQ[pos];
  cur.lands=cur.lands||[];cur.lands.push(pos);cur.stars=(cur.stars||0)+sq.stars;
  st.landOwners=st.landOwners||{};st.landOwners[pos]=cur.id;
  advTurn(st);pa=null;gRef.set(st).then(function(){addLog("🗺️ 2열 "+sq.name+" 획득!");});
}

function giveLand(pos,toId){
  var st=JSON.parse(JSON.stringify(gs));var cur=st.players[st.currentTurn];
  var to=st.players.find(function(p){return p.id===toId;});if(!to)return;
  cur.lands=(cur.lands||[]).filter(function(p){return p!==pos;});
  cur.stars=Math.max(0,(cur.stars||0)-(SQ[pos].stars||0));
  to.lands=to.lands||[];to.lands.push(pos);to.stars=(to.stars||0)+(SQ[pos].stars||0);
  st.landOwners=st.landOwners||{};st.landOwners[pos]=to.id;
  advTurn(st);pa=null;
  gRef.set(st).then(function(){addLog("🎁 "+cur.name+": "+SQ[pos].name+"을(를) "+to.name+"에게 나눠줌!");});
}

function wTry(m){
  if(m==="double"){
    var d1=Math.floor(Math.random()*6)+1,d2=Math.floor(Math.random()*6)+1;
    var da=g("darea");da.classList.remove("gone");
    da.innerHTML="<div class='dice-wrap'><div class='die rolling'>🎲</div><div class='die rolling'>🎲</div></div>";
    setTimeout(function(){
      var dbl=d1===d2;
      da.innerHTML="<div class='dice-wrap'><div class='die"+(dbl?" dbl":"")+"'>"+DF[d1]+"</div><div class='die"+(dbl?" dbl":"")+"'>"+DF[d2]+"</div></div>"+(dbl?"<div><span class='dbl-badge'>🌟 탈출!</span></div>":"");
      addLog("🎲 더블 도전 "+d1+"+"+d2+(dbl?" → 탈출!":" → 실패"));
      procW(dbl);
    },700);
  } else {pa={type:"oddeven_choice"};var me=gs.players.find(function(p){return p.id===myId;});renderActions(me,null);}
}
function oePick(c){
  var d=Math.floor(Math.random()*6)+1,io=d%2===1,w=(c==="odd"&&io)||(c==="even"&&!io);
  var da=g("darea");da.classList.remove("gone");
  da.innerHTML="<div class='dice-wrap'><div class='die"+(w?" dbl":"")+"'>"+DF[d]+"</div></div>";
  addLog("🎲 "+d+(io?" (홀)":" (짝)")+" → "+(c==="odd"?"홀":"짝")+" → "+(w?"탈출!":"실패"));
  procW(w);
}
function procW(esc){
  var st=JSON.parse(JSON.stringify(gs));var cur=st.players[st.currentTurn];
  if(esc){cur.inWilderness=false;cur.wildernessCount=0;pa=null;st.needAction=false;
    gRef.set(st).then(function(){addLog("🌟 광야 탈출!");rollDice();});
  } else {cur.wildernessCount=(cur.wildernessCount||0)+1;advTurn(st);pa=null;
    gRef.set(st).then(function(){addLog("😔 광야 탈출 실패");});}
}

function showFinalRanking(reason){
  if(!gs)return;
  var sorted=gs.players.slice().sort(function(a,b){
    if(a.bankrupt&&!b.bankrupt)return 1;
    if(!a.bankrupt&&b.bankrupt)return -1;
    return b.stars-a.stars;
  });
  var rankEmojis=["🥇","🥈","🥉","4️⃣","5️⃣","6️⃣"];
  var html="<div style='text-align:center;color:#8b949e;font-size:12px;margin-bottom:12px'>"+reason+"으로 게임 종료!</div>"
    +sorted.map(function(p,i){
      var isWinner=i===0&&!p.bankrupt;
      return"<div class='rank-card' style='"+(isWinner?"border-color:#f0c040;background:linear-gradient(135deg,#2a2010,#1a1508)":"")+"'>"
        +"<div class='rank-num "+(i===0?"rank-1":i===1?"rank-2":i===2?"rank-3":"")+"'>"+rankEmojis[i]+"</div>"
        +"<span style='font-size:28px'>"+p.emoji+"</span>"
        +"<div style='flex:1'><div style='color:"+p.color+";font-weight:900;font-size:15px'>"+p.name+(p.bankrupt?" 💀":"")+"</div>"
        +"<div style='font-size:11px;color:#8b949e'>⭐"+p.stars+"개 | 💰"+p.money.toLocaleString()+"만원</div></div>"
        +(isWinner?"<div style='font-size:20px'>🏆</div>":"")+"</div>";
    }).join("");
  var winner=sorted.find(function(p){return!p.bankrupt;});
  showModal(winner&&winner.id===myId?"🎉 축하합니다! 승리하셨습니다!":"🏆 게임 종료! 최종 순위",html,"");
  if(winner&&winner.id===myId){setTimeout(function(){showToast("🎉 축하합니다! 승리하셨습니다! 🏆",5000);},500);}
}

function addLog(msg){if(lRef)lRef.push(msg);}
function showModal(t,b,a){g("mtitle").textContent=t;g("mbody").innerHTML=b;g("mact").innerHTML=a!==undefined?a:"<button class='btn gold bsm' onclick='closeModal()'>확인</button>";g("mov").classList.remove("gone");}
function closeModal(){g("mov").classList.add("gone");}
</script>
