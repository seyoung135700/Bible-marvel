*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Noto Sans KR',sans-serif;overflow:hidden;background:#0d1117}
#app{height:100dvh;display:flex;flex-direction:column;max-width:500px;margin:0 auto;background:#0d1117;color:#e6edf3;position:relative;overflow:hidden}
.gone{display:none!important}
/* LOBBY */
#lobby{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:32px 24px;background:radial-gradient(ellipse at 50% 30%,#1a2a4a,#0d1117)}
.logo{font-size:72px;animation:fl 3s ease-in-out infinite;filter:drop-shadow(0 0 20px #f0c04080)}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.ttl{font-size:38px;font-weight:900;color:#f0c040;letter-spacing:-1px;margin:8px 0 4px;text-shadow:0 0 30px #f0c04060}
.sub{color:#8b949e;font-size:13px;margin-bottom:40px}
.lbtns{width:100%;display:flex;flex-direction:column;gap:12px}
/* SETUP */
#setup{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:24px;position:relative}
.backbtn{position:absolute;top:14px;left:14px;background:none;border:none;color:#8b949e;font-size:26px;cursor:pointer}
/* BUTTONS */
.btn{border:none;border-radius:13px;padding:14px 18px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;width:100%;-webkit-tap-highlight-color:transparent;transition:transform .1s,opacity .1s}
.btn:active{transform:scale(.96);opacity:.85}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.gold{background:#f0c040;color:#1a1a2e;box-shadow:0 4px 18px #f0c04040}
.bblue{background:#4fc3f7;color:#0d1117}
.bgreen{background:#2ecc71;color:#fff}
.bgray{background:#2d333b;color:#e6edf3}
.bred{background:#e74c3c;color:#fff}
.bsm{padding:10px 14px;font-size:13px;border-radius:10px}
.brow{display:flex;gap:8px}.brow .btn{flex:1}
.inp{background:#1c2128;border:1px solid #30363d;border-radius:11px;padding:13px 15px;color:#e6edf3;font-size:15px;font-family:'Noto Sans KR',sans-serif;outline:none;width:100%}
.inp:focus{border-color:#f0c040}
.inp::placeholder{color:#8b949e}
/* GAME */
#game{flex:1;display:flex;flex-direction:column;overflow:hidden}
.ghdr{background:#161b22;padding:7px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #30363d;flex-shrink:0;gap:6px}
.gtitle{font-weight:900;color:#f0c040;font-size:14px}
.rbadge{background:#0f3460;color:#4fc3f7;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:700}
.timerbx{font-size:12px;font-weight:900;padding:3px 9px;border-radius:20px;background:#1a2e1a;border:1px solid #2ecc71;color:#2ecc71}
.timerbx.warn{background:#2e1a1a;border-color:#e74c3c;color:#e74c3c}
.tbar{padding:7px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #30363d;flex-shrink:0}
.tbar.my{background:linear-gradient(90deg,#1a3a1a,#162e16)}
.tbar.other{background:#1c2128}
.mybadge{background:#2ecc71;color:#fff;font-size:11px;font-weight:900;padding:3px 10px;border-radius:20px;animation:pu 1s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.6}}
.tabs{display:flex;border-bottom:1px solid #30363d;flex-shrink:0}
.tab{flex:1;padding:8px 0;background:none;border:none;color:#8b949e;font-family:'Noto Sans KR',sans-serif;font-size:11px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:#f0c040;border-bottom-color:#f0c040;background:#161b22}
.tcwrap{flex:1;overflow:hidden;position:relative}
.tc{position:absolute;inset:0;overflow-y:auto;padding:10px}
#tb{padding:0!important}
.abar{flex-shrink:0;background:#0d1117;border-top:1px solid #30363d;padding:10px 12px;max-height:45vh;overflow-y:auto}
/* BOARD CANVAS */
#board-wrap{position:relative;width:100%;height:100%;overflow-y:auto}
#board-canvas{display:block;cursor:pointer}
#board-chips{position:sticky;top:0;left:0;right:0;display:flex;gap:5px;flex-wrap:wrap;padding:6px;background:rgba(13,17,23,0.9);z-index:10;border-bottom:1px solid #30363d}
.pchip{border-radius:8px;padding:5px 7px;border:1px solid transparent;font-size:9px}
/* DICE */
.dice-wrap{display:flex;gap:14px;justify-content:center;margin-bottom:8px}
.die{width:52px;height:52px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 3px 12px rgba(0,0,0,.5);border:2px solid #ddd}
.die.dbl{border-color:#f0c040;box-shadow:0 3px 18px #f0c04080}
.die.rolling{animation:dr .5s ease-in-out infinite alternate}
@keyframes dr{0%{transform:rotate(-15deg) scale(.9)}100%{transform:rotate(15deg) scale(1.1)}}
.dbl-badge{background:#f0c040;color:#1a1a2e;font-size:12px;font-weight:900;padding:2px 12px;border-radius:20px;display:inline-block;margin-bottom:4px}
/* CARD FLIP */
.card-flip-wrap{perspective:600px;width:190px;margin:0 auto 10px;height:125px;cursor:pointer}
.card-flip{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .6s ease}
.card-flip.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;padding:12px}
.card-front{background:linear-gradient(135deg,#2a2010,#1a1508);border:2px solid #a07820}
.card-back{background:linear-gradient(135deg,#1a2a3a,#0a1a2a);border:2px solid #4a7090;transform:rotateY(180deg)}
/* MOVING PAWN */
.pawn-moving{position:fixed;z-index:500;pointer-events:none;width:40px;height:40px;border-radius:50%;overflow:hidden;transition:top .26s cubic-bezier(.4,0,.2,1),left .26s cubic-bezier(.4,0,.2,1)}
/* TOAST */
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#1c2128;border:1px solid #30363d;border-radius:20px;padding:7px 16px;font-size:12px;color:#e6edf3;z-index:300;white-space:nowrap;animation:tin .3s ease;pointer-events:none;max-width:90vw;white-space:normal;text-align:center}
@keyframes tin{from{opacity:0;top:70px}to{opacity:1;top:80px}}
/* MODAL */
.mov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:flex-end;justify-content:center;z-index:200;max-width:500px;margin:0 auto}
.mo{background:#1c2128;border-radius:20px 20px 0 0;padding:20px 18px 28px;width:100%;border-top:1px solid #30363d;max-height:88vh;overflow-y:auto}
.mo-title{font-size:17px;font-weight:900;color:#f0c040;margin-bottom:10px}
/* BAG */
.bag-btn{position:fixed;bottom:80px;right:16px;background:#9b59b6;border:none;border-radius:50%;width:48px;height:48px;font-size:22px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.4);z-index:50;display:flex;align-items:center;justify-content:center}
.bag-count{position:absolute;top:-2px;right:-2px;background:#e74c3c;color:#fff;font-size:9px;font-weight:900;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center}
/* OPP DICE */
.opp-dice{background:#1c2128;border:1px solid #30363d;border-radius:10px;padding:7px 10px;margin-bottom:6px;display:flex;align-items:center;gap:8px;font-size:12px}
.opp-die{width:32px;height:32px;background:#fff;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:18px;border:2px solid #ddd}
.opp-die.dbl{border-color:#f0c040}
/* RANK */
.rank-card{background:#1c2128;border-radius:12px;padding:12px;margin-bottom:7px;display:flex;align-items:center;gap:10px;border:1px solid #30363d}
.spin{display:inline-block;width:18px;height:18px;border:2px solid #30363d;border-top-color:#f0c040;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:4px}
</style>
</head>

function createRoom(nm){
  myId="p_"+Math.random().toString(36).slice(2,9);myName=nm;
  roomId=Math.random().toString(36).slice(2,7).toUpperCase();
  var st={phase:"waiting",players:[mkP(0)],currentTurn:0,landOwners:{},offeringPool:0,
    keyDeck:shuf(KC.map(function(c){return c.id;})),
    consecutiveDoubles:0,hostId:myId,timeLimitMin:selTime,startTime:0,
    needAction:false,lastDice:null,lastMove:null};
  rRef=db.ref("rooms/"+roomId);
  gRef=db.ref("rooms/"+roomId+"/state");
  lRef=db.ref("rooms/"+roomId+"/log");
  rRef.set({state:st,log:{0:"방 생성! 코드: "+roomId}})
    .then(enterGame)
    .catch(function(e){serr("오류: "+e.message);});
}
function joinRoom(nm,cd){
  db.ref("rooms/"+cd).once("value").then(function(snap){
    if(!snap.exists()){serr("방을 찾을 수 없습니다");return;}
    var d=snap.val();
    if(d.state.phase!=="waiting"){serr("이미 시작된 게임입니다");return;}
    var pl=d.state.players||[];
    if(pl.length>=6){serr("방이 꽉 찼습니다");return;}
    myId="p_"+Math.random().toString(36).slice(2,9);myName=nm;roomId=cd;
    var np=mkP(pl.length);pl.push(np);
    rRef=db.ref("rooms/"+roomId);
    gRef=db.ref("rooms/"+roomId+"/state");
    lRef=db.ref("rooms/"+roomId+"/log");
    gRef.update({players:pl})
      .then(function(){lRef.push(myName+"님 입장! 👋");enterGame();})
      .catch(function(e){serr("오류: "+e.message);});
  }).catch(function(e){serr("오류: "+e.message);});
}
function enterGame(){
  g("rbadge").textContent="코드: "+roomId;
  showScr("game");
  g("bag-btn").classList.remove("gone");
  gRef.on("value",function(snap){
    if(!snap.exists())return;
    var prev=gs;gs=snap.val();
    if(gs.lastDice&&gs.lastDice.playerId!==myId){
      if(!prev||!prev.lastDice||prev.lastDice.ts!==gs.lastDice.ts)showOppDice(gs.lastDice);
    }
    renderGame();updateTimer();updateBag();
  });
  lRef.on("value",function(snap){
    if(!snap.exists())return;
    var es=Object.values(snap.val()).reverse();
    g("tl").innerHTML=es.map(function(e){

    }).join("");
  });
}
function updateTimer(){
  var lim=gs&&gs.timeLimitMin||0;
  if(!lim||!gs.startTime||gs.phase!=="playing"){g("tmr").classList.add("gone");return;}
  g("tmr").classList.remove("gone");
  var left=Math.max(0,lim*60-Math.floor((Date.now()-gs.startTime)/1000));
  var mm=Math.floor(left/60),ss=left%60;
  g("tmr").textContent=(mm<10?"0":"")+mm+":"+(ss<10?"0":"")+ss;
  g("tmr").className=left<300?"timerbx warn":"timerbx";
  if(left===0)showFinalRanking("시간 종료");
}
function updateBag(){

// ── CANVAS 보드 렌더링 ──
function renderBoard(me){
  var own=gs.landOwners||{},bp={};
  gs.players.forEach(function(p){if(!p.bankrupt)(bp[p.pos]=bp[p.pos]||[]).push(p);});

  // 플레이어 칩
  var chips=g("board-chips");
  if(chips){
    chips.innerHTML=gs.players.map(function(p){
      var isCur=gs.players[gs.currentTurn]&&gs.players[gs.currentTurn].id===p.id;
      var isMe=p.id===myId;
      var img=p.charName&&CHARS[p.charName]&&CHARS[p.charName].complete
        ?"<img src='"+CHARS[p.charName].src+"' style='width:24px;height:24px;image-rendering:pixelated;object-fit:contain;border-radius:50%;border:1px solid "+p.color+"'>"
        :"<span>"+p.emoji+"</span>";
      return"<div class='pchip' style='background:"+p.color+"22;border-color:"+(isMe?p.color:isCur?"#f0c040":"#30363d")+"'>"
        +"<div style='display:flex;align-items:center;gap:3px'>"+img
        +"<span style='color:"+p.color+";font-weight:700'>"+p.name+(p.bankrupt?" 💀":"")+"</span></div>"
        +(p.charLabel?"<div style='color:#8b949e;font-size:8px'>"+p.charLabel+"</div>":"")
        +"<div style='color:#f0c040;font-size:8px'>💰"+p.money.toLocaleString()+"만</div>"
        +"<div style='color:#ffd700;font-size:8px'>⭐"+p.stars+"</div>"
        +(p.inWilderness?"<div style='color:#e74c3c;font-size:8px'>🏜️</div>":"")
        +"</div>";
    }).join("");
  }

  var canvas=g("board-canvas");
  if(!canvas)return;
  var wrap=g("board-wrap");
  var CW=wrap?wrap.clientWidth:360;
  if(CW<10)CW=360;

  var COLS=5;
  var TW=Math.floor(CW/5.4);
  var TH=Math.floor(TW*0.54);
  var TD=Math.floor(TH*0.4);
  var CG=TW+3;
  var RG=TH+TD+10;
  var ROWS=Math.ceil(TOTAL/COLS);

  canvas.width=CW;
  canvas.height=ROWS*RG+80;
  var ctx=canvas.getContext("2d");

  // 배경
  var bg=ctx.createLinearGradient(0,0,0,canvas.height);
  bg.addColorStop(0,"#0d1117");bg.addColorStop(1,"#161b22");
  ctx.fillStyle=bg;ctx.fillRect(0,0,CW,canvas.height);

  var TC={
    start:{top:"#1a3a2a",left:"#0a2010",right:"#0f2818",bd:"#f0c040"},
    land:{top:"#1e2a3a",left:"#0a1520",right:"#122030",bd:"#2a3a50"},
    mine:{top:"#0a2a12",left:"#051808",right:"#0a2010",bd:"#2ecc71"},
    others:{top:"#0a1a2e",left:"#061018",right:"#0a1828",bd:"#3498db"},
    key:{top:"#2a2010",left:"#100e04",right:"#1e1a08",bd:"#c89020"},
    wilderness:{top:"#2a1808",left:"#100a00",right:"#1e1008",bd:"#e67e22"},
    train:{top:"#082a28",left:"#041412",right:"#081e1c",bd:"#1abc9c"},
    offering:{top:"#280a18",left:"#100408",right:"#1c0810",bd:"#e91e8c"}
  };

  var myTileY=null;

  for(var i=0;i<TOTAL;i++){
    var row=Math.floor(i/COLS);
    var col=i%COLS;
    var rev=(row%2===1);
    var dc=rev?(COLS-1-col):col;
    var cx=CW/2+(dc-(COLS-1)/2)*CG;
    var cy=TH/2+50+row*RG;
    var sq=SQ[i];
    var here=bp[i]||[];
    var isHere=here.some(function(p){return p.id===myId;});
    if(isHere)myTileY=cy;

    var oid=own[i];
    var tc;
    if(sq.type==="land"){
      if(!oid)tc=TC.land;
      else if(oid===myId)tc=TC.mine;
      else tc=TC.others;
    } else tc=TC[sq.type]||TC.land;

    var hw=TW/2,hh=TH/2;

    // 글로우
    if(isHere){ctx.save();ctx.shadowColor="#f0c040";ctx.shadowBlur=16;}

    // 왼쪽 면
    ctx.beginPath();ctx.moveTo(cx-hw,cy);ctx.lineTo(cx,cy+hh);
    ctx.lineTo(cx,cy+hh+TD);ctx.lineTo(cx-hw,cy+TD);ctx.closePath();
    ctx.fillStyle=tc.left;ctx.fill();
    // 오른쪽 면
    ctx.beginPath();ctx.moveTo(cx,cy+hh);ctx.lineTo(cx+hw,cy);
    ctx.lineTo(cx+hw,cy+TD);ctx.lineTo(cx,cy+hh+TD);ctx.closePath();
    ctx.fillStyle=tc.right;ctx.fill();
    // 윗면
    ctx.beginPath();ctx.moveTo(cx,cy-hh);ctx.lineTo(cx+hw,cy);
    ctx.lineTo(cx,cy+hh);ctx.lineTo(cx-hw,cy);ctx.closePath();
    ctx.fillStyle=isHere?"#2a2810":tc.top;ctx.fill();
    ctx.strokeStyle=isHere?"#f0c040":tc.bd;ctx.lineWidth=isHere?2.5:1;ctx.stroke();

    if(isHere)ctx.restore();

    // 칸번호
    ctx.fillStyle="rgba(255,255,255,0.2)";
    ctx.font="bold "+Math.floor(TH*0.2)+"px sans-serif";
    ctx.textAlign="right";ctx.textBaseline="bottom";
    ctx.fillText(i,cx+hw-3,cy+hh+TD-1);

    // 이름
    var nm=sq.name.length>4?sq.name.slice(0,4)+"..":sq.name;
    ctx.fillStyle=isHere?"#f0c040":"#e6edf3";
    ctx.font="bold "+Math.floor(TH*0.28)+"px 'Noto Sans KR',sans-serif";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(nm,cx,cy+2);

    if(sq.type==="land"){
      ctx.fillStyle="#4fc3f7";
      ctx.font=Math.floor(TH*0.22)+"px sans-serif";
      ctx.fillText(sq.price+"만",cx,cy+TH*0.3);
      ctx.fillStyle="#ffd700";
      ctx.font=Math.floor(TH*0.19)+"px sans-serif";
      ctx.fillText("★".repeat(Math.min(sq.stars,4)),cx,cy+TH*0.52);
    }
    if(sq.icon){
      ctx.font=Math.floor(TH*0.4)+"px sans-serif";
      ctx.fillText(sq.icon,cx,cy-hh*0.15);
    }
    // 소유자 점
    if(oid){
      var op2=gs.players.find(function(p){return p.id===oid;});
      if(op2){
        ctx.beginPath();ctx.arc(cx+hw-7,cy-hh+7,5,0,Math.PI*2);
        ctx.fillStyle=op2.color;ctx.fill();
        ctx.strokeStyle="rgba(255,255,255,0.5)";ctx.lineWidth=1;ctx.stroke();
      }
    }
    // 플레이어 말
    if(here.length>0){
      var ps=Math.floor(TW*0.36);
      here.forEach(function(p,pi){
        var px=cx+(pi%2===0?-ps*0.35:ps*0.35);
        var py=cy-hh-ps*0.65+(Math.floor(pi/2)*ps*0.35);
        var ci=CHARS[p.charName];
        if(ci&&ci.complete&&ci.naturalWidth>0){
          ctx.save();
          ctx.beginPath();ctx.arc(px,py,ps/2,0,Math.PI*2);ctx.clip();
          ctx.drawImage(ci,px-ps/2,py-ps/2,ps,ps);
          ctx.restore();
          ctx.beginPath();ctx.arc(px,py,ps/2,0,Math.PI*2);
          ctx.strokeStyle=p.color;ctx.lineWidth=2;ctx.stroke();
          if(p.id===myId){
            ctx.beginPath();ctx.arc(px,py,ps/2+3,0,Math.PI*2);
            ctx.strokeStyle="rgba(240,192,64,0.7)";ctx.lineWidth=2;ctx.stroke();
          }
        } else {
          ctx.font=ps+"px sans-serif";
          ctx.textAlign="center";ctx.textBaseline="middle";
          ctx.fillText(p.emoji,px,py);
        }
      });
    }
  }
  ctx.textBaseline="alphabetic";

  // 내 위치 스크롤
  if(myTileY!==null&&wrap){
    wrap.scrollTop=Math.max(0,myTileY-wrap.clientHeight/2+TD);
  }

  // 클릭 이벤트
  canvas.onclick=function(e){
    var r=canvas.getBoundingClientRect();
    var mx=(e.clientX-r.left)*(canvas.width/r.width);
    var my=(e.clientY-r.top)*(canvas.height/r.height);
    var best=null,bd=9999;
    for(var i=0;i<TOTAL;i++){
      var row=Math.floor(i/COLS);
      var dc=row%2===1?(COLS-1-i%COLS):(i%COLS);
      var cx2=CW/2+(dc-(COLS-1)/2)*CG;
      var cy2=TH/2+50+row*RG;
      var d=Math.sqrt((mx-cx2)*(mx-cx2)+(my-cy2)*(my-cy2));
      if(d<bd){bd=d;best=i;}
    }
    if(best!==null&&bd<TW*0.8){
      var s=SQ[best];
      var info=s.name+": "+s.desc;
      if(s.type==="land"){
        var op3=own[best]?gs.players.find(function(p){return p.id===own[best];}):null;
        info+=" | 💰"+s.price+"만 🚶"+s.toll+"만";
        if(op3)info+=" | "+op3.emoji+op3.name+" 소유";
        else info+=" | 미구매";
      }
      showToast(info,3000);
    }
  };
}

function animateMove(from,to,emoji,cb){
  if(from===to){cb();return;}
  var steps=[];var cur=from;
  while(cur!==to){cur=(cur+1)%TOTAL;steps.push(cur);}
  if(!steps.length){cb();return;}

  var me2=gs&&gs.players?gs.players.find(function(p){return p.id===myId;}):null;
  var canvas=g("board-canvas");
  var wrap=g("board-wrap");
  var CW=canvas?canvas.width:360;
  var COLS=5,TW=Math.floor(CW/5.4),TH=Math.floor(TW*0.54),TD=Math.floor(TH*0.4);
  var CG=TW+3,RG=TH+TD+10;

  function txy(pos){
    var row=Math.floor(pos/COLS),col=pos%COLS;
    var dc=row%2===1?(COLS-1-col):col;
    return{x:CW/2+(dc-(COLS-1)/2)*CG, y:TH/2+50+row*RG};
  }

  var pEl=document.createElement("div");
  pEl.className="pawn-moving";
  pEl.style.background=me2?me2.color:"#f0c040";
  pEl.style.border="3px solid "+(me2?me2.color:"#f0c040");
  pEl.style.boxShadow="0 0 12px "+(me2?me2.color:"#f0c040");
  if(me2&&me2.charName&&CHARS[me2.charName]&&CHARS[me2.charName].complete){
    pEl.innerHTML="<img src='"+CHARS[me2.charName].src+"' style='width:100%;height:100%;image-rendering:pixelated;object-fit:contain'>";
  } else {
    pEl.style.display="flex";pEl.style.alignItems="center";pEl.style.justifyContent="center";
    pEl.style.fontSize="22px";pEl.textContent=emoji;
  }
  document.body.appendChild(pEl);

  var canvasRect=canvas?canvas.getBoundingClientRect():null;
  var scrollTop=wrap?wrap.scrollTop:0;
  function scr(pos){
    var p=txy(pos);
    if(!canvasRect)return{x:200,y:300};
    var scaleX=canvasRect.width/CW;
    return{x:canvasRect.left+p.x*scaleX, y:canvasRect.top+(p.y-scrollTop)*(canvasRect.height/canvas.height)};
  }

  var s0=scr(from);
  pEl.style.left=(s0.x-20)+"px";pEl.style.top=(s0.y-45)+"px";

  var si=0;
  function nxt(){
    if(si>=steps.length){
      setTimeout(function(){if(pEl.parentNode)pEl.parentNode.removeChild(pEl);cb();},180);return;
    }
    var pos=steps[si++];
    // 스크롤 업데이트
    if(wrap){
      var ty=txy(pos).y;
      wrap.scrollTo({top:Math.max(0,ty-wrap.clientHeight/2),behavior:"smooth"});
    }
    setTimeout(function(){
      var sc=scr(pos);
      pEl.style.left=(sc.x-20)+"px";pEl.style.top=(sc.y-45)+"px";
      setTimeout(nxt,270);
    },50);
  }
  setTimeout(nxt,80);
}

function procTurn(d1,d2){
  var st=JSON.parse(JSON.stringify(gs));
  var cur=st.players[st.currentTurn],isD=d1===d2;
  var logs=["🎲 "+cur.name+": "+d1+"+"+d2+"="+(d1+d2)+(isD?" 🎯더블!":"")];
  st.needAction=false;

  if(cur.inWilderness){
    if(isD){cur.inWilderness=false;cur.wildernessCount=0;logs.push("🌟 광야 탈출!");}
    else{pa={type:"wc"};gRef.set(st).then(function(){logs.forEach(addLog);renderActions(cur,cur);});return;}
  }

  var cs=isD?(st.consecutiveDoubles||0)+1:0;st.consecutiveDoubles=cs;
  if(cs>=3){
    cur.inWilderness=true;cur.wildernessCount=0;cur.pos=14;st.consecutiveDoubles=0;
    logs.push("⚠️ 더블 3연속! 광야!");
    advTurn(st);gRef.set(st).then(function(){logs.forEach(addLog);});return;
  }

  var steps=d1+d2,oldPos=cur.pos,np=(oldPos+steps)%TOTAL;
  if(oldPos+steps>=TOTAL){
    if(np===0){cur.money+=100;logs.push("🏠 시작/마침 +100만원");}
    else{cur.money+=50;logs.push("💰 시작 통과 +50만원");}
  }

  animateMove(oldPos,np,cur.emoji,function(){
    cur.pos=np;
    var sq=SQ[np];
    logs.push("📍 "+cur.name+": "+sq.name);
    var need=false;

    if(sq.type==="land"){
      var oid=st.landOwners&&st.landOwners[np];
      if(!oid){need=true;st.needAction=true;}
      else if(oid!==cur.id){
        var owP=st.players.find(function(p){return p.id===oid;});
        var hasTF=(cur.cards||[]).includes(19);
        if(hasTF){cur.cards=cur.cards.filter(function(c){return c!==19;});logs.push("🎫 통행권 사용!");}
        else if(owP){pa={type:"toll",toll:sq.toll,ownerId:oid};need=true;st.needAction=true;logs.push("⚠️ "+sq.name+" 통행료 "+sq.toll+"만원!");}
      } else logs.push("🏠 내 땅!");
    } else if(sq.type==="key"){
      var dk=st.keyDeck||[];if(!dk.length)dk=shuf(KC.map(function(c){return c.id;}));
      var cid=dk.shift();st.keyDeck=dk;
      var card=KC.find(function(c){return c.id===cid;});
      logs.push("🔑 천국열쇠!");
      var res=applyCard(st,cur,card);
      if(res){pa=res;need=true;st.needAction=true;}
      else if(!isD)advTurn(st);
      showKC(card);
      gRef.set(st).then(function(){logs.forEach(addLog);});return;
    } else if(sq.type==="wilderness"){
      if(!cur.inWilderness){cur.inWilderness=true;cur.wildernessCount=0;logs.push("🏜️ 광야에 갇혔습니다!");}
    } else if(sq.type==="train"){
      pa={type:"train"};need=true;st.needAction=true;logs.push("🚂 구원열차!");
    } else if(sq.type==="offering"){
      var pool=st.offeringPool||0;
      if(pool>0){cur.money+=pool;st.offeringPool=0;logs.push("💝 헌금 풀 "+pool+"만원 획득!");}
      if(cur.money>=100){cur.money-=100;st.offeringPool=(st.offeringPool||0)+100;logs.push("💌 헌금 100만원");}
      else if(cur.money>=50){cur.money-=50;st.offeringPool=(st.offeringPool||0)+50;logs.push("💌 헌금 50만원");}
    } else if(sq.type==="start"){cur.money+=100;logs.push("🏠 시작 +100만원");}

    if(!need&&!isD)advTurn(st);
    else if(!need&&isD)logs.push("🎯 더블! 한 번 더!");
    gRef.set(st).then(function(){logs.forEach(addLog);});
  });
}

function showKC(card){
  var html="<div style='text-align:center;color:#8b949e;font-size:12px;margin-bottom:10px'>카드를 눌러서 확인!</div>"
    +"<div class='card-flip-wrap' onclick='flipCard(this)'>"
    +"<div class='card-flip'>"
    +"<div class='card-face card-front'><div style='font-size:44px'>🔑</div><div style='color:#c89020;font-size:12px;font-weight:700;margin-top:6px'>TAP TO REVEAL</div></div>"
    +"<div class='card-face card-back'><div style='font-size:36px;margin-bottom:6px'>"+card.icon+"</div>"
    +"<div style='font-size:13px;line-height:1.6;color:#e6edf3;white-space:pre-line;text-align:center'>"+card.text+"</div>"
    +(card.keep?"<div style='margin-top:8px;color:#4fc3f7;font-size:10px;font-weight:700'>📦 가방에 보관됩니다</div>":"")
    +"</div></div></div>";
  showModal("🔑 천국열쇠 카드",html,"<button class='btn gold bsm' id='kc-ok' style='display:none' onclick='closeModal()'>확인</button>");
}
function flipCard(wrap){
  var cf=wrap.querySelector(".card-flip");
  if(!cf||cf.classList.contains("flipped"))return;
  cf.classList.add("flipped");
  setTimeout(function(){var b=g("kc-ok");if(b)b.style.display="block";},660);
}

function applyCard(st,cur,card){
  switch(card.type){
    case"money":cur.money+=card.amount;showToast(cur.emoji+" +"+card.amount+"만원! 💰");break;
    case"move_start":cur.pos=0;cur.money+=100;break;
    case"move_wilderness":cur.pos=14;cur.inWilderness=true;cur.wildernessCount=0;break;
    case"move_train":cur.pos=33;return{type:"train"};
    case"move_offering":cur.pos=47;break;
    case"pay_offering":var a=Math.min(cur.money,card.amount);cur.money-=a;st.offeringPool=(st.offeringPool||0)+a;break;
    case"steal":return{type:"steal"};
    case"give_land":return{type:"give"};
    case"take_row2":return{type:"r2"};
    case"extra_dice":case"escape_wilderness":case"toll_free":
      if(card.keep){cur.cards=cur.cards||[];cur.cards.push(card.id);showToast("🎒 카드를 가방에 넣었습니다!");}break;
  }
  return null;
}

function advTurn(st){
  var next=(st.currentTurn+1)%st.players.length;
  var cnt=0;
  while(st.players[next].bankrupt&&cnt<st.players.length){next=(next+1)%st.players.length;cnt++;}
  st.currentTurn=next;st.needAction=false;
}
function endTurn(){pa=null;var st=JSON.parse(JSON.stringify(gs));advTurn(st);gRef.set(st).then(function(){addLog("⏭️ 턴 종료");});}

function payToll(){
  var st=JSON.parse(JSON.stringify(gs));
  var cur=st.players[st.currentTurn];
  var owP=st.players.find(function(p){return p.id===pa.ownerId;});
  var paid=Math.min(cur.money,pa.toll);
  cur.money-=paid;if(owP)owP.money+=paid;
  addLog("💸 "+cur.name+"→"+(owP?owP.name:"")+" 통행료 "+paid+"만원");
  if(owP&&owP.id===myId)showToast("💰 "+cur.name+"에게서 통행료 "+paid+"만원 받았습니다!",3000);
  pa=null;st.needAction=false;advTurn(st);
  gRef.set(st).then(function(){chkBankrupt(cur.id,st);});
}

function chkBankrupt(pid,st){
  if(!st)st=JSON.parse(JSON.stringify(gs));
  var p=st.players.find(function(x){return x.id===pid;});
  if(!p||p.bankrupt)return;
  if(p.money<=0&&(p.lands||[]).length===0){
    p.bankrupt=true;
    (p.lands||[]).forEach(function(pos){if(st.landOwners)delete st.landOwners[pos];});
    p.lands=[];p.stars=0;
    gRef.set(st).then(function(){
      addLog("💀 "+p.name+": 파산!");
      if(p.id===myId)showModal("💀 파산","<div style='text-align:center'><div style='font-size:60px'>💀</div><div style='font-size:18px;font-weight:900;color:#e74c3c;margin:8px 0'>파산하셨습니다!</div></div>","<button class='btn bgray bsm' onclick='closeModal()'>확인</button>");
      var alive=st.players.filter(function(x){return!x.bankrupt;});
      if(alive.length===1)showFinalRanking("플레이어 탈락");
    });
  }
}

function sellLand(pos){
  var st=JSON.parse(JSON.stringify(gs));
  var cur=st.players[st.currentTurn];
  var sq=SQ[pos];if(!cur.lands.includes(pos))return;
  cur.money+=sq.sell;
  cur.lands=cur.lands.filter(function(p){return p!==pos;});
  cur.stars=Math.max(0,(cur.stars||0)-sq.stars);
  if(st.landOwners)delete st.landOwners[pos];
  gRef.set(st).then(function(){addLog("🏦 "+sq.name+" 매각 +"+sq.sell+"만원");showToast("🏦 "+sq.name+" 매각! +"+sq.sell+"만원");});
}
function buyLand(){
  var st=JSON.parse(JSON.stringify(gs));var cur=st.players[st.currentTurn];var sq=SQ[cur.pos];
  if(sq.type!=="land"||(st.landOwners&&st.landOwners[cur.pos])||cur.money<sq.price)return;
  cur.money-=sq.price;st.landOwners=st.landOwners||{};st.landOwners[cur.pos]=cur.id;
  cur.lands=cur.lands||[];cur.lands.push(cur.pos);cur.stars=(cur.stars||0)+sq.stars;
  advTurn(st);pa=null;gRef.set(st).then(function(){addLog("🏡 "+cur.name+": "+sq.name+" 구매! ("+sq.price+"만 ⭐"+sq.stars+")");});
}
function skipBuy(){
  var st=JSON.parse(JSON.stringify(gs));var cur=st.players[st.currentTurn];
  advTurn(st);pa=null;gRef.set(st).then(function(){addLog("⏭️ "+cur.name+": 패스");});
}
function wTry(m){
  if(m==="d"){
    var d1=Math.floor(Math.random()*6)+1,d2=Math.floor(Math.random()*6)+1;
    var da=g("darea");da.classList.remove("gone");
    da.innerHTML="<div class='dice-wrap'><div class='die rolling'>🎲</div><div class='die rolling'>🎲</div></div>";
    setTimeout(function(){
      var dbl=d1===d2;
      da.innerHTML="<div class='dice-wrap'><div class='die"+(dbl?" dbl":"")+"'>"+DF[d1]+"</div><div class='die"+(dbl?" dbl":"")+"'>"+DF[d2]+"</div></div>"+(dbl?"<div style='text-align:center'><span class='dbl-badge'>탈출!</span></div>":"");
      addLog("🎲 더블 도전 "+d1+"+"+d2+(dbl?" → 탈출!":" → 실패"));procW(dbl);
    },700);
  } else {pa={type:"oec"};var me=gs.players.find(function(p){return p.id===myId;});renderActions(me,null);}
}
function oePick(c){
  var d=Math.floor(Math.random()*6)+1,io=d%2===1,w=(c==="odd"&&io)||(c==="even"&&!io);
  var da=g("darea");da.classList.remove("gone");
  da.innerHTML="<div class='dice-wrap'><div class='die"+(w?" dbl":"")+"'>"+DF[d]+"</div></div>";
  addLog("🎲 "+d+(io?" (홀)":" (짝)")+" → "+(c==="odd"?"홀":"짝")+" → "+(w?"탈출!":"실패"));procW(w);
}
function procW(esc){
  var st=JSON.parse(JSON.stringify(gs));var cur=st.players[st.currentTurn];
  if(esc){cur.inWilderness=false;cur.wildernessCount=0;pa=null;st.needAction=false;gRef.set(st).then(function(){rollDice();});}
  else{cur.wildernessCount=(cur.wildernessCount||0)+1;advTurn(st);pa=null;gRef.set(st).then(function(){addLog("😔 광야 탈출 실패");});}
}
function doTrain(){
  var dest=parseInt(g("td").value);
  var st=JSON.parse(JSON.stringify(gs));var cur=st.players[st.currentTurn];
  cur.pos=dest;pa=null;
  var sq=SQ[dest];
  var own=st.landOwners||{};
  if(sq.type==="land"&&!own[dest]){st.needAction=true;}
  else if(sq.type==="key"){
    var dk=st.keyDeck||[];if(!dk.length)dk=shuf(KC.map(function(c){return c.id;}));
    var cid=dk.shift();st.keyDeck=dk;
    var card=KC.find(function(c){return c.id===cid;});
    var res=applyCard(st,cur,card);
    if(res){pa=res;st.needAction=true;}else{advTurn(st);}
    gRef.set(st).then(function(){addLog("🚂→"+sq.name+"! 🔑 천국열쇠!");showKC(card);});return;
  } else {advTurn(st);}
  gRef.set(st).then(function(){addLog("🚂 "+cur.name+": "+sq.name+"으로 이동!");});
}
function doSteal(fid,pos){
  var st=JSON.parse(JSON.stringify(gs));var cur=st.players[st.currentTurn];
  var fr=st.players.find(function(p){return p.id===fid;});if(!fr)return;
  fr.lands=(fr.lands||[]).filter(function(p){return p!==pos;});
  fr.stars=Math.max(0,(fr.stars||0)-SQ[pos].stars);
  cur.lands=cur.lands||[];cur.lands.push(pos);cur.stars=(cur.stars||0)+SQ[pos].stars;
  st.landOwners=st.landOwners||{};st.landOwners[pos]=cur.id;
  advTurn(st);pa=null;gRef.set(st).then(function(){addLog("👊 "+cur.name+": "+fr.name+"의 "+SQ[pos].name+" 획득!");});
}
function doR2(pos){
  var st=JSON.parse(JSON.stringify(gs));var cur=st.players[st.currentTurn];var sq=SQ[pos];
  cur.lands=cur.lands||[];cur.lands.push(pos);cur.stars=(cur.stars||0)+sq.stars;
  st.landOwners=st.landOwners||{};st.landOwners[pos]=cur.id;
  advTurn(st);pa=null;gRef.set(st).then(function(){addLog("🗺️ 2열 "+sq.name+" 획득!");});
}
function doGive(pos,toId){
  var st=JSON.parse(JSON.stringify(gs));var cur=st.players[st.currentTurn];
  var to=st.players.find(function(p){return p.id===toId;});if(!to)return;
  cur.lands=(cur.lands||[]).filter(function(p){return p!==pos;});cur.stars=Math.max(0,(cur.stars||0)-SQ[pos].stars);
  to.lands=to.lands||[];to.lands.push(pos);to.stars=(to.stars||0)+SQ[pos].stars;
  st.landOwners=st.landOwners||{};st.landOwners[pos]=to.id;
  advTurn(st);pa=null;gRef.set(st).then(function(){addLog("🎁 "+cur.name+": "+SQ[pos].name+"→"+to.name);});
}

function startGame(){
  if(!gs||gs.players.length<2){alert("최소 2명이 필요합니다!");return;}
  var st=JSON.parse(JSON.stringify(gs));
  st.phase="playing";st.currentTurn=0;
  st.startTime=gs.timeLimitMin>0?Date.now():0;st.needAction=false;
  gRef.set(st).then(function(){addLog("🎮 게임 시작!");});
}

function openBag(){
  var me=gs&&gs.players&&gs.players.find(function(p){return p.id===myId;});
  var cards=(me&&me.cards)||[];
  if(!cards.length){showModal("🎒 가방","<div style='color:#8b949e;text-align:center'>보관된 카드가 없습니다</div>","<button class='btn bgray bsm' onclick='closeModal()'>닫기</button>");return;}
  var isMT=gs&&gs.players[gs.currentTurn]&&gs.players[gs.currentTurn].id===myId;
  var html=cards.map(function(cid){
    var c=KC.find(function(x){return x.id===cid;});if(!c)return"";
    var ub=isMT?"<button class='btn bsm bgreen' style='flex:none;width:auto;padding:5px 10px;font-size:11px' onclick='useBag("+cid+")'>사용</button>":"<span style='color:#8b949e;font-size:10px'>내 차례에 사용</span>";
    return"<div style='background:#161b22;border-radius:10px;padding:10px 12px;margin-bottom:7px;display:flex;align-items:center;gap:10px;border:1px solid #30363d'>"
      +"<span style='font-size:24px'>"+c.icon+"</span><div style='flex:1'><div style='font-weight:700;font-size:12px'>"+c.text.split("\n")[0]+"</div></div>"
      +"<div>"+ub+"</div></div>";
  }).join("");
  showModal("🎒 가방",html,"<button class='btn bgray bsm' onclick='closeModal()'>닫기</button>");
}
function useBag(cid){
  var isMT=gs&&gs.players[gs.currentTurn]&&gs.players[gs.currentTurn].id===myId;
  if(!isMT){showToast("내 차례에만 사용할 수 있습니다!");return;}
  var c=KC.find(function(x){return x.id===cid;});if(!c)return;
  var st=JSON.parse(JSON.stringify(gs));
  var cur=st.players[st.currentTurn];
  cur.cards=cur.cards.filter(function(id){return id!==cid;});
  closeModal();
  if(c.type==="extra_dice"){gRef.set(st).then(function(){addLog("🎲 추가 주사위!");rollDice();});}
  else if(c.type==="escape_wilderness"){
    if(!cur.inWilderness){showToast("광야에 있지 않습니다!");return;}
    cur.inWilderness=false;cur.wildernessCount=0;
    gRef.set(st).then(function(){addLog("🌟 광야 탈출 카드 사용!");});
  } else if(c.type==="toll_free"){showToast("🎫 통행권 준비! 다음 통행 시 자동 사용");gRef.set(st);}
  else{var res=applyCard(st,cur,c);gRef.set(st).then(function(){addLog("🎒 "+c.text.split("\n")[0]+" 사용!");if(res){pa=res;renderActions(cur,cur);}});}
}

function showFinalRanking(reason){
  if(!gs)return;
  var sorted=gs.players.slice().sort(function(a,b){if(a.bankrupt&&!b.bankrupt)return 1;if(!a.bankrupt&&b.bankrupt)return -1;return b.stars-a.stars;});
  var em=["🥇","🥈","🥉","4️⃣","5️⃣","6️⃣"];
  var html="<div style='text-align:center;color:#8b949e;font-size:12px;margin-bottom:12px'>"+reason+"으로 게임 종료!</div>"
    +sorted.map(function(p,i){
      var isW=i===0&&!p.bankrupt;
      return"<div class='rank-card' style='"+(isW?"border-color:#f0c040;background:linear-gradient(135deg,#2a2010,#1a1508)":"")+"'>"
        +"<div style='font-size:22px;font-weight:900;color:"+(i===0?"#f0c040":i===1?"#c0c0c0":i===2?"#cd7f32":"#8b949e")+"'>"+em[i]+"</div>"
        +"<span style='font-size:26px'>"+p.emoji+"</span>"
        +"<div style='flex:1'><div style='color:"+p.color+";font-weight:900;font-size:15px'>"+p.name+(p.bankrupt?" 💀":"")+"</div>"
        +"<div style='font-size:11px;color:#8b949e'>⭐"+p.stars+"개 | 💰"+p.money.toLocaleString()+"만원</div></div>"
        +(isW?"<div style='font-size:20px'>🏆</div>":"")+"</div>";
    }).join("");
  var winner=sorted.find(function(p){return!p.bankrupt;});
  showModal(winner&&winner.id===myId?"🎉 축하합니다! 승리!":"🏆 게임 종료 - 최종 순위",html,"");
  if(winner&&winner.id===myId)showToast("🎉 승리하셨습니다! 🏆",5000);
}
