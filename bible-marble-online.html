<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#f0c040;--blue:#4fc3f7;--green:#2ecc71;--red:#e74c3c;--bg:#0d1117;--sur:#161b22;--sur2:#1c2128;--bor:#30363d;--text:#e6edf3;--muted:#8b949e;--font:'Noto Sans KR',sans-serif}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden}
#app{height:100vh;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
.screen{flex:1;display:flex;flex-direction:column;overflow:hidden}
.gone{display:none!important}
#lobby{background:radial-gradient(ellipse at 50% 30%,#1a2a4a,#0d1117);justify-content:center;align-items:center;padding:32px 24px}
.logo{font-size:72px;margin-bottom:8px;animation:fl 3s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.title{font-size:38px;font-weight:900;color:var(--gold);letter-spacing:-1px;text-shadow:0 0 30px #f0c04060}
.sub{color:var(--muted);font-size:13px;margin-top:4px;margin-bottom:40px}
.lbtns{width:100%;display:flex;flex-direction:column;gap:14px}
#setup{padding:24px;justify-content:center;gap:14px}
.backbtn{position:absolute;top:16px;left:16px;background:none;border:none;color:var(--muted);font-size:28px;cursor:pointer;z-index:10}
.btn{border:none;border-radius:14px;padding:15px 20px;font-size:17px;font-weight:700;cursor:pointer;font-family:var(--font);width:100%;transition:transform .1s,opacity .1s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97);opacity:.85}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.gold{background:var(--gold);color:#1a1a2e;box-shadow:0 4px 20px #f0c04040}
.bblue{background:var(--blue);color:#0d1117}
.bgreen{background:var(--green);color:#fff}
.bgray{background:#2d333b;color:var(--text)}
.bsm{padding:11px 16px;font-size:15px;border-radius:11px}
.brow{display:flex;gap:10px}
.brow .btn{flex:1}
.inp{background:var(--sur2);border:1px solid var(--bor);border-radius:12px;padding:14px 16px;color:var(--text);font-size:16px;font-family:var(--font);outline:none;width:100%}
.inp:focus{border-color:var(--gold)}
.inp::placeholder{color:var(--muted)}
#game{overflow:hidden}
.ghdr{background:var(--sur);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bor);flex-shrink:0}
.gtitle{font-weight:900;color:var(--gold);font-size:17px}
.rbadge{background:#0f3460;color:var(--blue);font-size:12px;padding:4px 12px;border-radius:20px;font-weight:700}
.tbar{padding:9px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bor);flex-shrink:0}
.tbar.myturn{background:linear-gradient(90deg,#1a3a1a,#162e16)}
.tbar.other{background:var(--sur2)}
.mybadge{background:var(--green);color:#fff;font-size:11px;font-weight:900;padding:4px 12px;border-radius:20px}
.tabs{display:flex;border-bottom:1px solid var(--bor);flex-shrink:0}
.tab{flex:1;padding:10px 0;background:none;border:none;color:var(--muted);font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:var(--gold);border-bottom-color:var(--gold);background:var(--sur)}
.tc{flex:1;overflow-y:auto;padding:14px}
.abar{padding:14px;border-top:1px solid var(--bor);flex-shrink:0;background:var(--bg)}
.pplay{display:flex;flex-direction:column;flex:1;overflow:hidden}
.card{background:var(--sur);border-radius:12px;padding:12px 14px;margin-bottom:8px;border:1px solid var(--bor)}
.card.hl{border-color:var(--gold)}
.sq{display:flex;align-items:center;gap:8px;background:var(--sur);border-radius:9px;padding:7px 10px;margin-bottom:5px;border:1px solid transparent}
.sq.mine{border-color:var(--gold);background:#1e2a10}
.sq.here{border-color:#fff;background:#1a2030}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.sc{background:var(--sur);border-radius:11px;padding:10px 12px}
.sc label{font-size:11px;color:var(--muted);display:block}
.sc b{font-size:17px;font-weight:900}
.loge{background:var(--sur);border-radius:8px;padding:8px 11px;margin-bottom:5px;font-size:13px;color:#c9d1d9;line-height:1.5}
.dbox{display:inline-block;font-size:30px;background:var(--sur);padding:8px 24px;border-radius:20px;margin-bottom:10px}
.dbox.dbl{color:var(--gold);border:1px solid var(--gold)}
.wp{background:var(--sur);border-radius:11px;padding:11px 14px;margin-bottom:9px;display:flex;align-items:center;gap:10px;border:1px solid var(--bor)}
.rrow{display:flex;align-items:center;gap:10px;background:var(--sur);border-radius:10px;padding:9px 12px;margin-bottom:6px}
.mov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:flex-end;justify-content:center;z-index:100;max-width:480px;margin:0 auto}
.mo{background:var(--sur);border-radius:22px 22px 0 0;padding:24px 20px 32px;width:100%;border-top:1px solid var(--bor)}
.spin{display:inline-block;width:20px;height:20px;border:3px solid var(--bor);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--bor);border-radius:4px}
</style>
</head>

  g("bback").onclick=function(){showScr("lobby");};

function showScr(id){["lobby","setup","game"].forEach(function(s){g(s).classList.add("gone");});g(id).classList.remove("gone");}
function showSetup(m){
  mode=m;
  g("sico").textContent=m==="create"?"🏠":"🚪";
  g("stitle").textContent=m==="create"?"방 만들기":"방 참가하기";
  g("sbtn").textContent=m==="create"?"방 생성":"참가하기";
  g("ri").classList.toggle("gone",m!=="join");
  g("serr").style.display="none";g("ni").value="";g("rc").value="";
  showScr("setup");

function serr(msg){g("serr").textContent=msg;g("serr").style.display="block";g("sld").classList.add("gone");g("sbtn").disabled=false;}

function mkP(idx){return{id:myId,name:myName,money:cm(),pos:0,lands:[],stars:0,inWilderness:false,wildernessCount:0,cards:[],color:CL[idx],emoji:EM[idx]};}

function handleSetup(){
  var nm=g("ni").value.trim();
  if(!nm){serr("닉네임을 입력해주세요");return;}
  g("sld").classList.remove("gone");g("sbtn").disabled=true;g("serr").style.display="none";
  if(mode==="create"){createRoom(nm);}
  else{var cd=g("rc").value.trim().toUpperCase();if(!cd||cd.length!==5){serr("방 코드 5자리를 입력해주세요");return;}joinRoom(nm,cd);}
}

function createRoom(nm){
  myId="p_"+Math.random().toString(36).slice(2,9);myName=nm;
  roomId=Math.random().toString(36).slice(2,7).toUpperCase();
  var st={phase:"waiting",players:[mkP(0)],currentTurn:0,landOwners:{},offeringPool:0,keyDeck:shuf(KC.map(function(c){return c.id;})),consecutiveDoubles:0,hostId:myId};
  rRef=db.ref("rooms/"+roomId);gRef=db.ref("rooms/"+roomId+"/state");lRef=db.ref("rooms/"+roomId+"/log");
  rRef.set({state:st,log:{0:"방 생성! 코드: "+roomId}}).then(function(){enterGame();}).catch(function(e){serr("오류: "+e.message);});
}

function joinRoom(nm,cd){
  db.ref("rooms/"+cd).once("value").then(function(snap){
    if(!snap.exists()){serr("방을 찾을 수 없습니다");return;}
    var d=snap.val();
    if(d.state.phase!=="waiting"){serr("이미 시작된 게임입니다");return;}
    var pl=d.state.players||[];
    if(pl.length>=6){serr("방이 꽉 찼습니다");return;}
    myId="p_"+Math.random().toString(36).slice(2,9);myName=nm;roomId=cd;
    var np=mkP(pl.length);pl.push(np);
    rRef=db.ref("rooms/"+roomId);gRef=db.ref("rooms/"+roomId+"/state");lRef=db.ref("rooms/"+roomId+"/log");
    gRef.update({players:pl}).then(function(){lRef.push(myName+"님 입장! 👋");enterGame();}).catch(function(e){serr("오류: "+e.message);});
  }).catch(function(e){serr("오류: "+e.message);});
}

function enterGame(){g("rbadge").textContent="코드: "+roomId;showScr("game");subGame();}

function subGame(){
  gRef.on("value",function(snap){if(!snap.exists())return;gs=snap.val();renderGame();});
  lRef.on("value",function(snap){
    if(!snap.exists())return;
    var es=Object.values(snap.val()).reverse();
    g("tl").innerHTML=es.map(function(e){return"<div class='loge'>"+e+"</div>";}).join("");
  });
}

function renderGame(){
  if(!gs)return;

function startGame(){
  if(!gs||gs.players.length<2){alert("최소 2명 필요!");return;}
  var st=JSON.parse(JSON.stringify(gs));st.phase="playing";st.currentTurn=0;
  gRef.set(st).then(function(){addLog("🎮 게임 시작!");});
}

function rollDice(){var d1=Math.floor(Math.random()*6)+1,d2=Math.floor(Math.random()*6)+1;showD(d1,d2);procTurn(d1,d2);}
function useEx(){var st=JSON.parse(JSON.stringify(gs));var me=st.players.find(function(p){return p.id===myId;});me.cards=me.cards.filter(function(c){return c!==5;});gRef.set(st).then(function(){addLog("🎲 추가 주사위!");rollDice();});}
function showD(d1,d2){var dd=g("dd");dd.classList.remove("gone");var id=d1===d2;dd.innerHTML="<div class='dbox"+(id?" dbl":"")+"'>"+de(d1)+" "+de(d2)+(id?" 🎯 더블!":"")+"</div>";}

function procTurn(d1,d2){
  var st=JSON.parse(JSON.stringify(gs)),cur=st.players[st.currentTurn],isD=d1===d2,logs=["🎲 "+cur.name+": "+d1+"+"+d2+"="+(d1+d2)+(isD?" (더블!)":"")];
  if(cur.inWilderness){
    if(isD){cur.inWilderness=false;cur.wildernessCount=0;logs.push("🌟 "+cur.name+": 광야 탈출!");}
    else{pa={type:"wilderness_choice"};gRef.set(st).then(function(){logs.forEach(function(l){addLog(l);});renderActions(true,cur,cur);});return;}
  }
  var cs=st.consecutiveDoubles||0;cs=isD?cs+1:0;st.consecutiveDoubles=cs;
  if(cs>=3){cur.inWilderness=true;cur.wildernessCount=0;cur.pos=14;st.consecutiveDoubles=0;logs.push("⚠️ "+cur.name+": 더블 3연속! 광야!");advTurn(st);gRef.set(st).then(function(){logs.forEach(function(l){addLog(l);});});return;}
  var steps=d1+d2,op=cur.pos,np=(op+steps)%TOTAL;
  if(op+steps>=TOTAL){if(np===0){cur.money+=100;logs.push("🏠 시작/마침 +100만");}else{cur.money+=50;logs.push("💰 시작 통과 +50만");}}
  cur.pos=np;var sq=SQ[np];logs.push("📍 "+cur.name+": "+sq.name);
  var need=false;
  if(sq.type==="land"){
    var oid=st.landOwners&&st.landOwners[np];
    if(!oid){need=true;}
    else if(oid!==cur.id){var owP=st.players.find(function(p){return p.id===oid;});var hasTF=(cur.cards||[]).includes(19);if(hasTF){cur.cards=cur.cards.filter(function(c){return c!==19;});logs.push("🎫 통행권 사용!");}else if(owP){var pd=Math.min(cur.money,sq.toll);cur.money-=pd;owP.money+=pd;logs.push("💸 "+cur.name+"→"+owP.name+": "+sq.toll+"만");}}
    else{logs.push("🏠 내 땅!");}
  } else if(sq.type==="key"){
    var dk=st.keyDeck||[];if(!dk.length)dk=shuf(KC.map(function(c){return c.id;}));var cid=dk.shift();st.keyDeck=dk;
    var card=KC.find(function(c){return c.id===cid;});logs.push("🔑 "+cur.name+": "+card.text);
    var res=applyC(st,cur,card);if(res){pa=res;need=true;}
  } else if(sq.type==="wilderness"){if(!cur.inWilderness){cur.inWilderness=true;cur.wildernessCount=0;logs.push("🏜️ 광야에 갇혔습니다!");}}
  else if(sq.type==="train"){pa={type:"train_move"};need=true;logs.push("🚂 구원열차!");}
  else if(sq.type==="offering"){var pl=st.offeringPool||0;if(cur.money>=100){cur.money-=100;st.offeringPool=pl+100;logs.push("💌 헌금 100만");}else if(cur.money>=50){cur.money-=50;st.offeringPool=pl+50;logs.push("💌 헌금 50만");}if(pl>0){cur.money+=pl;st.offeringPool=0;logs.push("💝 헌금 풀 "+pl+"만 획득!");}}
  else if(sq.type==="start"){cur.money+=100;logs.push("🏠 +100만");}
  if(!need&&!isD)advTurn(st);else if(!need&&isD)logs.push("🎯 더블! 한 번 더!");
  gRef.set(st).then(function(){logs.forEach(function(l){addLog(l);});});
}

function applyC(st,cur,card){
  switch(card.type){
    case"money":cur.money+=card.amount;break;
    case"move_start":cur.pos=0;cur.money+=100;break;
    case"move_wilderness":cur.pos=14;cur.inWilderness=true;cur.wildernessCount=0;break;
    case"move_train":cur.pos=33;return{type:"train_move"};
    case"move_offering":cur.pos=47;break;
    case"pay_offering":cur.money-=Math.min(cur.money,card.amount);st.offeringPool=(st.offeringPool||0)+card.amount;break;
    case"steal":return{type:"steal_land"};
    case"take_row2":return{type:"take_row2"};
    case"extra_dice":case"escape_wilderness":case"toll_free":if(card.keep){cur.cards=cur.cards||[];cur.cards.push(card.id);}break;
    default:break;
  }
  return null;
}

function advTurn(st){st.currentTurn=(st.currentTurn+1)%st.players.length;}
function endTurn(){pa=null;var st=JSON.parse(JSON.stringify(gs));advTurn(st);gRef.set(st).then(function(){addLog("⏭️ 턴 종료");});}
function buyL(){var st=JSON.parse(JSON.stringify(gs));var cur=st.players[st.currentTurn];var sq=SQ[cur.pos];if(sq.type!=="land"||(st.landOwners&&st.landOwners[cur.pos])||cur.money<sq.price)return;cur.money-=sq.price;st.landOwners=st.landOwners||{};st.landOwners[cur.pos]=cur.id;cur.lands=cur.lands||[];cur.lands.push(cur.pos);cur.stars=(cur.stars||0)+sq.stars;advTurn(st);pa=null;gRef.set(st).then(function(){addLog("🏡 "+cur.name+": "+sq.name+" 구매! ("+sq.price+"만, ⭐"+sq.stars+")");});}
function skipB(){var st=JSON.parse(JSON.stringify(gs));var cur=st.players[st.currentTurn];advTurn(st);pa=null;gRef.set(st).then(function(){addLog("⏭️ "+cur.name+": 패스");});}
function wTry(m){if(m==="double"){var d1=Math.floor(Math.random()*6)+1,d2=Math.floor(Math.random()*6)+1;showD(d1,d2);addLog("🎲 더블 도전 "+d1+"+"+d2+(d1===d2?" → 탈출!":" → 실패"));procW(d1===d2);}else{pa={type:"oddeven_choice"};renderActions(true,gs.players.find(function(p){return p.id===myId;}),null);}}
function oePick(c){var d=Math.floor(Math.random()*6)+1;var io=d%2===1;var w=(c==="odd"&&io)||(c==="even"&&!io);showD(d,d);addLog("🎲 "+d+(io?" 홀":" 짝")+" - "+(c==="odd"?"홀":"짝")+" 선택 → "+(w?"탈출!":"실패"));procW(w);}
function procW(esc){var st=JSON.parse(JSON.stringify(gs));var cur=st.players[st.currentTurn];if(esc){cur.inWilderness=false;cur.wildernessCount=0;pa=null;gRef.set(st).then(function(){rollDice();});}else{cur.wildernessCount=(cur.wildernessCount||0)+1;advTurn(st);pa=null;gRef.set(st).then(function(){addLog("😔 광야 탈출 실패");});}}
function confirmTrain(){var dest=parseInt(g("td").value);var st=JSON.parse(JSON.stringify(gs));var cur=st.players[st.currentTurn];cur.pos=dest;advTurn(st);pa=null;gRef.set(st).then(function(){addLog("🚂 "+cur.name+": "+SQ[dest].name+"으로 이동!");});}
function stealL(fid,pos){var st=JSON.parse(JSON.stringify(gs));var cur=st.players[st.currentTurn];var fr=st.players.find(function(p){return p.id===fid;});if(!fr)return;fr.lands=(fr.lands||[]).filter(function(p){return p!==pos;});fr.stars=Math.max(0,(fr.stars||0)-(SQ[pos].stars||0));cur.lands=cur.lands||[];cur.lands.push(pos);cur.stars=(cur.stars||0)+(SQ[pos].stars||0);st.landOwners=st.landOwners||{};st.landOwners[pos]=cur.id;advTurn(st);pa=null;gRef.set(st).then(function(){addLog("👊 "+cur.name+": "+fr.name+"의 "+SQ[pos].name+" 획득!");});}
function takeR2(pos){var st=JSON.parse(JSON.stringify(gs));var cur=st.players[st.currentTurn];var sq=SQ[pos];cur.lands=cur.lands||[];cur.lands.push(pos);cur.stars=(cur.stars||0)+sq.stars;st.landOwners=st.landOwners||{};st.landOwners[pos]=cur.id;advTurn(st);pa=null;gRef.set(st).then(function(){addLog("🗺️ "+cur.name+": 2열 "+sq.name+" 획득!");});}
function addLog(msg){if(lRef)lRef.push(msg);}
</script>
