*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Noto Sans KR',sans-serif;overflow:hidden;background:#0d1117}
#app{height:100dvh;display:flex;flex-direction:column;max-width:500px;margin:0 auto;background:#0d1117;color:#e6edf3;position:relative}
.gone{display:none!important}
#lobby{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:32px 24px;background:radial-gradient(ellipse at 50% 30%,#1a2a4a,#0d1117)}
.logo{font-size:72px;animation:fl 3s ease-in-out infinite;filter:drop-shadow(0 0 20px #f0c04080)}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.ttl{font-size:38px;font-weight:900;color:#f0c040;letter-spacing:-1px;margin:8px 0 4px;text-shadow:0 0 30px #f0c04060}
.sub{color:#8b949e;font-size:13px;margin-bottom:40px}
.lbtns{width:100%;display:flex;flex-direction:column;gap:12px}
#setup{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:24px;position:relative}
.backbtn{position:absolute;top:14px;left:14px;background:none;border:none;color:#8b949e;font-size:26px;cursor:pointer}
.btn{border:none;border-radius:13px;padding:14px 18px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;width:100%;-webkit-tap-highlight-color:transparent;transition:transform .1s,opacity .1s}
.btn:active{transform:scale(.96);opacity:.85}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.gold{background:#f0c040;color:#1a1a2e;box-shadow:0 4px 18px #f0c04040}
.bblue{background:#4fc3f7;color:#0d1117}
.bgreen{background:#2ecc71;color:#fff}
.bgray{background:#2d333b;color:#e6edf3}
.bred{background:#e74c3c;color:#fff}
.bsm{padding:10px 14px;font-size:13px;border-radius:10px}
.brow{display:flex;gap:8px}\n.brow .btn{flex:1}
.inp{background:#1c2128;border:1px solid #30363d;border-radius:11px;padding:13px 15px;color:#e6edf3;font-size:15px;font-family:'Noto Sans KR',sans-serif;outline:none;width:100%}
.inp:focus{border-color:#f0c040}
.inp::placeholder{color:#8b949e}

/* 캐릭터 선택 슬롯 CSS */
.char-selector {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  margin: 8px 0;
}
.char-opt {
  background: #1c2128;
  border: 2px solid #30363d;
  border-radius: 12px;
  padding: 8px 4px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
}
.char-opt.selected {
  border-color: #f0c040;
  background: #2a2010;
  box-shadow: 0 0 10px rgba(240,192,64,0.3);
}
.char-sprite {
  width: 40px;
  height: 40px;
  margin: 0 auto 4px;
  background-image: url('https://i.imgur.com/kP1oP7o.png');
  background-size: 200px 200px;
  image-rendering: pixelated; /* 도트 깨짐 방지 */
}
.sprite-david { background-position: 0px 0px; }
.sprite-moses { background-position: -40px 0px; }
.sprite-joshua { background-position: -80px 0px; }
.sprite-esther { background-position: -120px 0px; }
.sprite-joseph { background-position: -160px 0px; }

.char-name-lbl {
  font-size: 11px;
  font-weight: 700;
  color: #8b949e;
}
.char-opt.selected .char-name-lbl {
  color: #f0c040;
}

/* 실제 인게임 보드판 내 말 크기 설정 */
.pawn-circle {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background-size: 120px 120px;
  image-rendering: pixelated;
  display: inline-block;
  border: 1px solid rgba(255,255,255,0.2);
}
.pawn-david { background-image: url('https://i.imgur.com/kP1oP7o.png'); background-position: 0px 0px; }
.pawn-moses { background-image: url('https://i.imgur.com/kP1oP7o.png'); background-position: -24px 0px; }
.pawn-joshua { background-image: url('https://i.imgur.com/kP1oP7o.png'); background-position: -48px 0px; }
.pawn-esther { background-image: url('https://i.imgur.com/kP1oP7o.png'); background-position: -72px 0px; }
.pawn-joseph { background-image: url('https://i.imgur.com/kP1oP7o.png'); background-position: -96px 0px; }

#game{flex:1;display:flex;flex-direction:column;overflow:hidden}
.ghdr{background:#161b22;padding:7px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #30363d;flex-shrink:0;gap:6px}
.gtitle{font-weight:900;color:#f0c040;font-size:14px}
.rbadge{background:#0f3460;color:#4fc3f7;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:700}
.timerbx{font-size:12px;font-weight:900;padding:3px 9px;border-radius:20px;background:#1a2e1a;border:1px solid #2ecc71;color:#2ecc71}

.tbar{padding:7px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #30363d;flex-shrink:0}
.tbar.my{background:linear-gradient(90deg,#1a3a1a,#162e16)}
.tbar.other{background:#1c2128}
.mybadge{background:#2ecc71;color:#fff;font-size:11px;font-weight:900;padding:3px 10px;border-radius:20px;animation:pu 1s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.6}}
.tabs{display:flex;border-bottom:1px solid #30363d;flex-shrink:0}
.tab{flex:1;padding:8px 0;background:none;border:none;color:#8b949e;font-family:'Noto Sans KR',sans-serif;font-size:11px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:#f0c040;border-bottom-color:#f0c040;background:#161b22}
.tcwrap{flex:1;overflow:hidden;position:relative}
.tc{position:absolute;inset:0;overflow-y:auto;padding:10px}
.abar{flex-shrink:0;background:#0d1117;border-top:1px solid #30363d;padding:10px 12px;max-height:45vh;overflow-y:auto}
.sq-item{display:flex;align-items:center;gap:8px;border-radius:10px;padding:8px 10px;margin-bottom:4px;border:2px solid #30363d;background:#161b22;position:relative}
.sq-item.mine{background:#0a2010;border-color:#2ecc71}
.sq-item.others{background:#0a1030;border-color:#3498db}
.sq-item.me-here{border-color:#f0c040!important;background:#2a2010!important;box-shadow:0 0 12px #f0c04060!important}
.sq-item.special{background:#1a1a2e;border-color:#2a3a5a}
.sq-item.key-sq{background:#2a2010;border-color:#6a5010}
.pchips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.pchip{border-radius:9px;padding:6px 8px;border:1px solid transparent;font-size:9px}
.pchip.cur{border-color:#f0c040}
.dice-wrap{display:flex;gap:14px;justify-content:center;margin-bottom:8px}
.die{width:52px;height:52px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 3px 12px rgba(0,0,0,.5);border:2px solid #ddd}
.die.dbl{border-color:#f0c040;box-shadow:0 3px 18px #f0c04080}
.die.rolling{animation:dr .5s ease-in-out infinite alternate}
@keyframes dr{0%{transform:rotate(-15deg) scale(.9)}100%{transform:rotate(15deg) scale(1.1)}}
.dbl-badge{background:#f0c040;color:#1a1a2e;font-size:12px;font-weight:900;padding:2px 12px;border-radius:20px;display:inline-block;margin-bottom:4px}

.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#1c2128;border:1px solid #30363d;border-radius:20px;padding:7px 16px;font-size:12px;color:#e6edf3;z-index:300;pointer-events:none;max-width:88vw;text-align:center;animation:tin .3s ease}

.mov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:flex-end;justify-content:center;z-index:200;max-width:500px;margin:0 auto}
.mo{background:#1c2128;border-radius:20px 20px 0 0;padding:20px 18px 28px;width:100%;border-top:1px solid #30363d;max-height:88vh;overflow-y:auto}

.opp-dice{background:#1c2128;border:1px solid #30363d;border-radius:10px;padding:7px 10px;margin-bottom:6px;display:flex;align-items:center;gap:8px;font-size:12px}
.shdr{font-size:10px;font-weight:900;color:#f0c040;letter-spacing:.5px;padding:8px 4px 3px;border-bottom:1px solid #2a3040;margin-bottom:5px}

var db,rRef,gRef,lRef;
var myId="",myName="",roomId="",gs=null,pa=null,selTime=0,smode="create";
var diceResult=null;

function initFB(){
  if(db) return true;
  try{
    firebase.initializeApp(FC);
    db=firebase.database();
    return true;
  } catch(e){
    alert("Firebase 연결 오류");
    return false;
  }
}

// 플레이어 정보 생성 시 선택한 캐릭터가 정확히 바인딩되도록 수정
function mkP(idx){
  var lblIdx = CNAMES.indexOf(chosenChar);
  return {
    id:myId, name:myName, money:cm(), pos:0, lands:[], stars:0,
    inWilderness:false, wildernessCount:0, cards:[],
    color:CL[idx],
    charName:chosenChar, // 선택된 영문 캐릭터 명
    charLabel:CLABELS[lblIdx]||"성도", // 한글 이름 라벨
    bankrupt:false
  };
}

function showSetup(m){
  if(!initFB()) return;
  smode=m;
  g("sico").textContent=m==="create"?"🏠":"🚪";
  g("stitle").textContent=m==="create"?"방 만들기":"방 참가하기";
  g("ri").classList.toggle("gone",m!=="join");
  g("tw").classList.toggle("gone",m!=="create");
  g("serr").style.display="none";g("ni").value="";
  var sbtn=g("setup").querySelector(".btn.gold:last-of-type");
  if(sbtn)sbtn.textContent=m==="create"?"방 생성":"참가하기";
  showScr("setup");
}

function handleSetup(){
  var nm=g("ni").value.trim();
  if(!nm){showErr("닉네임을 입력해주세요");return;}
  g("sld").classList.remove("gone");
  g("serr").style.display="none";
  if(smode==="create"){createRoom(nm);}
  else{
    var cd=g("rc").value.trim().toUpperCase();
    if(!cd||cd.length!==5){showErr("방 코드를 입력해주세요");return;}
    joinRoom(nm,cd);
  }
}
function showErr(msg){
  g("serr").textContent=msg;g("serr").style.display="block";g("sld").classList.add("gone");
}

function createRoom(nm){
  myId="p_"+Math.random().toString(36).slice(2,9);myName=nm;
  roomId=Math.random().toString(36).slice(2,7).toUpperCase();
  var st={phase:"waiting",players:[mkP(0)],currentTurn:0,landOwners:{},offeringPool:0,
    keyDeck:shuf(KC.map(function(c){return c.id;})),
    consecutiveDoubles:0,hostId:myId,timeLimitMin:selTime,startTime:0,
    needAction:false,lastDice:null};
  rRef=db.ref("rooms/"+roomId);gRef=db.ref("rooms/"+roomId+"/state");lRef=db.ref("rooms/"+roomId+"/log");
  rRef.set({state:st,log:{0:myName+"님이 방을 개설했습니다!"}}).then(enterGame);
}

function joinRoom(nm,cd){
  db.ref("rooms/"+cd).once("value").then(function(snap){
    if(!snap.exists()){showErr("방을 찾을 수 없습니다");return;}
    var d=snap.val();
    var pl=d.state.players||[];
    myId="p_"+Math.random().toString(36).slice(2,9);roomId=cd;myName=nm;
    var np=mkP(pl.length);pl.push(np);
    rRef=db.ref("rooms/"+roomId);gRef=db.ref("rooms/"+roomId+"/state");lRef=db.ref("rooms/"+roomId+"/log");
    gRef.update({players:pl}).then(function(){lRef.push(myName+"님 합류! 👋");enterGame();});
  });
}

function enterGame(){
  g("rbadge").textContent="코드: "+roomId;
  showScr("game");g("bag-btn").style.display="flex";
  gRef.on("value",function(snap){
    if(!snap.exists())return;
    var prev=gs;gs=snap.val();
    if(gs.lastDice&&gs.lastDice.playerId!==myId){
      if(!prev||!prev.lastDice||prev.lastDice.ts!==gs.lastDice.ts)showOppDice(gs.lastDice);
    }
    renderGame();updateTimer();updateBag();
  });
  lRef.on("value",function(snap){
    if(!snap.exists())return;
    var es=Object.values(snap.val()).reverse();
    g("tl").innerHTML=es.map(function(e){
      return"<div style='background:#161b22;border-radius:7px;padding:6px 9px;margin-bottom:4px;font-size:11px;color:#c9d1d9'>"+e+"</div>";
    }).join("");
  });
}

function updateTimer(){
  var lim=gs&&gs.timeLimitMin||0;
  if(!lim||!gs.startTime||gs.phase!=="playing"){g("tmr").classList.add("gone");return;}
  g("tmr").classList.remove("gone");
  var left=Math.max(0,lim*60-Math.floor((Date.now()-gs.startTime)/1000));
  var mm=Math.floor(left/60),ss=left%60;
  g("tmr").textContent=(mm<10?"0":"")+mm+":"+(ss<10?"0":"")+ss;
}

function updateBag(){
  var me=gs&&gs.players&&gs.players.find(function(p){return p.id===myId;});
  var cnt=(me&&me.cards&&me.cards.length)||0;
  g("bag-count").textContent=cnt;
  g("bag-btn").style.display=cnt>0?"flex":"none";
}

function renderGame(){
  if(!gs)return;
  if(gs.phase==="waiting"){
    g("pwait").classList.remove("gone");g("pplay").classList.add("gone");
    g("wpl").innerHTML=gs.players.map(function(p){
      var m=p.id===myId?"<span style='color:#4fc3f7;font-size:10px'>(나)</span>":"";
      return"<div style='background:#161b22;border-radius:10px;padding:9px 12px;margin-bottom:7px;display:flex;align-items:center;gap:9px;border:1px solid #30363d'>"
        +"<div class='pawn-circle pawn-"+p.charName+"' style='width:32px;height:32px;background-size:160px 160px;'></div>"
        +"<div><span style='color:"+p.color+";font-weight:700'>"+p.name+"</span> ("+p.charLabel+") "+m+"</div></div>";
    }).join("");
    var isH=gs.players[0]&&gs.players[0].id===myId;
    g("bstart").classList.toggle("gone",!isH);g("whint").classList.toggle("gone",isH);
  } else {
    g("pwait").classList.add("gone");g("pplay").classList.remove("gone");
    var cur=gs.players[gs.currentTurn];
    var isMT=cur&&cur.id===myId&&!cur.bankrupt;
    var me=gs.players.find(function(p){return p.id===myId;});
    g("tbar").className="tbar "+(isMT?"my":"other");
    g("tcharicon").className="pawn-circle pawn-"+(cur?cur.charName:"david");
    g("tname").textContent=cur?cur.name:"";g("mbadge").classList.toggle("gone",!isMT);
    renderBoard(me);renderInfo(me);
    if(me&&!me.bankrupt){
      if(isMT)renderActions(me);
      else g("ac").innerHTML="<div style='text-align:center;color:#8b949e;font-size:12px'>"+cur.name+"님의 차례 대기 중...</div>";
    }
  }
}

function renderBoard(me){
  var own=gs.landOwners||{},bp={};
  gs.players.forEach(function(p){if(!p.bankrupt)(bp[p.pos]=bp[p.pos]||[]).push(p);});

  var chips="<div class='pchips'>"+gs.players.map(function(p){
    var isCur=gs.players[gs.currentTurn]&&gs.players[gs.currentTurn].id===p.id;
    return"<div class='pchip"+(isCur?" cur":"")+"' style='background:"+p.color+"22;border-color:"+(isCur?"#f0c040":"#30363d")+"'>"
      +"<div style='display:flex;align-items:center;gap:4px'><div class='pawn-circle pawn-"+p.charName+"'></div><span style='color:"+p.color+";font-weight:700'>"+p.name+"</span></div>"
      +"<div style='color:#f0c040;font-size:9px'>💰"+p.money+"만</div></div>";
  }).join("")+"</div>";

  var secLabels={0:"🚩 시작/마침",1:"1️⃣ 1열",14:"🏜️ 광야",15:"2️⃣ 2열",33:"🚂 구원열차",34:"3️⃣ 3열",47:"💌 사랑의 헌금",48:"4️⃣ 4열"};
  var rows=SQ.map(function(s){
    var h=bp[s.id]||[];var op=own[s.id]?gs.players.find(function(p){return p.id===own[s.id];}):null;
    var isMine=op&&op.id===myId,isOther=op&&!isMine,isHere=h.some(function(p){return p.id===myId;});
    var cls="sq-item"+(s.type!=="land"?" special":"")+(isMine?" mine":isOther?" others":"")+(isHere?" me-here":"");
    var pd=h.map(function(p){return"<div class='pawn-circle pawn-"+p.charName+"' style='box-shadow:0 0 5px "+p.color+"'></div>";}).join("");
    var right=s.type==="land"?"<div style='text-align:right'><div style='font-size:11px;color:#4fc3f7;font-weight:700'>"+s.price+"만</div><div style='font-size:9px;color:#e74c3c'>🚶"+s.toll+"만</div></div>":"";
    var sec=secLabels[s.id]?"<div class='shdr'>"+secLabels[s.id]+"</div>":"";
    return sec+"<div class='"+cls+"' data-id='"+s.id+"'>"
      +"<span style='font-size:10px;color:#8b949e;width:14px'>"+s.id+"</span>"
      +"<div style='flex:1'><div style='font-size:13px;font-weight:700'>"+s.name+"</div><div style='font-size:10px;color:#8b949e'>"+s.desc+"</div></div>"
      +right+(pd?"<div style='display:flex;gap:2px;margin-left:4px'>"+pd+"</div>":"")+"</div>";
  }).join("");

  g("tb").innerHTML=chips+rows;
}

function renderInfo(me){
  if(!me)return;
  var ml=(me.lands||[]).map(function(pos){return SQ[pos];});
  g("ti").innerHTML="<div style='background:#1c2128;border-radius:12px;padding:12px;border:1px solid "+me.color+"40'>"
    +"<div style='display:flex;align-items:center;gap:8px;margin-bottom:8px'><div class='pawn-circle pawn-"+me.charName+"' style='width:36px;height:36px;background-size:180px 180px'></div>"
    +"<div><div style='font-weight:900;color:"+me.color+"'>"+me.name+" ("+me.charLabel+")</div><div style='font-size:13px;color:#f0c040'>자산: "+me.money+"만원</div></div></div>"
    +"<div style='font-size:11px;color:#8b949e'>🏛️ 보유 기지: "+ml.map(function(l){return l.name;}).join(", ")+"</div></div>";
}

function renderActions(me){
  var da=g("darea"),ac=g("ac"),own=gs.landOwners||{};
  da.classList.remove("gone");
  if(diceResult){
    ac.innerHTML="<button class='btn gold' onclick='doMove()'>📍 이동하기</button>";return;
  }
  g("darea").innerHTML="<div class='dice-wrap'><div class='die' style='opacity:.4'>🎲</div><div class='die' style='opacity:.4'>🎲</div></div>";
  
  var sq=SQ[me.pos];
  if(sq.type==="land"&&!own[me.pos]&&gs.needAction){
    da.classList.add("gone");
    ac.innerHTML="<div style='color:#f0c040;font-size:12px;margin-bottom:6px'>"+sq.name+"을 개척하시겠습니까? (비용: "+sq.price+"만)</div>"
      +"<div class='brow'><button class='btn bgreen bsm' onclick='buyLand()'>🏡 개척</button><button class='btn bgray bsm' onclick='skipBuy()'>⏭️ 패스</button></div>";return;
  }
  if(pa&&pa.type==="toll"){
    da.classList.add("gone");
    ac.innerHTML="<div style='color:#e74c3c;font-size:12px;margin-bottom:6px'>선교 통행료 "+pa.toll+"만원을 지불해야 합니다.</div>"
      +"<button class='btn bred' onclick='payToll()'>💸 지불하기</button>";return;
  }
  ac.innerHTML="<button class='btn gold' onclick='rollDice()'>🎲 주사위 던지기</button>";
}

function showOppDice(d){
  var area=g("oppd");area.classList.remove("gone");
  area.innerHTML="<div class='opp-dice'><span>"+d.name+" 결과: "+DF[d.d1]+" + "+DF[d.d2]+"</span></div>";
  setTimeout(function(){area.classList.add("gone");},3000);
}

function rollDice(){
  var d1=Math.floor(Math.random()*6)+1,d2=Math.floor(Math.random()*6)+1;
  diceResult={d1:d1,d2:d2};
  gRef.update({lastDice:{d1:d1,d2:d2,playerId:myId,name:myName,ts:Date.now()}});
  g("darea").innerHTML="<div class='dice-wrap'><div class='die'>"+DF[d1]+"</div><div class='die'>"+DF[d2]+"</div></div>";
  renderActions(gs.players[gs.currentTurn]);
}

// 오직 스크롤로만 타겟 칸을 찾아 따라가는 부드러운 카메라 무빙 함수 고정
function animateMove(from, to, me2, cb) {
  var targetEl = document.querySelector(".sq-item[data-id='" + to + "']");
  if (targetEl) {
    targetEl.scrollIntoView({ behavior: "smooth", block: "center" });
  }
  cb(); // 버벅임 유발하는 딜레이 없이 규칙 제어 콜백 즉시 호출
}

function doMove(){
  var d1=diceResult.d1, d2=diceResult.d2; diceResult=null;
  var st=JSON.parse(JSON.stringify(gs));var cur=st.players[st.currentTurn];
  var steps=d1+d2,old=cur.pos,np=(old+steps)%TOTAL;
  
  if(old+steps>=TOTAL) cur.money+=50;
  
  animateMove(old,np,cur,function(){
    cur.pos=np;var sq=SQ[np];var need=false;
    if(sq.type==="land"){
      var oid=st.landOwners[np];
      if(!oid){need=true;st.needAction=true;}
      else if(oid!==cur.id){
        pa={type:"toll",toll:sq.toll,ownerId:oid};need=true;st.needAction=true;
      }
    } else if(sq.type==="offering"){
      cur.money=Math.max(0,cur.money-50);st.offeringPool+=50;
    }
    if(!need) advTurn(st);
    gRef.set(st);
  });
}

function buyLand(){
  var st=JSON.parse(JSON.stringify(gs));var cur=st.players[st.currentTurn];var sq=SQ[cur.pos];
  cur.money-=sq.price;st.landOwners[cur.pos]=cur.id;cur.lands.push(cur.pos);
  advTurn(st);pa=null;gRef.set(st);
}
function skipBuy(){var st=JSON.parse(JSON.stringify(gs));advTurn(st);pa=null;gRef.set(st);}
function payToll(){
  var st=JSON.parse(JSON.stringify(gs));var cur=st.players[st.currentTurn];
  var ow=st.players.find(function(p){return p.id===pa.ownerId;});
  cur.money-=pa.toll;if(ow)ow.money+=pa.toll;
  pa=null;advTurn(st);gRef.set(st);
}
function advTurn(st){st.currentTurn=(st.currentTurn+1)%st.players.length;st.needAction=false;}
function startGame(){var st=JSON.stringify(gs);var o=JSON.parse(st);o.phase="playing";o.startTime=Date.now();gRef.set(o);}
</script>
