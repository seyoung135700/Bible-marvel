*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Noto Sans KR',sans-serif;overflow:hidden;background:#0d1117}
#app{height:100dvh;display:flex;flex-direction:column;max-width:500px;margin:0 auto;background:#0d1117;color:#e6edf3;position:relative;overflow:hidden}
.gone{display:none!important}
/* LOBBY */
#lobby{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:32px 24px;background:radial-gradient(ellipse at 50% 30%,#1a2a4a,#0d1117)}
.logo{font-size:72px;animation:fl 3s ease-in-out infinite;filter:drop-shadow(0 0 20px #f0c04080)}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.ttl{font-size:38px;font-weight:900;color:#f0c040;letter-spacing:-1px;margin:8px 0 4px;text-shadow:0 0 30px #f0c04060}
.sub{color:#8b949e;font-size:13px;margin-bottom:40px}
.lbtns{width:100%;display:flex;flex-direction:column;gap:12px}
/* SETUP */
#setup{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:24px;position:relative}
.backbtn{position:absolute;top:14px;left:14px;background:none;border:none;color:#8b949e;font-size:26px;cursor:pointer}
/* BUTTONS */
.btn{border:none;border-radius:13px;padding:14px 18px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;width:100%;-webkit-tap-highlight-color:transparent;transition:transform .1s,opacity .1s}
.btn:active{transform:scale(.96);opacity:.85}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.gold{background:#f0c040;color:#1a1a2e;box-shadow:0 4px 18px #f0c04040}
.bblue{background:#4fc3f7;color:#0d1117}
.bgreen{background:#2ecc71;color:#fff}
.bgray{background:#2d333b;color:#e6edf3}
.bred{background:#e74c3c;color:#fff}
.bsm{padding:10px 14px;font-size:13px;border-radius:10px}
.brow{display:flex;gap:8px}.brow .btn{flex:1}
.inp{background:#1c2128;border:1px solid #30363d;border-radius:11px;padding:13px 15px;color:#e6edf3;font-size:15px;font-family:'Noto Sans KR',sans-serif;outline:none;width:100%}
.inp:focus{border-color:#f0c040}
.inp::placeholder{color:#8b949e}
/* GAME */
#game{flex:1;display:flex;flex-direction:column;overflow:hidden}
.ghdr{background:#161b22;padding:7px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #30363d;flex-shrink:0;gap:6px}
.gtitle{font-weight:900;color:#f0c040;font-size:14px}
.rbadge{background:#0f3460;color:#4fc3f7;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:700}
.timerbx{font-size:12px;font-weight:900;padding:3px 9px;border-radius:20px;background:#1a2e1a;border:1px solid #2ecc71;color:#2ecc71}
.timerbx.warn{background:#2e1a1a;border-color:#e74c3c;color:#e74c3c}
.tbar{padding:7px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #30363d;flex-shrink:0}
.tbar.my{background:linear-gradient(90deg,#1a3a1a,#162e16)}
.tbar.other{background:#1c2128}
.mybadge{background:#2ecc71;color:#fff;font-size:11px;font-weight:900;padding:3px 10px;border-radius:20px;animation:pu 1s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.6}}
.tabs{display:flex;border-bottom:1px solid #30363d;flex-shrink:0}
.tab{flex:1;padding:8px 0;background:none;border:none;color:#8b949e;font-family:'Noto Sans KR',sans-serif;font-size:11px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:#f0c040;border-bottom-color:#f0c040;background:#161b22}
.tcwrap{flex:1;overflow:hidden;position:relative}
.tc{position:absolute;inset:0;overflow-y:auto;padding:10px}
#tb{padding:0!important}
.abar{flex-shrink:0;background:#0d1117;border-top:1px solid #30363d;padding:10px 12px;max-height:45vh;overflow-y:auto}
/* BOARD CANVAS */
#board-wrap{position:relative;width:100%;height:100%;overflow-y:auto}
#board-canvas{display:block;cursor:pointer}
#board-chips{position:sticky;top:0;left:0;right:0;display:flex;gap:5px;flex-wrap:wrap;padding:6px;background:rgba(13,17,23,0.9);z-index:10;border-bottom:1px solid #30363d}
.pchip{border-radius:8px;padding:5px 7px;border:1px solid transparent;font-size:9px}
/* DICE */
.dice-wrap{display:flex;gap:14px;justify-content:center;margin-bottom:8px}
.die{width:52px;height:52px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 3px 12px rgba(0,0,0,.5);border:2px solid #ddd}
.die.dbl{border-color:#f0c040;box-shadow:0 3px 18px #f0c04080}
.die.rolling{animation:dr .5s ease-in-out infinite alternate}
@keyframes dr{0%{transform:rotate(-15deg) scale(.9)}100%{transform:rotate(15deg) scale(1.1)}}
.dbl-badge{background:#f0c040;color:#1a1a2e;font-size:12px;font-weight:900;padding:2px 12px;border-radius:20px;display:inline-block;margin-bottom:4px}
/* CARD FLIP */
.card-flip-wrap{perspective:600px;width:190px;margin:0 auto 10px;height:125px;cursor:pointer}
.card-flip{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .6s ease}
.card-flip.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;padding:12px}
.card-front{background:linear-gradient(135deg,#2a2010,#1a1508);border:2px solid #a07820}
.card-back{background:linear-gradient(135deg,#1a2a3a,#0a1a2a);border:2px solid #4a7090;transform:rotateY(180deg)}
/* MOVING PAWN */
.pawn-moving{position:fixed;z-index:500;pointer-events:none;width:40px;height:40px;border-radius:50%;overflow:hidden;transition:top .26s cubic-bezier(.4,0,.2,1),left .26s cubic-bezier(.4,0,.2,1)}
/* TOAST */
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#1c2128;border:1px solid #30363d;border-radius:20px;padding:7px 16px;font-size:12px;color:#e6edf3;z-index:300;white-space:nowrap;animation:tin .3s ease;pointer-events:none;max-width:90vw;white-space:normal;text-align:center}
@keyframes tin{from{opacity:0;top:70px}to{opacity:1;top:80px}}
/* MODAL */
.mov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:flex-end;justify-content:center;z-index:200;max-width:500px;margin:0 auto}
.mo{background:#1c2128;border-radius:20px 20px 0 0;padding:20px 18px 28px;width:100%;border-top:1px solid #30363d;max-height:88vh;overflow-y:auto}
.mo-title{font-size:17px;font-weight:900;color:#f0c040;margin-bottom:10px}
/* BAG */
.bag-btn{position:fixed;bottom:80px;right:16px;background:#9b59b6;border:none;border-radius:50%;width:48px;height:48px;font-size:22px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.4);z-index:50;display:flex;align-items:center;justify-content:center}
.bag-count{position:absolute;top:-2px;right:-2px;background:#e74c3c;color:#fff;font-size:9px;font-weight:900;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center}
/* OPP DICE */
.opp-dice{background:#1c2128;border:1px solid #30363d;border-radius:10px;padding:7px 10px;margin-bottom:6px;display:flex;align-items:center;gap:8px;font-size:12px}
.opp-die{width:32px;height:32px;background:#fff;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:18px;border:2px solid #ddd}
.opp-die.dbl{border-color:#f0c040}
/* RANK */
.rank-card{background:#1c2128;border-radius:12px;padding:12px;margin-bottom:7px;display:flex;align-items:center;gap:10px;border:1px solid #30363d}
.spin{display:inline-block;width:18px;height:18px;border:2px solid #30363d;border-top-color:#f0c040;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:4px}
</style>
</head>

function showToast(msg,dur){

  t=document.createElement("div");t.className="toast";t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},dur||2500);
}
